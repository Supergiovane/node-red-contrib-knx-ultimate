    </label>
    <input type="text" id="node-input-serverHue">
  </div>

  <div class="form-row hue-requires-bridge">
    <label for="node-input-name">
      <i class="fa fa-tag"></i> <span data-i18n="knxUltimateHueCameraMotion.hue_sensor"></span>
    </label>
    <input type="text" id="node-input-name" placeholder="Hue camera motion" style="flex:1 1 240px; min-width:240px; max-width:240px;">
    <button type="button" class="red-ui-button hue-refresh-devices" style="margin-left:6px; color:#1b7d33; border-color:#1b7d33;">
      <i class="fa fa-sync"></i>
    </button>
    <span class="hue-devices-loading" style="margin-left:6px; display:none; color:#1b7d33;">
      <i class="fa fa-circle-notch fa-spin"></i>
    </span>
  </div>

  <div id="tabs">
    <ul>
      <li><a href="#tabs-1"><i class="fa fa-video"></i> <span data-i18n="knxUltimateHueCameraMotion.tabs.motion"></span></a></li>
      <li><a href="#tabs-2"><i class="fa fa-gear"></i> <span data-i18n="knxUltimateHueCameraMotion.tabs.behaviour"></span></a></li>
    </ul>

    <div id="tabs-1">
      <div class="form-tips hue-form-tip hue-knx-section">
        <i class="fa fa-circle-info"></i>
        <span data-i18n="knxUltimateHueCameraMotion.motion_info"></span>
      </div>
      <div class="form-row hue-knx-section">
        <label for="node-input-GAcameraMotion" style="width:70px;"><span data-i18n="common.ga"></span></label>
        <input type="text" id="node-input-GAcameraMotion" placeholder="1/1/1" style="width:70px; text-align:left;">
        <label for="node-input-dptCameraMotion" style="width:32px; text-align:right;"><span data-i18n="common.dpt"></span></label>
        <select id="node-input-dptCameraMotion" style="width:110px;"></select>
        <label for="node-input-nameCameraMotion" style="width:50px; text-align:right;"><span data-i18n="common.name"></span></label>
        <input type="text" id="node-input-nameCameraMotion" style="flex:1 1 100px; min-width:100px; max-width:100%; text-align:left;" data-i18n="[placeholder]knxUltimateHueCameraMotion.tabs.motion">
      </div>
    </div>

    <div id="tabs-2">
      <div class="form-row">
        <label for="node-input-readStatusAtStartup" style="width:220px;">
          <i class="fa fa-question-circle"></i> <span data-i18n="knxUltimateHueCameraMotion.read_status_startup"></span>
        </label>
        <select id="node-input-readStatusAtStartup" style="width:200px;">
          <option value="yes" data-i18n="knxUltimateHueCameraMotion.opt_yes_emit"></option>
          <option value="no" data-i18n="knxUltimateHueCameraMotion.opt_no"></option>
        </select>
      </div>
      <div class="form-row">
        <label for="node-input-enableNodePINS" style="width:220px;">
          <i class="fa fa-code"></i> <span data-i18n="knxUltimateHueCameraMotion.node_pins"></span>
        </label>
        <select id="node-input-enableNodePINS" style="width:200px;">
          <option value="no" data-i18n="knxUltimateHueCameraMotion.node_pins_hide"></option>
          <option value="yes" data-i18n="knxUltimateHueCameraMotion.node_pins_show"></option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-tips hue-form-tip hue-output-info" style="display:none;">
    <i class="fa fa-circle-info"></i>
    <span data-i18n="knxUltimateHueCameraMotion.output_info"></span>
  </div>

  <input type="hidden" id="node-input-hueDevice">
