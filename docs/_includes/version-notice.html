{% if page.legacy_package %}

<aside class="docs-notice" aria-label="{{ t.archiveTitle }}">

  <p>{{ t.archive }}</p>
  <p><a href="https://supergiovane.github.io/node-red-contrib-{{ page.legacy_package }}-ultimate/{{ page.lang }}/index.html">{{ page.legacy_package | upcase }} Ultimate</a> · <a href="{{ t.migrationUrl | relative_url }}">{{ t.migration }}</a></p>
</aside>
