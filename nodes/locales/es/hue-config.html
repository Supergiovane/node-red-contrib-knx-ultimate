### Actualizar a KNX Ultimate 8

La versión 7 muestra un pequeño botón **Actualizar a v8** en la parte superior de este editor. Descarga una copia de los flujos, instala los paquetes HUE/Matter necesarios, convierte los nodos compatibles, realiza un Deploy completo, verifica los flujos guardados e instala la versión 8. Reinicia después el servicio Node-RED cuando se indique; recargar solo el navegador no es suficiente. Los nodos antiguos KNX AI detienen la operación automática.

[Guía completa de actualización](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/es-Upgrade-to-v8)

<br/>

<h1> <p Align = 'Center'> Philips Hue Nodos </p> </h1>
<br/>
<P align = 'Center'> <img src = 'https://raw.githubusercontent.com/supergiovane/node-red-contrib-knx-ultimate/master/img/huehub.jpg' width = '40%'> </p>

Este nodo registra Node-RED en el puente Hue y ahora realiza automáticamente el proceso de emparejamiento.

Introduce la IP del puente (o elige una de las detectadas automáticamente) y pulsa **CONNECT**. El editor seguirá consultando el puente y cerrará la ventana de espera en cuanto pulses el botón físico de enlace. Usa **CANCEL** si necesitas cancelar la espera y probar más tarde. Los campos de Nombre de usuario y Client Key permanecen editables para que puedas copiar o pegar las credenciales en cualquier momento.

¿Ya tienes las credenciales? Haz clic en **YA TENGO LAS CREDENCIALES** para mostrar los campos al instante e introducirlas manualmente sin esperar al botón del puente.

**General**

| Propiedad | Descripción |
|-|-|
| IP | Introduce la IP fija de tu puente Hue o selecciona uno de los puentes detectados automáticamente. |
| CONECTAR | Inicia el registro y espera al botón de enlace del puente. La ventana se cierra automáticamente cuando lo pulsas; utiliza **CANCEL** para detener la espera. |
| Nombre | Nombre del puente leído desde la Hue Bridge después de una conexión correcta. |
| Nombre de usuario | Nombre de usuario devuelto por la Hue Bridge tras el emparejamiento. El campo permanece editable para poder copiar, pegar o escribir el valor manualmente. |
| Clave del cliente | Clave del cliente devuelta por la Hue Bridge tras el emparejamiento. El campo permanece editable para poder copiar, pegar o escribir el valor manualmente. |
