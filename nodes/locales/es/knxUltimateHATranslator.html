**Obsoleto:** Este nodo dedicado sigue siendo compatible con los flujos existentes. Para los nuevos flujos usa **KNX Utility** y selecciona la función correspondiente. El nodo antiguo está oculto en la paleta y aparece con `(deprecated)` en el flujo. Su editor ofrece un botón para convertir todas las utilidades KNX antiguas compatibles en todos los flujos y subflujos tras confirmar. La conversión se realiza localmente en el navegador, conserva los ID, ajustes, conexiones y grupos y permite Deshacer. La confirmación cierra el editor del nodo actual y descarta los cambios sin guardar. Revisa el resultado antes de Deploy.

<p> Este nodo traduce el msg de entrada a valores válidos verdaderos/falsos. <p>

Puede traducir una carga útil de entrada, a valores booleanos verdaderos /falsos. <Br />
Cada fila en el cuadro de texto representa un comando de traducción.<br/>
Puede agregar su propia fila de traducción. <br/>

| Propiedad | Descripción |
|-|-|
|Nombre |El nombre del nodo.|
|Entrada |La propiedad de MSG de entrada a evaluar y traducir.|
|Traducir |Agregue, elimine o edite su propio comando de traducción.El comando de traducción de la fila debe ser **cadena de entrada de HA: valor KNX** (_knx value_ como verdadero o falso).Por ejemplo: <code> Open: true </code> <code> cerrado: falso </code>.|
