### Actualizar a KNX Ultimate 8

La versión 7 muestra un pequeño botón **Actualizar a v8** en la parte superior de este editor. Descarga una copia de los flujos, instala los paquetes HUE/Matter necesarios, convierte los nodos compatibles, realiza un Deploy completo, verifica los flujos guardados e instala la versión 8. Reinicia después el servicio Node-RED cuando se indique; recargar solo el navegador no es suficiente. Los nodos antiguos KNX AI detienen la operación automática.

[Guía completa de actualización](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/es-Upgrade-to-v8)

<br/>

**Obsoleto:** Este nodo dedicado sigue siendo compatible con los flujos existentes. Para los nuevos flujos usa **KNX Utility** y selecciona la función correspondiente. El nodo antiguo está oculto en la paleta y aparece con `(deprecated)` en el flujo. Su editor ofrece un botón para convertir todas las utilidades KNX antiguas compatibles en todos los flujos y subflujos tras confirmar. La conversión se realiza localmente en el navegador, conserva los ID, ajustes, conexiones y grupos y permite Deshacer. La confirmación cierra el editor del nodo actual y descarta los cambios sin guardar. Revisa el resultado antes de Deploy.

# KNX FECHA/HORA

Usa este nodo para **ajustar la fecha/hora en el bus KNX**.

Puede enviar:
- **DPT 19.001** a una *GA Fecha/Hora* (recomendado)
- **DPT 11.001** a una *GA Fecha* (opcional)
- **DPT 10.001** a una *GA Hora* (opcional)

## Cuándo envía

- Al desplegar/iniciar (opcional, con retardo)
- Envío periódico (opcional)
- En cada mensaje de entrada
- Botón del editor (enviar ahora)

## Payload de entrada

Si `msg.payload` está vacío, se envía la hora actual del sistema.

Soportado:
- `new Date()`
- timestamp (ms)
- string aceptado por `new Date("...")`
- `"now"`

## Salida

El nodo emite un mensaje por cada envío:
- `msg.payload`: la `Date` enviada
- `msg.sent`: array de `{ ga, dpt, name }`
- `msg.reason`: `input`, `startup`, `periodic` o `button`
