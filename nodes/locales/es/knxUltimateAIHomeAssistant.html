## KNX AI Home Assistant

Este nodo AI antiguo se conserva únicamente para los flujos existentes de la versión 7.

### Actualizar a KNX Ultimate 8

El pequeño botón **Actualizar a v8** de la parte superior del editor automatiza la actualización del paquete, pero se detiene intencionadamente antes de realizar cambios cuando este nodo está presente. Su configuración de AI no se puede convertir de forma segura a Cerebrum Ultimate. Sustituye o elimina manualmente el nodo y vuelve a ejecutar la actualización.

[Guía completa de actualización](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/es-Upgrade-to-v8)
