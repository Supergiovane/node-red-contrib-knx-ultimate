### Actualizar a KNX Ultimate 8

La versión 7 muestra un pequeño botón **Actualizar a v8** en la parte superior de este editor. Descarga una copia de los flujos, instala los paquetes HUE/Matter necesarios, convierte los nodos compatibles, realiza un Deploy completo, verifica los flujos guardados e instala la versión 8. Reinicia después el servicio Node-RED cuando se indique; recargar solo el navegador no es suficiente. Los nodos antiguos KNX AI detienen la operación automática.

[Guía completa de actualización](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/es-Upgrade-to-v8)

<br/>

# KNX Utility

Selecciona una función para cada nodo KNX Utility. Las funciones que usan el bus KNX requieren una pasarela; Home Assistant Translator procesa directamente los mensajes. El editor, el icono y los puertos se adaptan a la función seleccionada. KNX Device sigue siendo el nodo KNX principal.

El botón de conversión transforma los once tipos antiguos compatibles en todos los flows y subflows, localmente en el editor. Conserva los ID, ajustes, conexiones y grupos, incluidos los ID de valores AutoResponder y escenas guardadas, los nombres de variables GlobalContext y las rutas de archivos Logger. Revisa los flows antes de hacer Deploy. Un único Undo restaura los nodos originales. Cambiar de función conserva los borradores temporales; Cancelar deja intactos el nodo y las escenas guardados. Los nuevos AutoResponder empiezan con una lista de direcciones vacía. Los cambios de reglas de escena solo invalidan los valores aprendidos al hacer Deploy.

Tras confirmar y antes de modificar los nodos, el navegador inicia automáticamente la descarga de una copia JSON con fecha y hora de todos los flujos presentes en el editor, incluidas pestañas, subflujos, nodos de configuración, grupos y conexiones. El archivo usa el formato de exportación estándar de Node-RED y puede volver a importarse. Se excluyen las credenciales declaradas por los nodos, como en la exportación estándar. El navegador puede preguntar dónde guardar el archivo. Si no es posible preparar la copia o iniciar su descarga, no se convierte ningún nodo.

## Alerter

### Configuración del nodo de Alerter

Con el nodo Alerter, puede indicar una pantalla o al nodo de nodo-Contrib-TTS-Ulude (retroalimentación de audio) Si los dispositivos seleccionados son alertados, es decir, tienen carga útil **Verdadero** .
El nodo emite mensajes a intervalos especificados (un mensaje a la vez) que contienen los detalles de cada dispositivo alertado.Por ejemplo, el nodo puede decirle cuántas y qué ventanas están abiertas.<br/>
El nodo recibe los valores de los dispositivos directamente desde el bus KNX.Además, puede enviar mensajes personalizados al nodo, no vinculado a los dispositivos KNX.<br/>
La página de ejemplo explica cómo usar el nodo.<br/>

- **Gateway**

> Selecciona la pasarela KNX utilizada por este nodo.

- **Nombre**

> Nombre del nodo.

- **Tipo de inicio del ciclo de alerta**

> Aquí puede seleccionar el evento que se omitirá el inicio de enviar mensajes desde dispositivos alertados.

- **Intervalo entre cada MSG (en segundos)**

> Intervalo entre cada mensaje saliente desde el nodo.

## Dispositivos para monitorear

Aquí puede agregar dispositivos para monitorear.<br/>
Ingrese el nombre del dispositivo o su dirección de grupo.<br/>

## AutoResponder

 Este nodo responderá a las solicitudes de lectura del bus KNX.

El nodo registra todos los telegramas transmitidos al bus KNX y almacenan los valores en la memoria. \
Luego responde a las solicitudes de lectura enviando dicho valor memorizado de regreso al bus como solicitud. \
Si la dirección del grupo que se lee aún no tiene valor, el nodo responderá con un valor predeterminado. \
El nodo responderá solo a las direcciones de grupo especificadas en el campo **Responder a** JSON. \
Las nuevas instancias empiezan con `[]`. Añade solo las direcciones de grupo a las que el nodo debe responder.

**Configuración**

| Propiedad | Descripción |

|-|-|
|Puerta de entrada |Seleccione la puerta de enlace KNX para ser utilizada |
|Responder a |El nodo responderá a las solicitudes de lectura provenientes de las direcciones grupales especificadas en esta matriz JSON.El formato se especifica a continuación.|

<br/> ** Formato JSON ** El JSON es**siempre** una matriz de objeto, que contiene cada directiva.Cada directiva, le dice al nodo qué hacer.

| Propiedad | Descripción |
|-|-|
|nota | ** Clave de nota opcional** , para recordatorios.No se usará en ningún lado.|
|GA |La dirección grupal.También puede usar los ".." Wildchars, para la especidad de una gama de direcciones grupales.El ".." solo se puede usar con el nivel del tercer GA, Ej: ** 1/1/0..255** .Vea las muestras a continuación.|
|DPT |El punto de datos de la dirección del grupo, en el formato "1.001".Es ** opcional** Si se ha importado el archivo CSV ETS.|
|predeterminado |El valor enviado al bus en respuesta a una solicitud de lectura, cuando el valor de la dirección del grupo aún no ha sido memorizado por el nodo.| ** Comencemos con una directiva** El nodo de autoresponder responderá a las solicitudes de lectura para la dirección del grupo 2/7/1.Si aún no hay valor en la memoria, responderá con _true _. \ |
El archivo CSV ETS debe haberse importado, de lo contrario debe agregar la clave ** "DPT": "1.001" ** **.

```json

[
    {
        "ga": "2/7/1",
        "default": true
    }
]
```

** Directiva un poco más completa** El nodo de autoresponder responderá a las solicitudes de lectura para la dirección del grupo a partir del 3/1/1 al 3/1/22 incluida.Si aún no hay valor en la memoria, responderá con _false _. \
También hay una clave ** Nota** , simplemente como una nota de recordatorio.No se usará en ningún lado.

```json

[
    {
        "note": "Virtual sensors coming from Hikvision AX-Pro",
        "ga": "3/1/1..22",
        "dpt": "1.001",
        "default": false
    }
]
```

** Directivas concatenantes** El nodo de autoresponder responderá a las solicitudes de lectura para la dirección del grupo a partir del 2/2/5 al 2/2/21 incluida.Si aún no hay valor en la memoria, responderá con un valor de 25. \
El nodo de autoresponder también responderá a las solicitudes de lectura para la dirección del grupo 2/4/22.Si aún no hay valor en la memoria, responderá con el estado de cadena _unknown! _. \
Tenga en cuenta la ** coma** entre el objeto JSON de cada directiva.

```json

[
    {
        "note": "DALI garden virtual brightness %",
        "ga": "2/2/5..21",
        "default": 25
    },
    {
        "note": "Alarm armed status text",
        "ga": "2/4/22",
        "dpt": "16.001",
        "default": "Unknown status!"
    }
]
```

## Fecha / Hora

Envía la fecha y hora del sistema a las direcciones de grupo configuradas: **19.001** para fecha/hora, **11.001** para fecha y **10.001** para hora. Configura al menos una dirección; todas las direcciones configuradas reciben un telegrama. El autocompletado ETS sugiere direcciones compatibles.

Activa el envío al inicio con retardo, el envío periódico en segundos o minutos, o utiliza el botón del nodo desplegado para enviar de inmediato. El botón se habilita tras desplegar los cambios. Este perfil no tiene puertos de entrada ni salida.

Si la pasarela está desconectada, conserva el último envío pendiente y lo ejecuta al reconectarse.

## WatchDog

<p> Verifica la conexión a la puerta de enlace o a un dispositivo KNX específico </p>

### Watchdog

**¿Qué hace?**

1. Verifica la comunicación/conexión de la curación de KNX Bus enviando un telegrama a intervalos regulares, observando una respuesta y envía un MSG al flujo si se rompe una conexión a KNX Bus.Dos niveles de verificación, ver más abajo.
2. Cambia programáticamente los parámetros del nodo de configuración, por lo tanto, la conexión a su enrutador/interfaz KNX/IP (por ejemplo, si tiene 2 enrutadores KNX/IP y desea cambiar entre los dos para la copia de seguridad de la conexión).
3. Fuerza la conexión/desconexión de la puerta de enlace desde/hacia el bus KNX.

#### Comprobaciones de nivel de par de pares Ethernet y KNX Twisted

El perro guardián tiene dos niveles de verificación.

El primero, verifica solo la conexión entre KNX-Ultimate y la interfaz KNX/IP.

El segundo, verifica toda la ruta, desde el nodo de puerta de enlace ultimatizado KNX a Ethernet, luego hasta KNX TP Media y viceversa;Esto implica el uso de un dispositivo físico, respondiendo a las solicitudes de lectura.

El nodo WatchDog es un nodo poderoso para errores de señalización y problemas de conexión.<Br />

Puede enviar un correo electrónico al instalador KNX responsable de su edificio, o puede cambiar automáticamente a un enrutador/interfaz IP KNX/IP de copia de seguridad en su instalación.

### KNX Global Variable

Este nodo expone la dirección del grupo recibida del bus, a una variable global **** <br/>
¡Puede escribir en el bus KNX simplemente actualice la variable global! <br/>

#### Descripción general

Pon un nodo de contexto global en el flujo, luego dale un nombre. <br/>
El nombre que le da al nodo se convertirá en el nombre de la variable de contexto global. <br/>
Eso es todo. Por razones de seguridad, ** Cambie el nombre de nodo predeterminado** <br/>
Puede acceder a la variable global agregando el sufijo \ _read al nombre del nodo. <br/>
Puede habilitar/deshabilitar la variable de contexto global, o habilitar Readonly o leer/escribir en la ventana de configuración. <br/>
Puede emitir un comando de escritura de bus KNX, simplemente modifica el nombre de la variable global con sufijo \ _write. _ ** Después de que se han ejecutado los comandos, la variable global con sufijo \ _Write se vacía automáticamente, no para repetir infinitamente los comandos. ** _ <br/>

#### Ajustes

| Propiedad | Descripción |
|-|-|
| Puerta | La puerta de enlace KNX. |
| Nombre de la variable (sin espacios, solo chars [A-Z]) | Nombre del contexto global. Se crearán 2 variables con este nombre, una con sufijo \ _Read (para direcciones de grupo de lectura) y la otra con sufijo _write (para direcciones de grupo de escritura). Por ejemplo, si el nombre de la variable es "KnxGlobalContext", se crean las 2 variables KNXGLOBALContext \ _read y KnxGlobalContext \ _Write. Dado que la variable global es visible desde todos los nodos (incluso los no ultimatizos de KNX), por razones de seguridad, establece un nombre que no sea el predeterminado. Haga clic en el enlace de muestra en la parte inferior de la página. |
| Exponer como variable global | Elija si y cómo desea exponer la variable global. Si no tiene la intención de escribir en el autobús KNX, por seguridad, deje "solo leer". |
| Intervalo de escritura de autobús | El nodo verifica la variable con el sufijo \ _Write a intervalos regulares para escribir en el bus KNX. Elija el intervalo que prefiera. |

#### Propiedades de MSG

```javascript

// Properties of the variable, both in reading and in writing
{
    address : "0/0/1",
    dpt: "1.001", 
    payload: true,
    devicename:"Dinning Room->Table Light"
}

```

#### Obtenga el valor de la variable

```javascript

// This function reads the variable
// Remember: add the string "_READ" after the node name to read the variable
let GroupAddresses = global.get("KNXContextBanana_READ") || [];

// Outputs the array, as example
node.send({payload:GroupAddresses});

// Get the Group Address object, having address 0/0/10
let Ga = GroupAddresses.find(a => a.address === "0/0/10");

// Outputs the object, as example
node.send({ Found: Ga });

// Do some testing and output some stuffs.
if (Ga.payload === true) return {payload : "FOUND AND TRUE"};
if (Ga.payload === false) return {payload : "FOUND AND FALSE"};

```

#### Enviar telegrama KNX a través de la variable global

```javascript

// This function writes the value to the KNX bus
let GroupAddressesSend = [];
GroupAddressesSend.push({address: "0/0/10", dpt:"1.001", payload:msg.payload});

// You can also avoid setting datapoint.
// This works gread if you have imported the ETS file, otherwise it'll guess the datapoint type by analyzing the payload
GroupAddressesSend.push({address: "0/0/11", payload:msg.payload});

// Remember: add the string "_WRITE" after the node name to write to the bus
global.set("KNXContextBanana_WRITE",GroupAddressesSend);

```

<p> El nodo del registrador registra todos los telegramas y lo genera en un archivo compatible con XML de monitor de bus ETS. </p>

Puede guardar el archivo en el disco o enviarlo a un servidor FTP, por ejemplo.El archivo puede ser leído por su ETS, por ejemplo, para diagnóstico o para una repetición de los telegramas.
<br/>
El nodo también puede contar telegramas por segundo (o cualquier intervalo que desee).

<br/>

|-|-|

|Tema |El tema del nodo.|
|Nombre de nodo |Nombre del nodo.|

| Propiedad | Descripción |
|-|-|

## Luz de escalera

### Temporizador de escalera KNX

<p>El nodo Temporizador de escalera KNX reproduce el funcionamiento clásico de una luz de escaleras: escucha los impulsos de activación, gobierna el actuador, refleja el estado en una GA de feedback y respeta los comandos de override o bloqueo.</p>

**Direcciones de grupo**

|Propiedad|Descripción|
|--|--|
| GA impulso | Entrada binaria que arranca el temporizador cuando recibe `1`. Si se habilita “El valor 0 cancela el ciclo”, un `0` apaga la luz de inmediato. |
| GA salida | Actuador que permanece activo mientras dura el ciclo. Selecciona el DPT adecuado al tipo de carga. |
| GA estado | Refleja el estado activo/preaviso. En modo *Conmutar GA estado* cambia brevemente antes del apagado. |
| GA override | Mantiene la luz encendida y pausa el temporizador mientras permanece en `1`. |
| GA bloqueo | Con `1` ignora nuevos impulsos. La opción *Cuando está bloqueado* permite decidir si se debe forzar el apagado. |

**Comportamiento del temporizador**

|Opción|Descripción|
|--|--|
| Duración del temporizador | Duración base del ciclo de escalera. |
| Nuevo impulso | Define si reiniciar el temporizador, prolongarlo o ignorar los impulsos adicionales. |
| El valor 0 cancela el ciclo | Termina el ciclo con motivo `manual-off` cuando el impulso vuelve a `0`. |
| Cuando está bloqueado | Decide si el bloqueo solo impide impulsos o también apaga la salida. |

**Preaviso**

|Opción|Descripción|
|--|--|
| Enviar preaviso | Activa la alerta previa al apagado. |
| Aviso (segundos) | Cuántos segundos antes lanzar el aviso. |
| Modo de aviso | *Conmutar GA estado* cambia temporalmente la GA de estado. *Parpadear la salida* apaga y vuelve a encender la salida tras la duración indicada. |
| Duración del parpadeo | Milisegundos que la salida permanece apagada durante el parpadeo. |

**Salida del nodo**

- Con *Emitir eventos* habilitado el nodo genera objetos estructurados (`trigger`, `extend`, `prewarn`, `timeout`, `override`, `block`, `manual-off`) con información de `remaining`, `active`, `override`, `blocked`.
- Si no emites eventos puedes usar la GA de estado como feedback en el bus KNX.

#### Entradas

|Propiedad|Descripción|
|--|--|
| Entrada desde el flow | Envía `true`, `false`, `'open'` o `'close'` para iniciar o cancelar el temporizador. |
| Telegramas KNX | El nodo reacciona a las GA configuradas. |

#### Ejemplo en el flow

```javascript

// Iniciar el temporizador de escalera
msg.payload = true;
return msg;
```

```javascript
// Cancelar el ciclo (requiere "El valor 0 cancela el ciclo")
msg.payload = false;
return msg;
```

#### Salidas

|Propiedad|Descripción|
|--|--|
| Eventos (opcional) | Con eventos habilitados el nodo envía los objetos descritos anteriormente por la salida. |

## Garaje

### Puerta de garaje KNX

<p>El nodo Puerta de garaje KNX controla un portón motorizado mediante GA específicas para mandos booleanos o impulsos, mantiene abierto o deshabilita el funcionamiento, integra la fotocélula y la señal de obstrucción y puede cerrar automáticamente tras un tiempo.</p>

**Direcciones de mando**

|Propiedad|Descripción|
|--|--|
| GA mando (true=abre, false=cierra) | GA booleana (`gaCommand`): `true` abre y `false` cierra. DPT por defecto 1.001. |
| GA impulso | El flanco activo conmuta la puerta (`gaImpulse`, DPT 1.017). También se usa cuando no existe GA mando. |
| GA mantener abierto | Cancela la re-clausura automática mientras permanezca a true (`gaHoldOpen`). |
| GA deshabilitación | Bloquea cualquier comando generado por el nodo (`gaDisable`). |

**Direcciones de entrada/sensores**

|Propiedad|Descripción|
|--|--|
| GA fotocélula | Debe pasar a true cuando la fotocélula detecta un obstáculo (`gaPhotocell`). |
| GA movimiento | Pulso opcional cuando el nodo ordena el movimiento (`gaMoving`). |
| GA obstrucción | Refleja el estado de obstrucción detectado (`gaObstruction`). |

**Cierre automático**

- Activa *Cierre automático* para iniciar un temporizador cada vez que la puerta esté abierta.
- Mantener abierto o deshabilitar cancelan la cuenta atrás mientras sigan en true.
- Al expirar el temporizador el nodo envía el cierre (o impulso) y genera un evento `auto-close`.

**Seguridad**

- Una fotocélula en true durante el cierre hace que la puerta se abra de nuevo y marca obstrucción.
- Las escrituras externas sobre la GA obstrucción mantienen sincronizado el estado interno.
- Los pulsos de movimiento pueden alimentar ventilación, iluminación o alarmas.

#### Entradas

|Propiedad|Descripción|
|--|--|
| `msg.payload` | Acepta `true`, `false`, `'open'`, `'close'` o `'toggle'` para controlar la puerta desde el flow. |
| Telegramas KNX | Reacciona a las GA configuradas (mando, impulso, mantener abierto, deshabilitación, fotocélula, movimiento, obstrucción). |

#### Ejemplo en el flow

```javascript

// Abrir el portón
msg.payload = 'open'; // también acepta true
return msg;
```

```javascript
// Cerrar el portón
msg.payload = 'close'; // también acepta false
return msg;
```

```javascript
// Conmutar el estado del portón
msg.payload = 'toggle';
return msg;
```

#### Salidas

|Propiedad|Descripción|
|--|--|
| Eventos (opcional) | Con eventos activados el nodo envía objetos con `event`, `state`, `disabled`, `holdOpen`, `obstruction`. |

## Control de escenas

<p> El nodo de control de la escena se comporta exactamente como un dispositivo KNX de controlador de escena.Es capaz de guardar y recordar una escena. </p>

### Configuración del nodo del controlador de escena

|Propiedad |Descripción |
|------------ |---------------------------------------------------------------------------------------------------- |
|Puerta de entrada |Gateway Knx seleccionado.|
|Recuerdo de la escena | **DataPoint ** y**Valor de activación ** .Dirección grupal para el retiro de escena.Ejemplo 0/0/1.El controlador de la escena reaccionará a los telegramas provenientes de esta dirección grupal, para recordar la escena.El punto de datos es el tipo de punto de datos (DPT) de la dirección de grupo _Scene Recall_.El valor de activación es el valor que debe revivirse, para activar el retiro de la escena.**Recuerde ** : para activar una escena o guardar una escena a través de un comando DIM, colocar en el recuerdo de la escena o guardar la escena**Valor de activación** , el objeto correcto para la atenuación ({Dec \ _incr: 1, datos: 5} para un aumento tenue, {regoder \ _incr: 0, datos: 5} para disminución tenue) |
|Guardar escena | **DataPoint ** y**Valor de activación ** .Dirección grupal para guardar una escena.Ejemplo 0/0/2.El controlador de la escena reaccionará a los telegramas provenientes de esta dirección de grupo, guardando todos los valores actuales de todos los dispositivos en la escena, que se pueden recuperar más adelante.Cada vez que presione, o presione durante mucho tiempo un botón KNX real en su edificio, el controlador de la escena leerá los valores de todos los dispositivos en la escena y lo guardará en un almacenamiento no volátil.El punto de datos es el tipo de punto de datos (DPT) de la dirección de grupo _scene save_.El valor de activación es el valor que debe revivirse, para activar el ahorro de la escena.**Recuerde ** : para activar una escena o guardar una escena a través de un comando DIM, colocar en el recuerdo de la escena o guardar la escena**Valor de activación** , el objeto correcto para la atenuación ({Dec \ _incr: 1, datos: 5} para un aumento tenue, {regoder \ _incr: 0, datos: 5} para disminución tenue) |
|Nombre del nodo |Nombre del nodo, en el formato "Recordar: Nombre del dispositivo utilizado para recuperar la escena / Guardar: Nombre del dispositivo para guardar la escena".Pero puedes establecer el nombre que quieras.|
|Tema |Tema del nodo.|

#### Configuración de la escena

Debe agregar dispositivos a la escena, como un dispositivo KNX de controlador de escena real estándar.Esta es una lista, cada fila representa un dispositivo.

_ **El nodo de la escena guarda automáticamente los valores actualizados de todos los actuadores que pertenecen a la escena, cada vez que recibe un nuevo valor del bus.** _

|Propiedad |Descripción |
|------------- |---------------------------------------------------------------------------------------------------- |
|Botón Agregar |Agregue una fila a la lista.|
|Campo de la fila |El primer campo es la dirección de grupo, el segundo es el punto de datos, tercero es el valor predeterminado para este dispositivo en la escena (la función _scene save_ puede anular esto).A continuación, se encuentra el nombre del dispositivo. <br/> Para insertar un _Pause_, escriba **espera ** en el primer campo y un número en el último campo, que representa el tiempo (en milisegundos) de la pausa, por ejemplo**2000 ** <br/> <br> El comando**espera ** acepta también valores que indican segundos o horas. <BR> a un valor en segundo lugar, add**ssule, por ejemplo, los valores de los numéricos, por ejemplo, por ejemplo, por ejemplo, los valores de los numéricos.( ** 12s**) <br> Para establecer un valor en minutos, agregue ** m**después del valor numérico, por ejemplo ( ** 5m**) <br> Para establecer un valor en horas, agregue ** h**después del valor numérico, por ejemplo ( ** 1H** ) |
|Botón eliminar |Elimine un dispositivo de la lista.|

### Salida de mensajes desde el nodo del controlador de escena

```javascript

msg = {
    topic: "Scene Controller" <i>(Contains the node's topic, for example "MyTopic").</i>
    recallscene: <i>(<b>true</b> if a scene has been recalled, otherwise <b>false</b>).</i> 
    savescene: <i>(<b>true</b> if a scene has been saved, otherwise <b>false</b>).</i> 
    savevalue: <i>(<b>true</b> if a group address value belonging to an actuator in the scene, has been manually saved by a msg input, otherwise <b>false</b>).</i> 
    disabled: <i>(<b>true</b> if the scene controller has been disabled via input message msg.disabled = true, otherwise <b>false</b>).</i> 
}

```

---

### Mensaje de flujo de entrada

El nodo del controlador de la escena reacciona principalmente a los telegramas KNX y confía en eso para recordar y guardar escenas.

Sin embargo, puede recordar y guardar escenas enviando un mensaje al nodo.El controlador de la escena se puede deshabilitar para inhibir los comandos que provienen del autobús KNX. ** Recuerde una escena** 

```javascript

// Example of a function that recall the scene
msg.recallscene = true; 
return msg;

```

** Guardar una escena** 

```javascript

// Example of a function that saves the scene
msg.savescene = true; 
return msg;

```

** Guardar el valor actual de una dirección de grupo ** _**El nodo de la escena ya guarda los valores actualizados de todos los actuadores que pertenecen a la escena.** _

A veces es útil poder guardar el valor actual de una dirección de grupo que es diferente de la que ingresó en la escena, como el valor real del actuador de la escena.

Por ejemplo, un actuador de obturador generalmente tiene una dirección de grupo de comando y una de estado.

El nodo guarda la escena tomando valores de dirección de grupo de comando, que pueden no estar alineados con el valor de estado real.

Sin embargo, puede trabajar en torno a esto actualizando manualmente el valor de la dirección del grupo de comando, tomándolo desde la dirección del grupo de estado.

Piense en esto: si tiene un actuador ciego, tiene una dirección grupal para el movimiento, una dirección grupal para el paso, una dirección de grupo para la altura absoluta, etc. la única dirección grupal que conoce la posición exacta de la ciega, es la dirección de grupo ** Valor de altura absoluta** .<br/>

Con esta dirección de grupo de estado, puede actualizar las direcciones del grupo de comando de los actuadores ciegos que pertenecen a la escena.Consulte la muestra en el wiki.

```javascript

// Example of a function that saves the status of a blind actuator, belongind to the scene.
msg.savevalue = true; 
msg.topic = "0/1/1";
msg.payload = 70;
return msg;

```

** Desactivar Controlador de escena**

Puede deshabilitar el controlador de la escena (deshabilita la recepción del telegrama del bus KNX, pero el nodo aún acepta el mensaje de entrada del flujo en su lugar).En algún momento es aconsejable para deshabilitar el retiro y el salvamento de una escena, por ejemplo, cuando es de noche y llamas, desde un botón de empuje KNX, una "escena de TV" que levanta o baja una ciega, la escena no se recordará ni salvará.En cambio, puede habilitar otra escena, solo por la noche, por ejemplo, para atenuar una serie de luces.

```javascript

// Example of disabling the scene controller. The commands coming from KNX BUS will be disabled. The node still accept the input msg from the flow instead!
msg.disabled = true; // Otherwise "msg.disabled = false" to re-enable the node.
return msg;

```

## Control de cargas

### Nodo de control de carga KNX

<p> Con el nodo de control de carga puede administrar automáticamente la desconexión de las cargas (lavadora, horno, etc.) cuando el consumo de corriente excede un cierto umbral.

Los dispositivos se desactivan de manera inteligente, verificando el posible consumo del dispositivo para determinar si apagarlo con otros.<br/>
El nodo puede reactivar automáticamente las cargas.<br/>
El nodo apaga un dispositivo (o múltiples dispositivos) a la vez, según el orden que ha seleccionado. <BR/>

**General**

| Propiedad | Descripción |
|-|-|
|Puerta |KNX Gateway.También es posible no seleccionar ninguna puerta de enlace;En este caso, solo se considerarán mensajes entrantes al nodo.|
|Modo |Seleccione _Automático (interno)_ para usar Monitor W/umbrales/temporizadores. Seleccione _Manual (msg.shedding)_ para deshabilitar la lógica interna y usar solo `msg.shedding` (`shed`/`unshed`).|
|Monitor W |Dirección grupal que representa el consumo total de su edificio.|
|Soglia W |Umbral máximo que su medidor de electricidad puede soportar.Cuando se excede este umbral, el nodo comienza a apagar los dispositivos.|
|Retraso apagado (s) |Expresado en segundos, indica con qué frecuencia el nodo evaluará el consumo y apagará cada dispositivo.|
|Interruptor de retraso (s) (s) |Expresado en segundos, indica con qué frecuencia el nodo evaluará el consumo y encenderá cada dispositivo que se apagó.|

<br/>

**Control de carga**

Aquí puede agregar dispositivos para apagar en caso de sobrecarga.<br/>
Elija el dispositivo para apagar.Ingrese el nombre del dispositivo o su dirección de grupo.<br/>
Ingrese cualquier dirección de grupo que indique el consumo del dispositivo elegido en la primera línea. **Este es un parámetro opcional** .Si el dispositivo consume más de un cierto número de vatios, significa que está en uso.Si consume menos, el dispositivo se considerará "no en uso" y tanto esto como el siguiente se desactivarán a la vez. <br/>
Si _Automatic Recovery_ está habilitado, el dispositivo se reactiva automáticamente cuando expira el "retraso de reinicio".

#### entradas

| Propiedad | Descripción |
|-|-|
|`msg.readstatus = true` |Forzar la lectura de los valores del bus KNX de cada dispositivo en la lista._ **El nodo ya hace todo por sí mismo** _, pero si es necesario, es posible usar este comando para forzar una releer de los valores actuales en Watt. |
|`msg.enable = true` |Habilitar el control de carga. |
|`msg.disable = true` |Deshabilite el control de carga. |
|`msg.reset = true` |Restablecer los estados de nodo y encender todos los dispositivos. |
|`msg.shedding` |String. En modo _Manual_: `shed` apaga la siguiente carga, `unshed` restaura la anterior. En modo _Automático_: `shed`/`unshed` fuerza la lógica interna; `auto` restablece la supervisión normal.|

#### salidas

1. Salida estándar
: Payload (String | Object): la salida estándar del comando.

#### Detalles

```javascript

msg = {
  "topic": "Home Total Consumption", // Node Name
  "operation": "Increase Shedding" or "Decrease Shedding" or operation reflecting the input message (disable, enable, reset), // Operation
  "device": "Washing machine", // Device shedded
  "ga": "", // Group address of the shedded device
  "totalPowerConsumption": 3100, // Current power consumption
  "wattLimit": 3000, // Limit you set in the config window
  "payload": 1, // Current shedding stage
}

```

## Home Assistant Translator

Convierte los estados de texto de Home Assistant en valores booleanos. Esta función tiene una entrada y una salida y no requiere una pasarela KNX.

Elige la propiedad del mensaje de entrada que se leerá, como `payload` o `data.new_state.state`. Introduce una traducción por línea con el formato `entrada:true` o `entrada:false`, por ejemplo `on:true` y `off:false`. La comparación no distingue mayúsculas de minúsculas. Escribe los dos puntos directamente entre el texto y el valor booleano.

La salida es una copia del mensaje con un `msg.payload` booleano; los demás campos se conservan. También admite entradas booleanas y numéricas. Los valores ausentes o desconocidos no generan mensajes y se indican en el estado del nodo. La migración conserva la propiedad de entrada y la tabla de traducciones personalizada.
