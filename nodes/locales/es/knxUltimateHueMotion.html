### Actualizar a KNX Ultimate 8

La versión 7 muestra un pequeño botón **Actualizar a v8** en la parte superior de este editor. Descarga una copia de los flujos, instala los paquetes HUE/Matter necesarios, convierte los nodos compatibles, realiza un Deploy completo, verifica los flujos guardados e instala la versión 8. Reinicia después el servicio Node-RED cuando se indique; recargar solo el navegador no es suficiente. Los nodos antiguos KNX AI detienen la operación automática.

[Guía completa de actualización](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/es-Upgrade-to-v8)

<br/>

<p><strong>Obsoleto:</strong> este nodo HUE dedicado sigue disponible para los flujos existentes. Usa <strong>HUE Controller</strong> para proyectos nuevos. El nodo legacy aparece marcado con <code>(deprecated)</code> en la paleta y en el lienzo, usa un color más claro que HUE Controller y su editor muestra arriba un aviso de migración. El botón de migración naranja de alto contraste con texto blanco convierte localmente todos los nodos HUE legacy; después solo abre un borrador de correo editable. El correo nunca se envía automáticamente. Al finalizar el proceso, un mensaje fijo de Node-RED permanece visible hasta que pulses OK y ofrece un botón de apoyo opcional; la página de donación solo se abre al pulsarlo. Antes de empezar, <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">mira el vídeo explicativo en YouTube</a>.</p>
<p> Este nodo escucha un sensor de movimiento de tono y refleja los eventos para KNX y/o su flujo de nodo-rojo. </p>

Comience a escribir el nombre del dispositivo KNX o la dirección de grupo en el campo GA;Aparecen sugerencias mientras escribe.Presione el botón Actualizar junto a "Sensor Hue" para volver a cargar la lista de dispositivos desde el puente si agrega nuevos sensores.

**General**

| Propiedad | Descripción |
|-|-|
|KNX GW |KNX Gateway que recibe las actualizaciones de movimiento (requeridas antes de que aparezcan los campos de mapeo KNX).|
|Hue Bridge |Hue Bridge para la consulta.|
|Sensor de movimiento de tono |Sensor de movimiento de Hue (admite autocompletar y actualizar).|

**Cartografía**

| Propiedad | Descripción |
|-|-|
|Movimiento |KNX GA que recibe `verdadero` cuando se detecta el movimiento y` falso 'cuando el área está clara.DPT recomendado: <b> 1.001 </b>.|

**Comportamiento**

| Propiedad | Descripción |
|-|-|
|Pin de salida del nodo |Mostrar u ocultar la salida de nodo-rojo.Cuando no se selecciona la puerta de enlace KNX, el pin de salida permanece habilitado para que los eventos de movimiento de tono aún alcancen su flujo.|

> ℹ️ Los widgets KNX permanecen ocultos hasta que seleccione una puerta de enlace KNX, lo que facilita el uso del nodo puramente como un oyente rojo de nodo.

### Producción

1. Salida estándar - `msg.payload` (boolean)
: `True` on Motion,` False` cuando termina el movimiento.
