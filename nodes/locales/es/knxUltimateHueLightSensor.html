<p><strong>Obsoleto:</strong> este nodo HUE dedicado sigue disponible para los flujos existentes. Usa <strong>HUE Controller</strong> para proyectos nuevos. El nodo legacy aparece marcado con <code>(deprecated)</code> en la paleta y en el lienzo, usa un color más claro que HUE Controller y su editor muestra arriba un aviso de migración. El botón naranja de migración convierte localmente todos los nodos HUE legacy; después abre un borrador de correo editable y la página de donación en una ventana nueva del navegador. El correo nunca se envía automáticamente. Al finalizar el proceso, un mensaje fijo de Node-RED permanece visible hasta que pulses OK.</p>
<p> Este nodo lee eventos de Lux de un sensor de luz de tono y los mapea a KNX. </p>

Emite la iluminancia ambiental (lux) cada vez que cambia.Comience a escribir en el campo GA (nombre o dirección de grupo) para vincular el KNX GA;Los dispositivos aparecen mientras escribe.

**General**

| Propiedad | Descripción |
|-|-|
|KNX GW |Seleccione la puerta de enlace KNX para ser utilizada |
|Hue Bridge |Seleccione la Hue Bridge que se utilizará |
|Sensor de luz de tono |Sensor de luz Hue para usar (autocompletar mientras escribe). |
|Leer el estado al inicio |Lea el estado en el inicio y emita el evento al autobús KNX al inicio/reconexión.(Predeterminado "no") |

**Cartografía**

|Propiedad |Descripción |
|-|-|
|Lux |KNX GA que recibe el valor de Lux.|

: carga útil (número): valor de lux actual.
