## KNX AI Home Assistant

Questo nodo AI legacy viene mantenuto soltanto per i flow esistenti della versione 7.

### Aggiornamento a KNX Ultimate 8

Il piccolo pulsante **Aggiorna alla v8** nella parte alta dell’editor automatizza l’aggiornamento del package, ma si ferma intenzionalmente prima di apportare modifiche se trova questo nodo. La sua configurazione AI non può essere convertita in modo sicuro in Cerebrum Ultimate. Sostituisci o rimuovi manualmente il nodo, quindi avvia nuovamente l’aggiornamento.

[Guida completa all’aggiornamento](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/it-Upgrade-to-v8)
