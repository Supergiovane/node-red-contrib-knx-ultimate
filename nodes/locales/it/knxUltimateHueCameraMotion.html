<script type="text/markdown" data-help-name="knxUltimateHueCameraMotion">
<p><strong>Deprecato:</strong> questo nodo HUE dedicato resta disponibile per i flow esistenti. Usa <strong>HUE Controller</strong> per i nuovi progetti. Il nodo legacy è contrassegnato con <code>(deprecated)</code> nella palette e sul canvas, usa un colore più chiaro di HUE Controller e il suo editor mostra in alto un avviso di migrazione. Il pulsante arancione di migrazione in questo editor apre lo stesso convertitore dell’intero flow disponibile in HUE Controller.</p>
<p>Il nodo Hue Camera Motion ascolta il servizio di motion delle camere Philips Hue e replica in KNX lo stato rilevato/non rilevato.</p>

Inizia a digitare nel campo GA (nome o indirizzo di gruppo) per collegare la GA KNX; i dispositivi compaiono durante la digitazione.

**Generale**

|Proprietà|Descrizione|
|--|--|
| Gateway KNX | Seleziona il gateway KNX da utilizzare |
| Hue Bridge | Seleziona la Hue Bridge da utilizzare |
| Motion camera HUE | Sensore motion della camera Hue (autocompletamento durante la digitazione) |
| Leggi lo stato all'avvio | All'avvio/riconnessione legge il valore corrente e lo invia a KNX (predefinito: no) |

**Associazione**

|Proprietà|Descrizione|
|--|--|
| Movimento | GA KNX per il movimento (booleano). DPT consigliato: <b>1.001</b> |

### Uscite

1. Uscita standard
   : `msg.payload` (boolean): `true` quando viene rilevato movimento, altrimenti `false`

### Dettagli

`msg.payload` contiene l'ultimo stato di movimento fornito dal servizio camera di Hue.
</script>
