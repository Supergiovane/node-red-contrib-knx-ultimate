<p><strong>Deprecato:</strong> questo nodo HUE dedicato resta disponibile per i flow esistenti. Usa <strong>HUE Controller</strong> per i nuovi progetti. Il nodo legacy è contrassegnato con <code>(deprecated)</code> nella palette e sul canvas, usa un colore più chiaro di HUE Controller e il suo editor mostra in alto un avviso di migrazione. Il pulsante di migrazione arancione ad alto contrasto con testo bianco converte localmente tutti i nodi HUE legacy; al termine apre soltanto una bozza email modificabile. L'email non viene mai spedita automaticamente. Al termine del processo, un messaggio fisso di Node-RED resta visibile finché non premi OK e propone un pulsante facoltativo per sostenere il progetto; la pagina per la donazione si apre solo premendo quel pulsante. Prima di iniziare, <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">guarda il video esplicativo su YouTube</a>.</p>
<p>Il nodo Hue Motion Area riceve gli eventi di movimento aggregati di un'area MotionAware (Hue Bridge Pro) e li inoltra a KNX o al flow Node-RED.</p>

Nel campo GA digita nome o indirizzo di gruppo KNX per collegare l'indirizzo: i suggerimenti appaiono durante la digitazione.

**Generale**

| Proprietà | Descrizione |
|--|--|
| KNX GW | Gateway KNX che riceve lo stato di movimento dell'area. |
| HUE Bridge | Bridge Hue Pro da utilizzare. |
| HUE Area | Area MotionAware (convenience o security) da monitorare (autocomplete durante la digitazione). |
| Leggi stato all'avvio | All'avvio/riconnessione legge il valore corrente e lo invia a KNX (predefinito: sì). |

**Mappatura**

| Proprietà | Descrizione |
|--|--|
| Movimento | GA KNX per lo stato di movimento dell'area (boolean). DPT consigliato: <b>1.001</b>. |

**Comportamento**

| Proprietà | Descrizione |
|--|--|
| Pin di uscita del nodo | Mostra o nasconde l'uscita Node-RED; senza gateway KNX il pin resta attivo così gli eventi MotionAware raggiungono comunque il flow. |

### Output

1. Uscita standard  
   : `msg.payload` (boolean): `true` quando l'area risulta in movimento, `false` quando è libera.

### Dettagli

`msg.payload` contiene lo stato di movimento aggregato fornito dal servizio MotionAware per l'area selezionata.
