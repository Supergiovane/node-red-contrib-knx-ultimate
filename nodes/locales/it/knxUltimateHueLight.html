<p><strong>Deprecato:</strong> questo nodo HUE dedicato resta disponibile per i flow esistenti. Usa <strong>HUE Controller</strong> per i nuovi progetti. Il nodo legacy è contrassegnato con <code>(deprecated)</code> nella palette e sul canvas, usa un colore più chiaro di HUE Controller e il suo editor mostra in alto un avviso di migrazione. Il pulsante di migrazione arancione ad alto contrasto con testo bianco converte localmente tutti i nodi HUE legacy; al termine apre soltanto una bozza email modificabile. L'email non viene mai spedita automaticamente. Al termine del processo, un messaggio fisso di Node-RED resta visibile finché non premi OK e propone un pulsante facoltativo per sostenere il progetto; la pagina per la donazione si apre solo premendo quel pulsante. Prima di iniziare, <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">guarda il video esplicativo su YouTube</a>.</p>
<p>Questo nodo controlla le luci HUE (singole o raggruppate) e mappa comandi/stati su KNX.</p>

**Generale**

| Proprietà | Descrizione |
|-|-|
|Gateway KNX |Seleziona il gateway KNX da utilizzare |
|Hue Bridge |Seleziona il bridge Hue da utilizzare |
|Nome |Luce Hue o gruppo da utilizzare. Le luci e i gruppi disponibili compaiono mentre digiti|

<br/>

**Localizza dispositivo**

Il pulsante `Locate` (icona play) avvia una sessione di identificazione Hue per la risorsa selezionata. Quando la sessione è attiva il pulsante mostra l'icona stop e il bridge fa lampeggiare la luce — o tutte le luci del gruppo — ogni secondo. Premi di nuovo il pulsante per interrompere subito; in caso contrario la sessione termina automaticamente dopo 10 minuti.

<br/>

**Opzioni**

Qui puoi associare gli indirizzi di gruppo KNX ai comandi e agli stati disponibili della luce Hue. <br/>
Inizia a digitare nel campo GA (nome o indirizzo di gruppo) e i dispositivi disponibili compariranno mentre digiti.

**Interruttore**

| Proprietà | Descrizione |
|-|-|
|Comando |Indirizzo di gruppo usato per accendere o spegnere la luce Hue tramite un valore KNX booleano true/false. |
|Stato |Collegalo all'indirizzo del gruppo di stato dell'interruttore della luce |

<br/>

**Dimmer**

| Proprietà | Descrizione |
|-|-|
|Controllo dimmer | Dim relativo della luce HUE. La velocità si imposta nella scheda **Comportamento** .|
|Controllo % |Imposta la luminosità assoluta della luce Hue (0–100%). |
|Stato % |Collegalo all'indirizzo del gruppo KNX di luminosità della luce |
|Velocità dimmer (ms) | Velocità di dimming in millisecondi. Vale per la luce e per il "tunable white”. Calcolata sul range 0%→100%.|
|Luminosità minima dimmer |Luminosità minima raggiungibile durante la regolazione: la diminuzione si arresta alla percentuale specificata. |
|Luminosità massima dimmer |Luminosità massima raggiungibile durante la regolazione: l'aumento si arresta alla percentuale specificata. |

<br/>

**Bianco regolabile**

| Proprietà | Descrizione |
|-|-|
|Controllo dimmer | Cambia la temperatura del bianco con DPT 3.007 (velocità in **Comportamento** ). |
|Controllo % | Cambia la temperatura del bianco con DPT 5.001. 0 = caldo, 100 = freddo |
|Stato %| GA di stato temperatura (DPT 5.001). 0 = caldo, 100 = freddo |
|Controllo Kelvin | **DPT 7.600:** imposta in Kelvin con range KNX 2000-6535 (convertito in mirek).<br/>**DPT 9.002:** imposta in Kelvin con range HUE 2000-6535 (Ambiance da 2200). Possibili piccole variazioni per conversioni. |
|Stato Kelvin | **DPT 7.600:** leggi in Kelvin via range KNX 2000-6535 (convertito).<br/>**DPT 9.002:** leggi in Kelvin via range HUE 2000-6535 (Ambiance da 2200). Possibili piccole variazioni per conversioni. |
|Inverti direzione dimmer |Inverte la direzione della regolazione. |
<br/>

**RGB/HSV**

| Proprietà | Descrizione |
|-|-|
| **Sezione RGB** ||
|Controllo RGB | Cambia colore con tripla RGB (r,g,b); gestione gamut inclusa. L'invio colore accende la luce impostando colore/luminosità; con r,g,b=0 la luce si spegne |
|Stato RGB |Indirizzo di gruppo che riporta lo stato del colore della luce. Il datapoint accetta una terna RGB (R, G, B). |
| **Sezione HSV** ||
|Controllo dimmer H | Scorri la tonalità (HSV) con DPT 3.007; velocità in **Comportamento** |
|Stato H %|Stato del circolo cromatico HSV. |
|Controllo dimmer S | Cambia saturazione con DPT 3.007; velocità in **Comportamento** |
|Stato S % |Indirizzo di gruppo che riporta lo stato della saturazione del colore della luce. |
|Velocità dimmer (ms) |Tempo di regolazione, in millisecondi, per passare dal minimo al massimo della scala. |

Per controllare la "V” (luminosità) dell'HSV, usa i controlli standard nella scheda **Dimmer** .

<br/>

**Effetti**

_Effetti base non HUE_

| Proprietà | Descrizione |
|-|-|
| Lampeggio | _true_ fa lampeggiare la luce, _false_ ferma il lampeggio. Alterna acceso/spento; utile per segnalazioni. Funziona con tutte le luci HUE. |
| Ciclo colore | _true_ avvia il ciclo colori, _false_ lo interrompe. Cambia casualmente il colore della luce HUE a intervalli regolari. Funziona con le luci HUE che supportano il colore. L'effetto parte dopo 10 secondi. |

_Effetti nativi HUE_

La tabella **Effetti nativi HUE** consente di associare valori KNX agli effetti supportati dalla lampada selezionata (per esempio `candle`, `fireplace`, `prism`). Ogni riga collega un valore KNX (booleano, numerico o testuale a seconda del datapoint scelto) a uno degli effetti esposti dal bridge. Dal lato KNX puoi:

- inviare il valore mappato per attivare l'effetto corrispondente;
- impostare facoltativamente un indirizzo di stato: il nodo restituisce il valore mappato quando il bridge Hue segnala un cambio di effetto; se non trova corrispondenze invia il nome grezzo dell'effetto (necessita di un DPT testuale, ad esempio 16.xxx).

<br/>

**Comportamento**

|Proprietà |Descrizione |
|------------------------------------------------- |------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
|Leggi lo stato all'avvio |Legge lo stato della luce Hue all'avvio di Node-RED o dopo un deploy completo e lo invia al bus KNX. |
|Stato luminosità KNX |Aggiorna l'indirizzo di gruppo dello stato di luminosità quando la lampada Hue viene accesa o spenta. Le opzioni sono **Se la luce HUE è spenta invia 0%. Se è accesa, ripristina il valore precedente (comportamento KNX predefinito)** e **Lascia invariato (comportamento HUE predefinito)**. Per i dimmer KNX con stato di luminosità, come quelli MDT, è consigliata la prima opzione. |
|Aggiorna lo stato HUE locale in cache dai write KNX |Opzione avanzata, abilitata di default. Se attiva, i write che arrivano dal bus KNX aggiornano subito anche lo stato HUE locale in cache del nodo, senza attendere feedback/eventi dal bridge Hue. Questo rende le reazioni locali più rapide e le risposte immediate ai read KNX più coerenti, soprattutto quando la luce o il grouped_light sono spenti. Disattivala se preferisci che la cache segua solo il feedback/evento reale del bridge Hue. |
|Comportamento all'accensione |Imposta il comportamento della luce quando viene accesa.<br/>**Seleziona colore:** accende la luce con il colore scelto. Fai clic sul selettore dei colori per modificarlo.<br/>**Seleziona temperatura e luminosità:** accende la luce con la temperatura (kelvin) e la luminosità (0–100%) scelte.<br/>**Nessuno:** mantiene l'ultimo stato della luce. Se è abilitata l'illuminazione notturna, al termine della notte viene ripristinato lo stato di colore, temperatura e luminosità impostato per il giorno. |
|Illuminazione notturna |Permette di impostare il colore o la combinazione di temperatura e luminosità da usare di notte. Le opzioni sono le stesse della modalità diurna. Per la luce notturna del bagno, ad esempio, puoi scegliere 2700 K e una luminosità del 10% o 20%. |
|Giorno/Notte |Indirizzo di gruppo che seleziona la modalità giorno/notte: _true_ per il giorno, _false_ per la notte. |
|Inverti valore giorno/notte |Inverte i valori dell'indirizzo di gruppo giorno/notte. Per impostazione predefinita l'opzione è **deselezionata**. |
|Leggi lo stato all'avvio |Legge lo stato e lo invia al bus KNX all'avvio o alla riconnessione. Valore predefinito: **No**. |
|Forza modalità diurna |Consente di passare alla modalità diurna spegnendo e riaccendendo rapidamente la luce. **Solo questa luce** applica il cambio alla luce selezionata; **tutte le luci** lo applica a tutti i nodi luce, impostando la modalità giorno/notte su giorno. |
|PIN di Input/Output del nodo |Mostra o nasconde i pin di ingresso e uscita, che consentono di ricevere e inviare messaggi al flow. I messaggi in ingresso devono seguire il formato delle API Hue v2. Ad esempio, per accendere la luce: <code> msg.on = {"on": true} </code>. Consulta la [pagina ufficiale delle API Hue](https://developers.meethue.com/develop/hue-api-v2/api-reference/#resource_light__id__put). |

### Nota

La regolazione funziona con i comandi KNX **start** e **stop**: invia un telegramma "start" per avviarla e un telegramma "stop" per arrestarla. Tienine conto quando configuri i pulsanti a parete.
