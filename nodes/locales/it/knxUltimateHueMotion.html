<p><strong>Deprecato:</strong> questo nodo HUE dedicato resta disponibile per i flow esistenti. Usa <strong>HUE Controller</strong> per i nuovi progetti. Il nodo legacy è contrassegnato con <code>(deprecated)</code> nella palette e sul canvas, usa un colore più chiaro di HUE Controller e il suo editor mostra in alto un avviso di migrazione. Il pulsante di migrazione arancione ad alto contrasto con testo bianco converte localmente tutti i nodi HUE legacy; al termine apre soltanto una bozza email modificabile. L'email non viene mai spedita automaticamente. Al termine del processo, un messaggio fisso di Node-RED resta visibile finché non premi OK e propone un pulsante facoltativo per sostenere il progetto; la pagina per la donazione si apre solo premendo quel pulsante. Prima di iniziare, <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">guarda il video esplicativo su YouTube</a>.</p>
<p>Questo nodo riceve gli eventi da un sensore di movimento Hue e li inoltra a KNX e al flow Node-RED.</p>

Nel campo GA digita nome o indirizzo di gruppo KNX: i suggerimenti appaiono durante la digitazione. Il pulsante di refresh accanto a "Sensore Hue” consente di ricaricare la lista dal Bridge Hue.</p>

**Generale**

| Proprietà | Descrizione |
|-|-|
|Gateway KNX |Gateway KNX che riceve le segnalazioni di movimento (necessario per visualizzare le opzioni KNX) |
|Hue Bridge |Hue Bridge da interrogare |
| Sensore movimento Hue | Sensore di movimento Hue (supporta autocompletamento e refresh) |

**Mappatura**

| Proprietà | Descrizione |
|--|--|
| Movimento | GA KNX che riceve `true` quando viene rilevato movimento e `false` quando termina (DPT consigliato: <b>1.001</b>) |

**Comportamento**

| Proprietà | Descrizione |
|--|--|
| Pin di uscita del nodo | Mostra o nasconde l'uscita Node-RED; senza gateway KNX il pin resta attivo così gli eventi Hue raggiungono comunque il flow |

> ℹ️ Le sezioni KNX compaiono solo dopo aver scelto un gateway KNX, così puoi usare il nodo anche come semplice listener Hue → Node-RED.

### Output

1. Uscita standard — `msg.payload` (boolean)
   : `true` quando viene rilevato movimento, `false` quando termina.
