### Aggiornamento a KNX Ultimate 8

La versione 7 mostra un piccolo pulsante **Aggiorna alla v8** nella parte alta di questo editor. Il pulsante scarica un backup dei flow, installa i package HUE/Matter necessari, converte i nodi compatibili, esegue un Deploy completo, verifica i flow salvati e installa la versione 8. Quando richiesto, riavvia il servizio Node-RED: ricaricare soltanto il browser non basta. I nodi KNX AI legacy fermano la procedura automatica.

[Guida completa all’aggiornamento](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/it-Upgrade-to-v8)

<br/>

Filtra i telegrammi RAW (tipicamente prodotti dal nodo **KNX Multi Routing**) prima di inoltrarli su un altro gateway.

## Sintassi pattern
- I pattern per gli indirizzi di gruppo supportano `*` per livello:
  - `0/0/*` corrisponde a tutti gli indirizzi di gruppo in `0/0`
  - `0` equivale a `0/*/*`
- I pattern per la sorgente (indirizzo fisico) supportano `*` per livello:
  - `1.1.*` corrisponde a tutti i dispositivi nell’area `1`, linea `1`
  - `1` equivale a `1.*.*`
- Avanzato: `re:<regex>` per usare una regex.

## Modalità (GA / sorgente)
- **Disabilitato**: nessun filtro
- **Consenti solo le corrispondenze**: inoltra solo i telegrammi che corrispondono ai pattern
- **Blocca le corrispondenze**: scarta i telegrammi che corrispondono ai pattern

## Output
1. **Passati** (da inoltrare)
2. **Scartati** (debug opzionale)

## Riscrittura
Puoi (opzionalmente) riscrivere:
- indirizzo di gruppo di destinazione (`knx.destination`)
- indirizzo fisico sorgente (`knx.source`)

Durante la riscrittura, il nodo aggiorna anche `knx.cemi.hex` per riflettere i valori riscritti di `knx.source`/`knx.destination` (quando `knx.cemi.hex` è presente).

Le regole sono valutate dall’alto verso il basso: viene applicata la prima corrispondente.

Esempi sintassi:
- Wildcard: `0/0/* => 2/0/*` (il `*` viene catturato e riutilizzato)
- Regex: `re:^1/2/(\\d+)$ => 3/2/$1`

## Metadati
Il nodo aggiunge `msg.payload.knxRouterFilter`:
- messaggi scartati: `{ dropped: true, reason: 'event'|'ga'|'source', ... }`
- messaggi passati: `{ dropped: false, rewritten: <bool>, cemiSynced: <bool>, rewrite: { ... }, original: { ... } }`

## msg.setConfig
Puoi cambiare la configurazione del nodo a runtime inviando un oggetto `msg.setConfig` all’ingresso.
Chiavi supportate: `allowWrite`, `allowResponse`, `allowRead`, `gaMode`, `gaPatterns`, `srcMode`, `srcPatterns`, `rewriteGA`, `gaRewriteRules`, `rewriteSource`, `srcRewriteRules`.
La nuova configurazione viene mantenuta fino al prossimo `msg.setConfig` o fino a redeploy/riavvio. I messaggi di configurazione non vengono inoltrati.

Significato delle proprietà:
- `allowWrite`: consente i telegrammi `GroupValue_Write`.
- `allowResponse`: consente i telegrammi `GroupValue_Response`.
- `allowRead`: consente i telegrammi `GroupValue_Read`.
- `gaMode`: modalità filtro per la GA di destinazione (`off` = nessun filtro, `allow` = consenti solo le corrispondenze, `block` = scarta le corrispondenze).
- `gaPatterns`: pattern GA di destinazione usati da `gaMode` (uno per riga, supporta `*` e `re:<regex>`).
- `srcMode`: modalità filtro per la sorgente (indirizzo fisico) (`off`/`allow`/`block`).
- `srcPatterns`: pattern sorgente usati da `srcMode` (uno per riga, supporta `*` e `re:<regex>`).
- `rewriteGA`: abilita la riscrittura di `knx.destination` sui telegrammi passati.
- `gaRewriteRules`: regole di riscrittura GA (`da => a`, viene applicata la prima regola corrispondente; supporta `*` e `re:<regex>`).
- `rewriteSource`: abilita la riscrittura di `knx.source` sui telegrammi passati.
- `srcRewriteRules`: regole di riscrittura sorgente (`da => a`, viene applicata la prima regola corrispondente; supporta `*` e `re:<regex>`).

Esempio:
```js
msg.setConfig = {
  allowWrite: true,
  allowResponse: true,
  allowRead: true,
  gaMode: "allow",
  gaPatterns: "1/1/*\n1/2/3",
  srcMode: "off",
  srcPatterns: "",
  rewriteGA: true,
  gaRewriteRules: "5/5/1 => 1/1/1",
  rewriteSource: true,
  srcRewriteRules: "15.*.* => 1.1.254"
};
return msg;
```
