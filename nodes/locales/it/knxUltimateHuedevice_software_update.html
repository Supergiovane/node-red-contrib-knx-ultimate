<script type="text/markdown" data-help-name="knxUltimateHuedevice_software_update">
<p><strong>Deprecato:</strong> questo nodo HUE dedicato resta disponibile per i flow esistenti. Usa <strong>HUE Controller</strong> per i nuovi progetti. Il nodo legacy è contrassegnato con <code>(deprecated)</code> nella palette e sul canvas, usa un colore più chiaro di HUE Controller e il suo editor mostra in alto un avviso di migrazione. Il pulsante arancione di migrazione in questo editor apre lo stesso convertitore dell’intero flow disponibile in HUE Controller.</p>
<p>Questo nodo monitora se un dispositivo HUE ha un aggiornamento software disponibile e pubblica lo stato su KNX.</p>

Inizia a digitare il nome o l'indirizzo di gruppo del dispositivo KNX nel campo GA, i dispositivi disponibili iniziano a mostrare mentre
stai digitando.

**Generale**

| Proprietà | Descrizione |
|-|-|
|Gateway KNX |Seleziona il gateway KNX da utilizzare |
|Hue Bridge |Seleziona la Hue Bridge da utilizzare |
| Dispositivo Hue | Dispositivo HUE da monitorare (autocompletamento) |

**Mappatura**

| Proprietà | Descrizione |
|--|--|
| Stato | GA KNX che riflette lo stato: _true_ se update disponibile/pronto/in installazione, altrimenti _false_. |
| Leggi stato all'avvio | Leggi all'avvio/riconnessione ed emetti su KNX (default "Sì”). |

### Output

1. Uscita standard
   : payload (boolean): flag aggiornamento.
   : status (string): **no\_update, update\_pending, ready\_to\_install, installing** .
</script>
