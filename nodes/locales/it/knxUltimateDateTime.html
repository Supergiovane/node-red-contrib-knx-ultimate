### Aggiornamento a KNX Ultimate 8

La versione 7 mostra un piccolo pulsante **Aggiorna alla v8** nella parte alta di questo editor. Il pulsante scarica un backup dei flow, installa i package HUE/Matter necessari, converte i nodi compatibili, esegue un Deploy completo, verifica i flow salvati e installa la versione 8. Quando richiesto, riavvia il servizio Node-RED: ricaricare soltanto il browser non basta. I nodi KNX AI legacy fermano la procedura automatica.

[Guida completa all’aggiornamento](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/it-Upgrade-to-v8)

<br/>

**Deprecato:** Questo nodo dedicato resta supportato nei flow esistenti. Per i nuovi flow usa **KNX Utility** e seleziona la funzione corrispondente. Il nodo legacy è nascosto nella palette e contrassegnato con `(deprecated)` nel flow. Il suo editor offre un pulsante per convertire tutti i nodi utility KNX legacy compatibili in tutti i flow e subflow dopo conferma. La conversione avviene localmente nel browser, conserva ID, impostazioni, collegamenti e gruppi e supporta Annulla. La conferma chiude l’editor del nodo corrente e scarta le modifiche non salvate. Controlla il risultato prima di premere Deploy.

# KNX DATA/ORA

Usa questo nodo per **impostare data/ora sul bus KNX**.

Può inviare:
- **DPT 19.001** su una singola *GA Data/Ora* (consigliato).
- **DPT 11.001** su una *GA Data* (opzionale).
- **DPT 10.001** su una *GA Ora* (opzionale).

Puoi configurare uno o più indirizzi di gruppo: il nodo scrive su tutti quelli configurati.

Nota su **DPT 19.001**:
- il nodo parte da una `Date` JavaScript e la converte in telegramma KNX DateTime tramite l'engine KNX.

## Quando invia

- **Al deploy/avvio** (opzionale, con ritardo).
- **Invio periodico** (opzionale).
- **All'arrivo di un input** (sempre).
- **Pulsante in editor** (invio immediato).

## Payload in ingresso

Se `msg.payload` è assente/vuoto, il nodo invia l'ora corrente di sistema.

Payload supportati:
- `new Date()` (consigliato)
- numero timestamp (millisecondi dall'epoch)
- stringa accettata da `new Date("...")`
- `"now"`
- oggetto con uno di questi campi:
  - `msg.payload.dateTime`
  - `msg.payload.timestamp`
  - `msg.payload.epoch`

Esempio:

```js
msg.payload = new Date();
return msg;
```

## Gateway non connesso

Se il gateway KNX non è connesso, l'invio viene messo in coda e parte appena torna la connessione.
Il nodo mantiene **una sola richiesta pendente** (l'ultima ricevuta).

## Output

Il nodo emette un messaggio ad ogni invio:
- `msg.payload`: la `Date` inviata
- `msg.sent`: array di `{ ga, dpt, name }`
- `msg.reason`: `input`, `startup`, `periodic` o `button`
- `msg.knxUltimateDateTime.date`: data/ora in formato ISO (`toISOString()`)
