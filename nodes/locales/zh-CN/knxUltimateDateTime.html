### 升级到 KNX Ultimate 8

版本 7 会在此编辑器顶部显示一个小型的 **升级到 v8** 按钮。它会下载流程备份、安装所需的 HUE/Matter 软件包、转换兼容节点、执行完整部署、验证已保存的流程并安装版本 8。出现提示后必须重启 Node-RED 服务；仅重新加载浏览器并不足够。旧版 KNX AI 节点会停止自动操作。

[完整升级指南](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/zh-CN-Upgrade-to-v8)

# KNX 日期/时间

使用此节点将**日期/时间写入 KNX 总线**。

可发送：
- **DPT 19.001** 到 *日期/时间 GA*（推荐）
- **DPT 11.001** 到 *日期 GA*（可选）
- **DPT 10.001** 到 *时间 GA*（可选）

## 发送时机

- 部署/启动时（可选，可设置延时）
- 周期发送（可选）
- 每次输入消息
- 编辑器按钮（立即发送）

## 输入 payload

如果 `msg.payload` 为空，则发送当前系统时间。

支持：
- `new Date()`
- 时间戳（毫秒）
- `new Date("...")` 可解析的字符串
- `"now"`

## 输出

每次发送节点会输出一条消息：
- `msg.payload`：发送的 `Date`
- `msg.sent`：`{ ga, dpt, name }` 数组
- `msg.reason`：`input` / `startup` / `periodic` / `button`
