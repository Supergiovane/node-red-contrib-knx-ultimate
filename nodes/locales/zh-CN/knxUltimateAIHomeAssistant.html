## KNX AI Home Assistant

此旧版 AI 节点仅为版本 7 的现有流程保留。

### 升级到 KNX Ultimate 8

编辑器顶部的小型 **升级到 v8** 按钮可自动执行软件包升级，但如果存在此节点，它会在进行任何更改前主动停止。该节点的 AI 配置无法安全转换为 Cerebrum Ultimate。请手动替换或删除该节点，然后再次运行升级。

[完整升级指南](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/zh-CN-Upgrade-to-v8)
