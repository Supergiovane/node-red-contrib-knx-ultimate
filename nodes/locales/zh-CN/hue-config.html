### 升级到 KNX Ultimate 8

版本 7 会在此编辑器顶部显示一个小型的 **升级到 v8** 按钮。它会下载流程备份、安装所需的 HUE/Matter 软件包、转换兼容节点、执行完整部署、验证已保存的流程并安装版本 8。出现提示后必须重启 Node-RED 服务；仅重新加载浏览器并不足够。旧版 KNX AI 节点会停止自动操作。

[完整升级指南](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/zh-CN-Upgrade-to-v8)

<h1><p align='center'>PHILIPS HUE NODES</p></h1>
<br/>
<p align='center'>
  <img src='https://raw.githubusercontent.com/Supergiovane/node-red-contrib-knx-ultimate/master/img/huehub.jpg' width='40%'>
</p>

该节点负责将 Node-RED 注册到 Hue 网桥，并且现在会自动处理整个配对流程。

输入网桥的 IP（或从自动发现列表中选择一台）后点击 **CONNECT**。编辑器会持续轮询网桥，一旦按下实体配对按钮就会自动关闭等待窗口。如需取消等待并稍后再试，请点击 **CANCEL**。用户名和客户端密钥字段始终可编辑，方便在任何时候复制或粘贴凭据。

已经有凭据？点击 **我已有凭据**，即可立即显示这些字段并手动输入，无需等待网桥按钮。

**常规**

|属性|说明|
|--|--|
| IP | 输入 Hue 网桥的固定 IP，或从自动发现的列表中直接选择。|
| 连接 | 启动注册并等待网桥的配对按钮。按下按钮后对话框会自动关闭；使用 **CANCEL** 可以终止等待。|
| Name | 注册成功后从 Hue 网桥读取的名称。|
| 用户名 | Hue 网桥在配对完成后返回的用户名。字段保持可编辑，便于复制、粘贴或手动输入。|
| 客户端密钥 | Hue 网桥在配对完成后返回的客户端密钥。字段保持可编辑，便于复制、粘贴或手动输入。|
