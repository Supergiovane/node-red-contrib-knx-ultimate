<script type="text/markdown" data-help-name="knxUltimateHueLightSensor">
<p><strong>已弃用：</strong>此专用 HUE 节点仍可用于现有流程。新项目请使用 <strong>HUE Controller</strong>。旧版节点会在节点面板和画布上标记为 <code>(deprecated)</code>，颜色比 HUE Controller 更浅，编辑器顶部也会显示迁移提示。 此编辑器中的橙色迁移按钮会打开与 HUE Controller 相同的完整流程转换器。</p>
<p>该节点从 HUE 光照传感器读取 Lux 事件并发布到 KNX。</p>

每当环境光变化时会输出 Lux 值。在 GA 字段输入 KNX 设备名或组地址（自动补全）以进行关联。

**一般的**

|属性|描述|
| - | - |
|KNX 网关 |选择要使用的KNX门户|
|色相桥|选择要使用的色调桥|
| HUE Sensor | 要使用的 HUE 光照传感器（自动补全） |
|在启动时阅读状态|阅读启动时的状态，并在启动/重新连接时将事件发射到KNX总线上。（默认"否”）|

**映射**

|属性|说明|
|--|--|
| Lux | 接收 Lux 数值的 KNX 组地址 |

### 输出

1. 标准输出
   : payload (number)：当前 Lux 数值

### 细节

`msg.payload` 为数值型 Lux。
</script>
