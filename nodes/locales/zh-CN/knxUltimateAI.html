此节点会监听所选 KNX Ultimate 网关上的**所有 KNX 电报**，生成流量统计、检测异常，并可选调用 LLM。

编辑器使用两个水平标签页：**AI 助手**包含配置、知识/上下文以及提供商限制；**对话与家庭**包含聊天输入/输出端口、主动家庭和受限记忆。

## 输出
1. **摘要/统计**（`msg.payload` 为 JSON）
2. **异常**（`msg.payload` 为 JSON）
3. **AI 助手**（`msg.payload` 为文本，包含 `msg.summary`）
4. **KNX 操作**（每个通过验证的读取或写入输出一条 Universal Mode 消息）
5. **TTS Ultimate**（模型每选择一段语音播报，就输出一条播报消息）

输出 3 和输出 4 发出的每条消息还会在 `msg.inputMessage` 中包含原始输入消息的副本。因此，原始 payload、topic、聊天元数据及其他输入属性都可供后续节点使用。克隆或输出错误会被捕获并报告，不会传播到 Node-RED 运行时。

### Setup Doctor 与安全首次使用
自动 **Setup Doctor** 会检查所选网关和 ETS 导入、AI 是否启用、提供商、模型和 API 密钥、提供商连通性、Flow 连线、已检测摄像头以及可选的 TTS Ultimate 连接。它的免费提供商预检仅调用模型列表端点：绝不发送聊天请求，也不消耗推理 token。摄像头和 TTS 均为可选项，不使用它们不会降低核心就绪度。

设备清单会显示唯一 KNX 组地址信号的精确数量、ETS 区域/组以及逻辑功能的估算数量。它不会声称物理设备数量，因为无法从 ETS CSV 中可靠推导该数量。Setup Doctor 读取最近一次已部署的 Flow；因此，更改提供商、模型、预设、网关或连线后，必须先部署，再点击**刷新**重新检查。

从聊天发送 `/start` 或 `/help`，即可在聊天输出（输出 3）收到确定性且已本地化的欢迎消息，其中包含个性化的安装统计和最多三条安全建议。此引导过程不调用 LLM，不读写 KNX，也不生成 TTS。使用 Telegram 预设时，建议会显示为回复键盘按钮，仅在用户明确选择或发送其中一条后才会执行。在用户明确选择后，初始建议可在需要时执行精确的 KNX 读取；KNX 写入和例程、摄像头操作、TTS、持久记忆更改以及 GA 角色学习仍会被禁止。

### Web 智能
Web 访问默认关闭。启用**允许 AI 使用 Web**后，对话模型会针对每个当前请求判断是否需要最新的公开信息，并可在不使用关键词、特定主题逻辑或意图分类器的情况下选择结构化 Web 工具。每个用户回合或用户创建的计划任务执行最多进行三次 Web 操作。所有真实外部 Web 操作共享已配置的滚动小时预算。

KNX AI 不会启动固定的后台 Web 轮询。如果某个关键细节会实质性改变回答或查询，例如主题、范围、地点、时间窗口或期望结果，模型会提出一个简短的澄清问题，并在用户回答前不执行任何 Web 操作。未来或周期性检查只能通过用户明确的自然语言请求由调度器创建。

每条基于 Web 的回答都包含由运行时验证的引用，其中包括已清理的来源 URL 和检索时间，并在可用时提供发布时间。外部内容是不受信任的数据，绝不是指令，也不能取代助手规则或权限。仅接受大小受限的公开 HTTPS 资源；私有、本地、链路本地及云元数据目标、不安全重定向、已认证浏览和 Cookie 都会被阻止。如果无法验证任何来源，KNX AI 会说明此限制，而不会生成无来源的回答。

获得已验证的 Web 结果后，如果当前聊天或 AI 教育已授权，模型可组合其他已启用工具。Web 访问绝不会扩大权限：摄像头、TTS 和记忆的可用性，以及 KNX 读写、本地 ETS/DPT 验证和已配置的 KNX 写入确认机制都保持不变。Web 请求会向外部网站或搜索服务公开查询内容及本服务器的公网 IP；KNX/ETS 数据、摄像头内容、聊天标识符、已学习记忆和凭据绝不会被自动加入。

### 自然语言计划与提醒
用户可以用普通聊天语言，让 KNX AI 创建、列出或取消一次性或周期性的提醒、监测任务或未来家庭命令。模型会根据完整请求按语义选择结构化计划工具 `scheduleActions`，并将完整目标和条件保存为人类语言指令。系统不使用计划关键词、触发短语列表或僵化的意图分类器，因此措辞和语言都不会限制此功能。

计划归属于聊天会话，并按 KNX AI 节点持久保存，Node-RED 重启后仍然有效。权威运行时状态位于 `<userDir>/knxai/schedules/knxai-schedules-<node-id>.json`；KNX AI 还会生成 `<userDir>/knxai/schedules/knxai-schedules-<node-id>.md` 作为易读视图。计划可以只运行一次，也可以至少每五分钟重复一次，并可选择设置到期时间。模型只能列出或取消当前聊天所拥有的活动计划，除非用户明确要求取消该聊天的全部计划。

任务到期时，KNX AI 会启动一次独立的模型处理，并把已保存的人类语言指令作为可信的用户授权。监测条件未满足时不会发送消息。执行时仍须遵守现有权限：天气监测需要启用**允许 AI 使用 Web**并使用同一 Web 预算；语音结果从输出 5 发出，因此必须连接 TTS Ultimate 节点；摄像机工具仍仅限检测到的适配器。计划中的 KNX 写入仍须通过精确的 ETS/DPT 检查；启用确认后，会先向同一聊天会话显示预览，确认前输出 4 不会发出任何写入。

例如，用户可以说：“接下来五天，每 30 分钟检查 Cortemaggiore 的天气预报，仅在预计有雷暴时使用 TTS Ultimate 播报。”KNX AI 可以把完整条件和期限保存为一个周期性监测任务；上述 Web 权限和 TTS 连接要求仍然适用。

## 命令（输入）
发送 `msg.topic`：
- `summary`（或空）：立即输出摘要
- `reset`：清空内部历史、计数器、已学习的家庭记忆、所有持久聊天上下文及此节点的全部计划；节点中配置的 AI 教育保持不变
- `ask`：向已配置的 LLM 提问
- `confirm` / `cancel`：无需再次调用 LLM，即可确认或取消待处理的 KNX 命令
- `clear_chat`：清除当前会话的最近对话、持久指令和待处理命令，并取消该会话的活动计划；其他会话和 AI 教育保持不变

`ask` 的问题建议放在 `msg.prompt`，也可放在 `msg.payload`（字符串）或常见 Telegram 字段 `msg.payload.content` / `msg.payload.text`。

如果处理时间超过 1.2 秒，输出 3 会立即发送本地化的中间消息“我正在思考…”，并设置 `msg.knxAi.type = "thinking"` 和 `msg.knxAi.transient = true`。聊天适配器会将其发送给同一用户，最终答案准备好后仍会正常送达。此进度消息绝不会写入对话上下文或学习记忆。

每个 LLM 聊天请求都使用与提供商无关的至少 30 分钟超时。编辑器中无需维护超时字段。这是最长等待时间，并非人为延迟；较快的模型仍会在响应准备好后立即完成。即使达到此限制，KNX AI 也会说明模型未完成响应，并建议重试或缩减提示上下文。

KNX AI 不再提供应用级上下文大小选项。完整的已选 ETS 目录保留在节点内，由模型通过有界的本地检索动作查询；只有检索到的对象才进入提示词。搜索覆盖精确地址、ETS 名称、别名、层级、区域、语义、DPT 和数值标签，并支持忽略重音、容忍拼写错误的排序，以及精确查询、区域浏览和命令/状态配对发现。未明确指定时间范围时，KNX 与适配器事件仅覆盖最近 20 分钟。随包提供的帮助、README、Wiki、示例和变更日志不会嵌入提示词；需要时，模型可通过 Web 工具查询 GitHub 上的公开文档。检索到的 ETS 数据、当前请求和存档行各只出现一次，分析块仅保留派生的总线聚合信息。只有用户明确要求审查 Function 代码时，才加入完整的 Function 源码。KNX AI 不会通过压缩提示词来重试超大请求。

每次向本地模型发起请求前，KNX AI 都会在当前 8K/16K 窗口中预留回答空间。系统会自动限制最近的对话轮次、精确存档行、已学习的家庭记忆、Web 结果、计划任务、按需提供的 Function 源码、已检索的 ETS 对象和摄像机元数据。这是在请求前构建有界提示词，并非发生超限错误后的重试；完整的已选 ETS 目录仍可通过本地检索使用。

### ETS 对象访问
此部分复用 IoT Bridge MQTT 配置中的组地址选择器。可以筛选导入列表、全选或全不选，并对当前显示的地址批量或逐行设置只读。只有选中的地址可供模型使用。每个选中的地址都处于活动状态且可读取；只读地址仍然可见，但本地验证会拒绝对其执行任何 `GroupValue_Write`。不存在迁移或旧版回退：升级后必须打开每个现有 KNX AI 节点，保存明确选择并部署；在此之前，其 AI 目录为空。

Canvas 上的节点状态专门用于显示最近收到的请求，以及 LLM 运行期间本地化的“我正在思考…”状态。KNX 报文、网关更新、流量速率、ready 消息和技术结果绝不会覆盖该状态；这些信息仍可通过节点输出、日志和助手数据查看。

每个 Ask/聊天会话都会保留最近 8 轮对话和最多 20 条由模型选择的长期指令，并按 `msg.knxAi.sessionId`、`msg.sessionId` 或检测到的 Telegram 聊天 ID 隔离。模型通过结构化记忆工具，按语义判断一段对话的含义应被记住还是遗忘；系统不使用语言关键词或 intent 列表。使用相同存储的所有 KNX AI 节点实时共享此上下文，并在 Node-RED 重启后从 `knxultimatestorage/knxai/memory/knxai-chat-context.knxctx` 重新加载。该文件采用原子写入，最多保存 50 个会话且不超过 512 KB。启用 KNX 控制后，将输出 3 连接到聊天发送节点，将输出 4 连接到配置为**通用模式**的 KNX Ultimate 节点。启用确认后，第一条回复会显示 GA、DPT 和 payload，但不会发送写入；同一会话必须在 5 分钟内回复“确认”或“取消”。新请求会替换旧的待处理计划。每条已确认命令都包含 `msg.destination`、`msg.dpt`、`msg.payload` 和 `msg.event = "GroupValue_Write"`。
最近的会话记忆会紧邻当前请求放置，使本地模型即使面对很大的 KNX 提示，也能保留用户提供的事实，例如首选姓名或语言。模型可以通过 `memoryActions` 持久保存耐久的事实、偏好和指令；这仍是没有短语分类器或 intent 路由的语义工具选择。凭据、安全代码和 API 密钥绝不能被学习。

对于 DPT 1.xxx 写入，AI 生成的安全等价值 `true`/`false`、`1`/`0` 和 `on`/`off` 会在本地校验和输出前统一转换为真正的布尔值。

### 最新 KNX 读取
当用户明确要求当前或最新状态时，AI 可以查询已导入 ETS 目录中的精确对象，包括状态对象和其他只读对象。输出 4 会发送 `msg.destination`、`msg.dpt`、`msg.event = "GroupValue_Read"` 和 `msg.readstatus = true`。节点会为每个 `GroupValue_Response` 或最新写入等待最多 6 秒，然后在输出 3 返回解码值，并在 `msg.knxAi.readResults` 中提供详细信息。读取从不需要确认，也绝不会转换为写入。如果小型本地模型省略操作类型和 payload，精确的 ETS 对象会被安全规范化为读取；包含 payload 的项目仍作为经过验证的写入处理。

### 多步骤对话例行程序
“我要离家”“晚安”或“影院模式”等请求可以在不增加编辑器选项的情况下，根据当前状态协调例行程序。第一次 LLM 处理仅接受精确的 ETS 读取（最多 20 个）；KNX AI 发送读取，并把最新的 GA/DPT/值结果交给隔离的第二次规划处理。第二次处理最多可准备 12 个已验证写入，但不能再次发起读取循环。启用确认时，整个计划只需一次本地化确认；确认前不会发送任何写入或所请求的 TTS 播报。确认后，每个写入都会重新验证、按顺序转发，并在最多 4 秒内观察总线上匹配的即时反馈。最终回复会区分已观察到反馈的操作与没有即时反馈的操作，但不会把后者报告为设备故障。详细信息位于 `msg.knxAi.routine`、`readResults`、`verifiedCount` 和 `unverifiedCount`。

### 用于聊天按钮的确认请求
计划等待确认时，输出 3 包含 `msg.knxAi.confirmationRequest`。该对象包括 `required`、`status`、`sessionId`、`expiresAt`、`commandCount`，以及 `actions` 中的两个项目。使用 `action.label` 作为 Telegram 按钮文本，使用 `action.callbackData` 作为回调，并将 `action.message` 发送回 KNX AI，即可在无需输入文本的情况下确认或取消。

### 输入/输出消息适配器
**聊天输入/输出端口**部分从 `resources/KNXAIChatAdapterMappings.js` 加载可选映射。选择适配器会在内部安装两段预定义的同步 JavaScript 映射：一段在 KNX AI 处理输入前运行，另一段在输出 3 发出消息前运行。这些映射在编辑器中始终保持隐藏。语法和执行错误会被捕获并报告，不会停止 Node-RED。

随附的 **windkh/node-red-contrib-telegrambot** 预设遵循该包的 receiver/sender 消息约定。把 `telegram receiver` 直接连接到 KNX AI，并把输出 3 直接连接到 `telegram sender`。确认操作使用一次性 Telegram 回复键盘：点击**确认**或**取消**后，会通过同一个 receiver 返回普通的本地化消息，因此不需要 `telegram event` 或 callback 连线。旧的 `callback_query` 消息仍可接受。输入映射会提取 `msg.payload.content`、`msg.payload.chatId` 和 Telegram 语言；输出映射会创建所需的 `msg.payload.chatId`、`type` 和 `content`，并在写入等待确认时从 `msg.knxAi.confirmationRequest` 添加 `options.reply_markup`。Telegram 包仍是独立的可选依赖项。

使用此预设时，只有将 **Provider** 设置为 **OpenAI-compatible**，Telegram 语音消息（`msg.payload.type = "voice"`）才会被自动处理。KNX AI 会在下载任何内容前验证提供商，直接复用其 **Endpoint URL** 和 **API key**，并从同一连接派生 `/audio/transcriptions` 与 `/audio/speech`。包含令牌的 `msg.payload.weblink` 仅用于受限下载，并会在消息到达输出或 LLM 之前删除。OGG/Opus 输入使用内置默认值 `gpt-4o-mini-transcribe` 转录；成功请求会收到由 `gpt-4o-mini-tts` 和 `alloy` 生成的原生 Telegram OGG/Opus 回复，同时保留文字说明和确认键盘。如果选择了其他提供商，用户会收到本地化提示，要求改选 OpenAI-compatible 或发送文字。如果语音合成不可用、失败或超过语音限制，则发送完整文字回复。下载的音频和生成的回复文本都会发送到同一个所选提供商。文字消息、照片以及较早保存的 Telegram 映射仍保持兼容。

每条原生语音回复的文字说明都会以本地化的 **AI 生成的语音** 提示开头，Telegram 收件人可以看到该提示。

随附的 **RedBot / node-red-contrib-chatbot (Telegram)** 预设遵循 RedBot 的通用消息格式。将 `chatbot-telegram-receive` 直接连接到 KNX AI，并将输出 3 直接连接到 `chatbot-telegram-send`；无需单独的 callback 节点，因为 RedBot 会把内联按钮的 postback 转换成普通入站消息。文本和 postback 使用 RedBot 的 `message` payload。Telegram 原生语音以 `type = "audio"` 到达，其中包含已由 RedBot 下载的 OGG/Opus `Buffer`；KNX AI 无需再次下载即可执行大小和时长限制，使用上文所述的同一个 OpenAI-compatible 提供商进行转录，并返回带文字说明和本地化 AI 生成语音提示的原生 RedBot `audio` payload。当 KNX 写入需要确认时，回复会有意保留为文本 `inline-buttons` payload，因为 RedBot 无法把这些按钮附加到同一条语音消息。输出映射会保留 RedBot 的 `originalMessage`、`chat`、`api` 和 `client` 跟踪数据；旧的已保存 RedBot 映射也会在运行时升级。RedBot 仍是独立的可选依赖项。

### 自动检测的摄像机适配器
已安装的摄像机软件包可以在运行时向 KNX AI 发布适配器。无需选择器，也无需将摄像机节点连接到 KNX AI：可用的适配器、控制器和摄像机会被自动检测并加入聊天上下文。`node-red-contrib-unifi-ultimate` 是首个受支持的提供方；`hikvision-ultimate` 等其他软件包可通过同一套厂商无关协议注册。

用户可以请求当前快照，或询问视觉模型画面中可见的内容。Telegram 和 RedBot 预设会把图像作为带说明文字的原生照片发送。用户还可以为移动、智能越线或进入入侵/徘徊区域创建持久通知，并可按检测到的人员以及指定名称的线或区域进行限制。这些规则保存在同一个 `knxai-chat-context.knxctx` 文件中，并在 Node-RED 重启后恢复。UniFi 事件订阅和快照请求直接通过检测到的提供方完成；不会使用 KNX AI 输出 4，也不需要中间 Flow 连线。

自动检测到的适配器发布的每个事件都会被标准化，并以 KNX AI 原生紧凑行格式直接追加到 `knxultimatestorage/knxai/adapter-history/<节点ID>/` 下的每日 `YYYY-MM-DD.knxctx` 文件。KNX 报文存档使用相同的紧凑格式，不经过中间 JSON 序列化。存档保留 10 天，保证超过 24 小时的历史，只保存事件元数据，不保存图像。现有 JSONL 存档不会被读取或迁移。提示词会使用所提供时间范围内最新的精确行，并自动适配本地模型的活动窗口。

### 使用 TTS Ultimate 播报
将输出 5 连接到可选软件包 `node-red-contrib-tts-ultimate` 中的一个或多个 `ttsultimate` 节点。目标和分发由普通 Node-RED 连线决定；如果 TTS 节点位于另一个 Flow 标签页，请使用 Link Out/Link In。原有的 TTS 节点选择器和内部注入已被移除。输出 1–4 的位置保持不变，但升级后的 Flow 必须实际连接输出 5，语音播报才能到达 TTS Ultimate。

模型会根据当前请求、持久聊天指令和用户管理的 AI 教育自行判断是否准备播报；系统没有播报 intent，也没有触发短语列表。KNX 数值、适配器事件、图像和存档始终是数据而不是指令，但可信的用户指导可以教会模型如何处理这些数据。输出 5 在 `msg.payload` 中发送需要朗读的准确文本，设置 `msg.topic = "knx_ai_announcement"`，并添加 `msg.knxAi.type = "tts_announcement"`、`msg.knxAi.sourceNodeId`、`msg.knxAi.sessionId` 和 `msg.knxAi.reason`。之后由 TTS Ultimate 处理播放器、语音、音量、提示音和队列。

### 聊天上下文概览
节点编辑器会显示一张紧凑卡片，汇总聊天可用的来源：默认最近 20 分钟或明确时间范围内的 KNX 与适配器事件、可在本地完整检索且每次仅把已检索对象加入提示词的 ETS 目录、按需加入的 Function 源码、会话和家庭记忆、AI 教育、活动计划及检测到的摄像机。卡片还会显示模型报告的最大运行上下文和上次聊天提示词的实际 UTF-8 大小；提供商返回输入令牌数时使用精确值，否则明确标为估算值。卡片还会列出权威 JSON 计划文件和易读 Markdown 计划文件的绝对路径，以及 KNX 报文与适配器事件归档和每日文件模式 `YYYY-MM-DD.knxctx`。AI 教育保存在节点配置中，因此没有单独的运行时文件。

模型会把本地 ETS 目录检索、KNX 读写、摄像机适配器、TTS 播报、持久记忆、Web 访问以及计划/提醒作为结构化工具。它可以依据当前请求和可信的已学习指导进行语义选择与组合，而不经过语言意图路由。目录检索是确定性的本地操作；运行时验证工具参数、摄像机适配器可用性和安全边界，KNX 写入仍保留完整的本地 ETS/DPT 校验和已配置的确认步骤。

临时本地调试文件 `knxai-last-chat-prompt-<节点ID>.txt` 包含最近一次发送的精确 system/user 提示文本，会在每次聊天调用前覆盖，且不包含 API 密钥或 HTTP 标头。

### 编辑和备份聊天学习
Node-RED 的 KNX AI 配置中，**对话与家庭**选项卡包含**打开 AI 聊天学习**按钮；它会为当前节点直接打开 Vue Web UI 中的此编辑器。

在 Vue Web UI 中打开**设置 → AI 聊天学习**，即可查看和编辑准确的共享文件 `knxai-chat-context.knxctx` 及其绝对路径。可复制该文件、下载备份，或从另一个 `.knxctx` 文件恢复。**重新初始化记忆**操作受明确确认保护；它会用新的空白上下文替换该文件，并清除使用同一存储的所有 KNX AI 节点中的已保存会话、指令、摄像机监视和待处理聊天确认。以制表符分隔的原生 `KNXAI_CHAT_CONTEXT 3` 记录是权威数据，并可直接编辑：`SESSION` 包含 `INSTRUCTION`、`TURN` 和 `CAMERA_WATCH` 记录，直至 `END_SESSION`。保存时会验证并限制这些记录、以原子方式重写文件，并立即更新所有相关节点的活动上下文。修订检查会拒绝覆盖或重置编辑器加载后又发生变化的学习内容。

仅支持原生 V3 格式。旧版 Markdown/JSON V2 和 Base64 V1 文件不会被读取、导入或迁移；旧的 `.md` 文件保持不变，KNX AI 会启动新的 `.knxctx` 上下文。仍保留 50 个会话和 512 KB 的限制。

### ETS 对象访问
ETS 对象访问是唯一的操作权限依据。**ETS 对象访问**中选中的每个地址都处于活动状态且可读取；除非标记为**只读**，否则也可写入。聊天模型不会收到任何推断出的角色分类，写入授权也不再依赖角色。

## 由 AI 教育驱动的主动家庭智能与有限记忆
节点会根据 ETS 层级、名称、角色和 DPT 建立确定性的语义模型。不再提供单独的开关或高级主动通知设置。只有启用 LLM 且 **AI 教育**明确要求时，系统才会评估通知。条件、持续时间、静默时段和重复频率完全由 AI 教育定义。没有明确规则或 LLM 无法评估时，不会发送任何消息。

最近一次聊天会话会被记为主人并接收主动消息。输出 3 会设置 `msg.knxAi.type = "proactive_notification"`，`msg.inputMessage` 为聊天适配器保留该会话。每小时最多三条主动通知可防止消息泛滥。节点绝不会主动使用输出 4，也不会自行修改 KNX。

共享的学习参考文件会在启动时从 `<userDir>/knxai/memory/knxai-home-memory.md` 加载，每 15 分钟以原子方式重写，并始终严格限制为 5 MB。最多保留 120 条重要观察、80 条聚合习惯、80 条通知和 300 个 ETS 语义对象，绝不会保存无限的原始报文流。较旧且优先级较低的项目会先被删除。

**AI 教育**最多 16,000 个字符，是随节点保存在 Node-RED 流程中的固定属性。只有用户能在编辑器中修改，并通过 Deploy 应用。模型会将其作为权威指导读取，但绝不能写入或覆盖。聊天中要求记住的事实和偏好属于学习到的聊天记忆；一次性或周期性的计划、提醒、监测和未来命令属于语义调度器。学习记忆文件有意不包含 AI 教育文本。

## 实用配置示例
请将完整的通知策略写入 **AI 教育** (`aiEducation`)：

```text
称呼我为 Alex，并使用与我相同的语言回答。
除非我要求技术细节，否则回答要简短。
卷帘、窗户或门保持打开至少 120 分钟时，通知我最近的聊天。
23:00 到 07:00 之间不要通知，同一提醒在六小时内不要重复。
书房卷帘白天可以保持开启：不要因此通知我。
如果“客厅灯”指向多个灯，请先询问我具体是哪一个。
在 KNX 状态对象确认之前，绝不要声称执行器已经改变。
```

使用这些设置后，客厅卷帘开启 120 分钟时，输出 3 可以发送本地化的 `proactive_notification`；而书房卷帘的候选通知会根据 AI 教育被抑制。如果 Alex 随后要求关闭客厅卷帘，KNX AI 会准备准确的 ETS 命令，但在输出 4 前仍执行正常的验证与确认。

请使用清晰的 ETS 层级和对象名称，并正确设置状态/命令角色。AI 教育可以个性化决策和措辞，但不能虚构组地址、更改 DPT 或绕过 KNX 验证。

## 快速工作流程：KNX 控制
1. 将 ETS CSV 导入网关，并配置 LLM 提供商、模型和凭据。
2. 启用 **LLM 助手**和 **读取 KNX 状态并控制执行器**；保持确认选项启用。
3. 将聊天输入连接到 KNX AI，并保留稳定的会话/聊天 ID。
4. 将输出 3 连接到聊天回复，将输出 4 连接到处于**通用模式**的 KNX Ultimate。
5. 用户发送请求；当前状态会立即读取，而写入会先显示 GA、DPT 和值，不会立即写入总线。
6. 同一聊天必须在 5 分钟内准确回复“确认”或“取消”。
7. 只有“确认”会重新验证并在输出 4 发送命令；请通过 KNX 状态 GA 验证执行结果。

## 配置字段
以下是编辑器里用户可见的全部字段名称。

### 通用
- **Gateway**：作为电报来源的 KNX Ultimate 网关/配置节点。
- **Name**：节点名称与仪表板标题。
- **Topic**：节点输出使用的基础 topic。
- **Open KNX AI Web** 按钮：打开网页仪表板（`/knxUltimateAI/sidebar/page`）。

### AI 助手
- **Enable LLM assistant**：启用 Ask/chat 功能。
- **Provider**：LLM 后端（OpenAI-compatible、Anthropic、Ollama 或 Bionic LM Studio）。
- **Endpoint URL**：chat/completions 接口 URL。
- **API key**：API Key（本地 Ollama 可不填；Bionic LM Studio 在未启用服务器身份验证时也可不填）。
- **Model**：模型 ID/名称。
- **推理强度**：适用于支持推理强度控制的模型，且不依赖具体提供商。选择**自动**时不发送偏好，并保留模型/提供商的默认值。可明确选择 `none`、`minimal`、`low`、`medium`、`high`、`xhigh` 或 `max`；实际支持情况取决于请求协议和模型。如果该值被拒绝，KNX AI 会在不发送此偏好的情况下重试。
- **允许 AI 使用 Web**：默认关闭。允许模型按语义选择通用 Web 工具，并返回已验证、已引用的来源。
- **每小时最多 Web 调用次数**：对话和用户创建的计划任务共享滚动预算。每个回合或计划任务执行最多使用三次操作。
- **Telegram 语音**：仅在选择 **OpenAI-compatible** 提供商时可用。它会自动复用该提供商的端点和 API 密钥，并使用内置默认值 `gpt-4o-mini-transcribe`、`gpt-4o-mini-tts` 和 `alloy`；不再提供单独的语音设置。
- **聊天模型兼容性**：所选模型必须支持已配置的 Chat Completions 端点。刷新模型列表时，会排除仅支持旧版 completions 的模型，例如 `gpt-3.5-turbo-instruct`。如果提供商拒绝自定义 temperature 值或令牌限制参数，KNX AI 会仅移除或替换不兼容字段后重试。
- **允许 AI 读取 KNX 状态并控制执行器**：启用输出 4，默认关闭。所有选中的 ETS 对象都可读取；所有未标记为**只读**的选中对象都可写入。未知、DPT 不匹配、无效或数量过多的操作，以及向只读对象的写入，都会在本地被拒绝。
- **发送 KNX 命令前请求确认**：默认启用。先显示已验证的修改，在同一聊天会话确认前不会发送任何 KNX 命令。有命令等待确认时，回复始终会使用当前请求的语言附加准确的确认或取消说明。命令会在输出前再次验证。
- **输入/输出消息适配器**：默认为**无适配器**。选择后会加载预定义的输入和输出映射；两者在编辑器中始终保持隐藏。
- **AI 教育**：固定且权威的节点指导，仅由用户修改并通过 Deploy 应用。模型会读取，但绝不会写入。长期主动家庭策略在这里定义；聊天中要求记住的事实和偏好进入学习记忆，一次性或周期性的计划、提醒、监测和未来命令进入语义调度器，无需触发短语或 intent 路由。
- 软件包附带的帮助、README、更新日志、Wiki 和示例片段不会加入 Telegram、RedBot 或自定义 CHAT 的提示词；仅网页助手在回答软件包技术问题时仍可使用这些内容。
- **Refresh** 按钮：请求 provider 并加载可用模型 ID。加载期间图标会旋转；成功完成时不会显示额外消息。

### Ollama 快速配置（本地）
- 选择 **Provider = Ollama**。
- 默认 endpoint：`http://localhost:11434/api/chat`。
- 若未发现本地模型：
  - **1) Download model**：打开 **Model library** 页面。
  - **2) Install it**：在本机下载并安装模型（例如 `llama3.1`）。
- 在刷新/安装模型时，KNX AI 也会在可能情况下尝试自动启动 Ollama 服务。
- 若安装因连接错误失败，请确认 Ollama 已运行（桌面应用或 `ollama serve`）。
- `/api/show` 报告的最大上下文会直接作为 `num_ctx` 使用。KNX AI 不应用更小的提示预算，并发送去重后的运行提示词，不进行基于大小的压缩，同时不会超过模型声明的物理上限。
- 若 Node-RED 运行在 Docker 中，endpoint 请使用 `host.docker.internal` 替代 `localhost`。

### Bionic LM Studio 快速配置（本地）
- 选择 **Provider = Bionic LM Studio**。
- 在 LM Studio 的 **Developer** 页面启动 API 服务，或运行 `lms server start`。
- 默认 endpoint：`http://localhost:1234/v1/chat/completions`。
- 点击 **Refresh** 加载 `/v1/models` 提供的全部模型；未配置模型时会自动选择第一个。
- 如果模型已加载，KNX AI 会保留其当前上下文长度。KNX AI 不会通过管理 API 加载未运行的 Bionic 模型：首次聊天请求会让 Bionic 根据该模型已保存的默认值进行 JIT 加载。所有可用提示上下文都不受应用预算限制；如果无法放入当前窗口，请求会明确失败。
- 除非在 LM Studio 服务设置中启用了身份验证，否则 API Key 可留空。在 Docker 中请将 `localhost` 替换为 `host.docker.internal`。

## 安全说明
启用 LLM 后，KNX 流量上下文可能发送到所配置的 endpoint。若需严格本地化，请使用本地 provider。输出 4 上的命令仅表示已通过本地验证并转发到 flow，并不能证明执行器已执行；需要确认时请使用 KNX 状态 GA。
