### 升级到 KNX Ultimate 8

版本 7 会在此编辑器顶部显示一个小型的 **升级到 v8** 按钮。它会下载流程备份、安装所需的 HUE/Matter 软件包、转换兼容节点、执行完整部署、验证已保存的流程并安装版本 8。出现提示后必须重启 Node-RED 服务；仅重新加载浏览器并不足够。旧版 KNX AI 节点会停止自动操作。

[完整升级指南](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/zh-CN-Upgrade-to-v8)

<br/>

  <p><b>这是一个隐藏的旧版节点，仅为现有 flow 保留。</b></p>
  <p>新安装请使用 <code>node-red-contrib-cerebrum-ultimate</code> 软件包中的独立 <b>Cerebrum Ultimate</b> 节点。它已取代此节点，并将 KNX Ultimate 作为可选兼容集成。</p>
  <p><a href="https://github.com/Supergiovane/node-red-contrib-cerebrum-ultimate#readme" target="_blank">打开 Cerebrum Ultimate 文档</a>。</p>
