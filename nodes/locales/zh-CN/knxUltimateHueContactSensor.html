### 升级到 KNX Ultimate 8

版本 7 会在此编辑器顶部显示一个小型的 **升级到 v8** 按钮。它会下载流程备份、安装所需的 HUE/Matter 软件包、转换兼容节点、执行完整部署、验证已保存的流程并安装版本 8。出现提示后必须重启 Node-RED 服务；仅重新加载浏览器并不足够。旧版 KNX AI 节点会停止自动操作。

[完整升级指南](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/zh-CN-Upgrade-to-v8)

<br/>

<p><strong>已弃用：</strong>此专用 HUE 节点仍可用于现有流程。新项目请使用 <strong>HUE Controller</strong>。旧版节点会在节点面板和画布上标记为 <code>(deprecated)</code>，颜色比 HUE Controller 更浅，编辑器顶部也会显示迁移提示。 此编辑器中带白色文字的高对比度橙色迁移按钮会在本地转换所有旧版 HUE 节点；完成后只会打开一封可编辑的邮件草稿。邮件绝不会自动发送。流程结束后，Node-RED 的固定消息会一直显示，直到您点击“确定”，并提供一个可选支持按钮；只有点击该按钮时才会打开捐赠页面。 开始前，请<a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">在 YouTube 上观看说明视频</a>。</p>
<p>该节点将 HUE 接触传感器事件映射到 KNX 组地址。</p>

开始输入GA字段，KNX设备的名称或组地址，可用设备在输入时开始显示。

**一般的**

|属性|描述|
| - | - |
|KNX 网关 |选择要使用的KNX门户|
|Hue Bridge|选择要使用的 Hue Bridge|
| Hue 接触传感器 | 要使用的 HUE 接触传感器（自动补全） |

|属性|描述|
|-------- |------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| 联系 | 传感器开/合时：发送 KNX 值 _true_（激活/打开），否则 _false_ |

### 输出

1. 标准输出
   ：有效载荷（布尔值）：命令的标准输出。

### 细节

`msg.payload` 为 HUE 事件（布尔/对象），可用于自定义逻辑。
