# KNX Utility

Select one function for each KNX Utility node. Functions that use the KNX bus require a gateway; Home Assistant Translator works directly on messages. The editor, icon and ports follow the selected function. KNX Device remains the main KNX node.

The conversion button migrates all eleven compatible legacy types in every flow and subflow, locally in the editor. IDs, settings, wires and groups are preserved, including the IDs used for saved AutoResponder values and scenes, GlobalContext variable names and Logger file paths. Review the converted flows and deploy when ready. A single Undo restores the original nodes. Switching a function while editing keeps temporary drafts; Cancel leaves the saved node and scenes unchanged. New AutoResponder instances start with an empty address list. Scene rule changes invalidate learned values only when deployed.

After confirmation and before any nodes are changed, the browser automatically starts downloading a dated JSON backup of all current editor flows, including tabs, subflows, configuration nodes, groups and wires. The file uses the standard Node-RED export format and can be reimported. Credentials declared by nodes are excluded, as in the standard export. Your browser may ask where to save the file. If the backup cannot be prepared or its download cannot be started, no nodes are converted.

## Alerter

### ALERTER NODE CONFIGURATION

With the Alerter node you can signal to a display or to the node-red-contrib-tts-ultimate node (audio feedback) if the selected devices are alerted, i.e. they have payload **true** .
The node issues messages at specified intervals (one message at a time) containing the details of each alerted device. For example, the node can tell you how many and which windows are open. <br/>
The node receives the values of the devices directly from the KNX BUS. Furthermore, you can send personalized messages to the node, not linked to KNX devices. <br/>
The example page explains how to use the node. <br/>

- **Gateway**

> Select the KNX gateway used by this node.

- **Name**

> Node name.

- **Alerting cycle start type**

> Here you can select the event that will skip the start of sending messages from alerted devices.

- **Interval between each MSG (in seconds)**

> Interval between each outgoing message from the node.

## DEVICES TO MONITOR

Here you can add devices to monitor. <br/>
Enter the device name or its group address. <br/>

- **Read value of each device on connection/reconnect**

> On connection/reconnection, the node will send a 'read' request each device belonging to the list.

- **ADD button**

> Add a row to the list.

- **Device's rows ** > The first field is the group address (but you can also enter any text, which you can use with inbound messages, see the example page), the second is the device name**(MAX 14 CHARS)** , the third is the long device name.

- **DELETE button**

> Removes a device from the list.

<br/>
<br/>

## MESSAGE OUT OF THE NODE

PIN1: The node emits a message for each alerted device, at selectable intervals.<br/>
PIN2: The node emits a unique message containing all alerted devices.<br/>
PIN3: The node emits a message containing only the last alerted device.<br/>

**PIN1**

```javascript

msg = {
    "topic":"0/1/12",
    "count":3, // TOTAL number of alerted devices
    "devicename":"Bedroom window",
    "longdevicename":"Bedroom main window",
    "payload":true
}

```

**PIN2**

```javascript

msg = {
    "topic":"door, 0/0/11, 0/1/2, 0/0/9",
    "devicename":"Main Door, Applique soggiorno, Applique taverna, Luce studio",
    "longdevicename":"Main entry Door, Applique sinistra soggiorno, Applique destra taverna, Luce soffitto studio",
    "count":4,
    "payload":true
    }

```

**PIN3**

```javascript

msg = {
    "topic":"0/1/12",
    "count":3, // TOTAL number of alerted devices
    "devicename":"Bedroom window",
    "longdevicename":"Bedroom main window",
    "payload":true
}

```

Outgoing message when all devices are at rest

**PIN1, PIN2, PIN3**

```javascript

msg = {
    "topic":"",
    "count":0,
    "devicename":"",
    "longdevicename":"",
    "payload":false
}

```

<br/>
<br/>

## MESSAGE INTO THE NODE

```javascript

msg.readstatus = true
```

Read the value of each device belonging to the list.

```javascript

msg.start = true
```

The sending cycle of all alerted devices begins. The cycle ends with the last alerted device. To repeat the cycle, send this inbound message again.

<br/>

**Custom device alert** <br/>

To update the true/false value of a custom device, you can send this inbound message

```javascript

msg = {
    "topic":"door",
    "payload":true // Or false to reset the alert for this device
}

```

## AutoResponder

This node will respond to read requests from the KNX BUS.  

The node records all telegrams transmitted to the KNX BUS and store the values in memory.\
It then responds to read requests by sending such memorized value back to the BUS as request.\
If the group address to be read has no value yet, the node will respond with a default value.\
The node will respond only to group addresses specified in the **Respond to** JSON field.\
New instances start with `[]`. Add only the group addresses this node should answer.

**Configuration**

|Property|Description|
|--|--|
| Gateway | Select the KNX gateway to be used |
| Respond to | The node will respond to read requests coming from the group addresses specified in this JSON array. The format is specified below. |

<br/>

**JSON format** The JSON is **always** an array of object, containing each one directive. Each directive, tells to the node what do do.

|Property|Description|
|--|--|
| note | **Optional** note key, for reminders. It will not be used anywhere. |
| ga | The group address. You can also use the ".." wildchars, to specity a range of group addresses. The ".." can only be used with the third ga's level, ex: **1/1/0..255** . See the samples below. |
| dpt | The group address data point, in the format "1.001". It's **optional** if the ETS CSV file has been imported. |
| default | The value sent to the BUS in response to a read request, when the group address value has not yet been memorized by the node. |

**Let's start with one directive**

The AutoResponder node will respond to read requests for the group address 2/7/1. If no value is yet in memory, it will reply with _true_.\
The ETS CSV file must have been imported, otherwise you must add the **"dpt":"1.001"** key as well.

```json

[
    {
        "ga": "2/7/1",
        "default": true
    }
]
```

**A bit more complete directive**

The AutoResponder node will respond to read requests for the group address starting from 3/1/1, to 3/1/22 included. If no value is yet in memory, it will reply with _false_.\
There is also a **note** key, merely as a reminder note. It will not be used anywhere.

```json

[
    {
        "note": "Virtual sensors coming from Hikvision AX-Pro",
        "ga": "3/1/1..22",
        "dpt": "1.001",
        "default": false
    }
]
```

**Concatenating directives**

The AutoResponder node will respond to read requests for the group address starting from 2/2/5, to 2/2/21 included. If no value is yet in memory, it will reply with a value of 25.\
The AutoResponder node will also respond to read requests for the group address 2/4/22. If no value is yet in memory, it will reply with the string _Unknown status!_.\
Please note the **comma** between each directive's JSON object.

```json

[
    {
        "note": "DALI garden virtual brightness %",
        "ga": "2/2/5..21",
        "default": 25
    },
    {
        "note": "Alarm armed status text",
        "ga": "2/4/22",
        "dpt": "16.001",
        "default": "Unknown status!"
    }
]
```

## Date / Time

Sends the system date and time to the configured group addresses: **19.001** for date/time, **11.001** for date and **10.001** for time. Configure at least one address; all configured addresses receive a telegram. ETS autocomplete suggests matching addresses.

Enable sending on startup with a delay, periodic sending in seconds or minutes, or use the button on the deployed node to send immediately. The button is enabled only after deploying changes. This profile has no flow input or output ports.

While the gateway is disconnected, the latest pending send is retained and sent when the connection returns.

## WatchDog

<p>Checks the connection to the Gateway or to a specific KNX device</p>

### WatchDog

**What does it do?**

1. Checks for the healty of KNX BUS communication/connection by sending a telegram at regular intervals, watching for a response and sends a msg to the flow if a connection to KNX Bus is broken. Two check levels, see below.
2. Programmatically changes the Configuration Node parameters, thus the connection to your KNX/IP Router/Interface (for example, if you have 2 KNX/IP Routers and you want to switch between the two for connection backup).
3. Forces the gateway's connection/disconnection from/to the KNX BUS.

#### Ethernet level and KNX Twisted Pair level checks

The WatchDog has two check levels.

The first, checks only the connection between knx-Ultimate and the KNX/IP Interface.

The second one, checks the entire route, from knx-Ultimate Gateway node to ethernet, then to KNX TP media and vice versa; this implies the use of a physical device, responding to a read requests.

The WatchDog node is a powerfull node for signalling errors and connection problems. <br />

You can send an Email to the KNX installer responsible to your Building, or you can automatically switch to a backup KNX/IP Router/Interface in your installation.

#### SETTINGS

| Property | Description |
| ----------------------------- | --------------------------------------------------------------------------------------------------- |
| Gateway | Selected KNX gateway. |
| Group Address to monitor | The node will send a telegram to this address and monitors the message flowing through the KNX BUS. The Datapoint must be DPT 1.x (boolean).|
| Node Name | Node Name |
| Auto start the watchdog timer | The watchdog timer starts automatically on deploy or on node-red start. |
| Listen to KNX-Ultimate node errors | Enabled by default. Outputs a `NodeError` when a KNX-Ultimate node associated with the selected gateway, including KNX Device, reports a red error status. Disabling it suppresses only those `NodeError` messages; the WatchDog's own bus checks and control messages remain active. |
| Check level (please see the wiki) | See below |

**Check level** > _**Ethernet**_: Checks the connection between knx-ultimate Gateway in unicast mode and your KNX IP Interface.<br />

<img src="https://raw.githubusercontent.com/Supergiovane/node-red-contrib-knx-ultimate/master/img/wiki/WatchDogEthernetLevel.png"
 width="90%"><br />

> _ **Ethernet and KNX TP** _ : Complete check. It works either with KNX/IP Routers and KNX/IP Interfaces (as well as

address set), it checks the connection between KNX-Ultimate and this physical KNX device, by issuing a read request and by awaiting a response telegram from this device. Any error on the ethernet trunk or on the KNX Twisted Pair trunk will be notified. To setup this check level, you need to reserve a Group Address and add it to a "Status" output of your KNX Actuator. For example, if you have a light actuator, it has for sure a "light status" output that can **respond** to a **read request**.

About this picture, in ETS, assign an Output of this Gira KNX Actuator to a Light **Status** (for example 12/0/0). Everytime the Watchdog node asks for the status, the Gira KNX Actuator will respond. The WatchDog then know, that your KNX

Twisted Pair connection is up and running.

<img src="https://raw.githubusercontent.com/Supergiovane/node-red-contrib-knx-ultimate/master/img/wiki/WatchDogEthernetKNXTPLevel.png"
 width="90%"><br />

#### ADVANCED OPTIONS

| Property | Description |
| -------- | ----------- |
| Retry interval (in seconds) | The node sends a telegram to the KNX bus at this time interva, in seconds. |
| Number of retry before giving an error |After the telegram has been sent for this amount of times, without any response from KNX Bus, the node throws an error. |

### MESSAGE OUTPUT FROM THE WATCHDOG

The WatchDog always outputs its own bus-check and control messages. When **Listen to KNX-Ultimate node errors** is enabled, it also outputs errors reported by KNX-Ultimate nodes, including KNX Device, associated with the selected gateway.<br />

**In case of Watchdog self connection problem**

<a href="https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/WatchDog-Configuration"
 target="_blank">Please see here.</a>

```javascript

msg = {
type:"BUSError"
checkPerformed: "Ethernet" for basic check, or "Eth+KNX" for full check.
nodeid: "23HJ.2355" // (The node ID causing the error, so you can find it using node-red "search" funtion)
payload: true
description: // (whatever error description)
}

```

<br />

**When KNX-Ultimate node error listening is enabled and one of your nodes is in trouble**

```javascript

msg = {
type:"NodeError"
checkPerformed: "Self KNX-Ultimate node reporting a red color status"
nodeid: "23HJ.2355" // (The node ID causing the error, so you can find it using node-red "search" funtion)
payload: true
description: // (KNX-Ultimate node reports his error here)
completeError:{
nodeid: "23HJ.2355" // (The node ID causing the error, so you can find it using node-red "search" funtion)
topic: "0/1/1" // (or the custom topic you set in the knx-ultimate node)
devicename: "Kitchen Light"
GA: "0/1/1"

}
}

```

<br />

**In case of a new gateway configuration is called via setGatewayConfig**

```javascript

msg = {
type:"setGatewayConfig"
checkPerformed: "The Watchdog node changed the gateway configuration."
nodeid: "23HJ.2355" // (The node ID issuing the setGatewayConfig, so you can find it using node-red "search" funtion)
payload: true
description: "New Config issued to the gateway. IP:224.0.23.12 Port:3671 PhysicalAddress:15.15.1
BindLocalInterface:Auto"
completeError:""
}

```

<br />

**Forced connection/disconnection**

```javascript

msg = {
type:"connectGateway"
checkPerformed: "The Watchdog issued a connection/disconnection to the gateway."
nodeid: "23HJ.2355" // (The node ID issuing the connection/disconnection request, so you can find it using node-red
"search" funtion)
payload: true // true if you requested the connection, false if you requested the disconnection
description: "Connection"
completeError:""
}

```

<br />

### INPUT FLOW MESSAGE

The WatchDog node accepts flow's input and transmits flow's output. Below, an explanation of the message's format to be sent to or trasmitted from the node.

#### START AND STOP THE WATCHDOG

To start and stop the watchdog, you can pass this as message to the node<br />

**START WATCHDOG** <br />

```javascript

// Start the WatchDog
msg.start = true;
return msg;

```

**STOP WATCHDOG** <br />

```javascript

// Start the WatchDog
msg.start = false;
return msg;

```

#### CHANGE THE KNX/IP ROUTER/INTERFACE SETTINGS ON THE FLY

With **msg.setGatewayConfig** , you can change the IP, Port, Physical Address, Protocol and so on of your KNX/IP Interface or Router, previously set in the Config-Node<br />

The Config-Node will change the settings and reconnect with new parameters.<br />

Be careful, if you restart node-red, the new settings are reverted to the settings specified in the Config-Node.<br />

**ALL parameters are OPTIONAL** <br />

```javascript

// IP: IP of your KNX/IP Router or Interface
// Port: Port of your KNX/IP Router or Interface
// PhysicalAddress: Physical address your KNX/IP Router or Interface (this is not a Group Address, this is a physical address indicating the physical device in your KNX installation)
// BindToEthernetInterface: "Auto" (for automatic detection) or the ethernet interface name, for example "en0".
// Protocol: "TunnelUDP" or "TunnelTCP" or "Multicast"
// importCSV: the ETS exported CSV or ESF. Please see the text format in the Gateway Config Wiki Page and in the youtube
video.
// All these parameters are optional

msg.setGatewayConfig={IP:"224.0.23.12",Port:3671,PhysicalAddress:"15.15.1",BindToEthernetInterface:"Auto",
Protocol:"Multicast", importCSV:`"Group name" "Address" "Central" "Unfiltered" "Description" "DatapointType" "Security"
"Attuatori luci" "0/-/-" "" "" "" "" "Auto"
"Luci primo piano" "0/0/-" "" "" "" "" "Auto"
"Luce camera da letto" "0/0/1" "" "" "" "DPST-1-1" "Auto"};`}

return msg;

```

All properties are optional. For example, to only change the IP:

```javascript

// IP: IP of your KNX/IP Router or Interface
msg.setGatewayConfig={IP:"224.0.23.12"};
return msg;

```

**FORCE GATEWAY'S DISCONNECTION AND DISABLE AUTO RECONNECTION ATTEMPTS** <br />

```javascript

// Force the gateway's disconnection from the BUS and stop the reconnection's attempts.
msg.connectGateway = false;
return msg;

```

**FORCE GATEWAY'S CONNECTION AND ENABLE THE AUTO RECONNECTION ATTEMPTS** <br />

```javascript

// Force the gateway's connection to the BUS and activate the reconnection's attempts.
msg.connectGateway = true;
return msg;

```

## Global Context

### KNX GLOBAL VARIABLE

This node exposes the group address received from the bus, to a **global variable** <br/>
You can write to the KNX BUS by simply update the global variable!<br/>

#### Overview

Put a Global Context Node into the flow, then give it a name.<br/>
The name you give to the node, will become the global context variable's name.<br/>
That's all. For security reasons, please **change the default node name** <br/>
You can access the global variable by adding the suffix \_READ to the node's name.<br/>
You can enable/disable the global context variable, or enable READONLY or READ/WRITE in the configuration window.<br/>
You can issue a KNX BUS write command, by simply modify the global variable name with suffix \_WRITE. _ **After the commands have been executed, the global variable with suffix \_WRITE is automatically emptied, not to infinitely repeat the commands. ** _ <br/>**Settings**

|Property|Description|
|--|--|
| Gateway | The KNX Gateway. |
| Variable Name (no spaces, only chars [a-z]) | Name of the global context. 2 variables with this name will be created, one with \_READ suffix (for reading group addresses) and the other with \_WRITE suffix (for writing group addresses). For example, if the variable name is "KNXGlobalContext", the 2 variables KNXGlobalContext\_READ and KNXGlobalContext\_WRITE are created. Since the global variable is visible from all nodes (even non-KNX-Ultimate ones), for security reasons, set a name other than the default one. Click the sample link at the bottom of the page. |
| Expose as Global variable | Choose if and how you want to expose the global variable. If you do not intend to write on the KNX BUS, for safety, leave "read only". |
| BUS write interval | The node checks the variable with \_WRITE suffix at regular intervals to write on the KNX bus. Choose the interval you prefer. |

#### MSG PROPERTIES

```javascript

// Properties of the variable, both in reading and in writing
{
    address : "0/0/1",
    dpt: "1.001", 
    payload: true,
    devicename:"Dinning Room->Table Light"
}

```

#### Get the variable's value

```javascript

// This function reads the variable
// Remember: add the string "_READ" after the node name to read the variable
let GroupAddresses = global.get("KNXContextBanana_READ") || [];

// Outputs the array, as example
node.send({payload:GroupAddresses});

// Get the Group Address object, having address 0/0/10
let Ga = GroupAddresses.find(a => a.address === "0/0/10");

// Outputs the object, as example
node.send({ Found: Ga });

// Do some testing and output some stuffs.
if (Ga.payload === true) return {payload : "FOUND AND TRUE"};
if (Ga.payload === false) return {payload : "FOUND AND FALSE"};

```

#### Send KNX telegram via global variable

```javascript

// This function writes the value to the KNX bus
let GroupAddressesSend = [];
GroupAddressesSend.push({address: "0/0/10", dpt:"1.001", payload:msg.payload});

// You can also avoid setting datapoint.
// This works gread if you have imported the ETS file, otherwise it'll guess the datapoint type by analyzing the payload
GroupAddressesSend.push({address: "0/0/11", payload:msg.payload});

// Remember: add the string "_WRITE" after the node name to write to the bus
global.set("KNXContextBanana_WRITE",GroupAddressesSend);

```

## Logger

### Logger

<p>The Logger node records all telegrams and outputs it in an ETS bus monitor XML compatible file.</p> 
<br/>
You can save the file on disk or send it to an FTP server, for example. The file can be then read by your ETS, for example for diagnostic or for a replay of the telegrams.
<br/>
The node can also count telegrams per second (or any interval you want).
<br/> <a href="https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/Logger-Sample" target="_blank">Examples are here.</a>

<br/>

#### SETTINGS

|Property|Description|
|--|--|
| Gateway | The KNX gateway. |
| Topic | The topic of the node. |
| Node Name | Node name. |

#### ETS compatible BUS Diagnostic File

|Property|Description|
|--|--|
| Auto start timer | Starts the timer automatically on deploy or on node-red start. |
| New payload every (in minutes) | Interval for emitting the payload and/or saving to file. When saving to file, once the configured row limit is reached, the file is **rotated**, removing the oldest rows first. |
| Max number of rows (0 = no limit) | This represents the maximum number of lines the XML file can contain (older lines are dropped first). Put 0 not to limit the number of rows in the file. When file saving is enabled, this value also represents the maximum number of rows in the file; when the limit is reached, the file is **rotated**, removing older rows over time. |
| Action | `Emit payload only` or `Emit payload and save to file`. |
| File path (absolute or relative) | Where to save the XML when action is set to save. |
<br/>

#### KNX Telegram Counter

|Property|Description|
|--|--|
| Auto start timer | Starts the timer automatically on deploy or on node-red start. |
| Count interval (in seconds) | How often emit a msg to the flow, containing the KNX telegrams count. In Seconds. |

<br/>

msg = {
        topic:"",

        currentTime:"25/10/2021, 11:11:44"
    } 

```

## Staircase

### KNX STAIRCASE LIGHT

<p>Use this node to implement a KNX staircase timer. It listens for trigger pulses, drives the output actuator, mirrors the state on a status GA and honours manual override or block commands.</p>

**Group addresses**

|Property|Description|
|--|--|
| Trigger GA | Binary input that starts the timer when it receives `1`. If “0 command cancels the cycle” is enabled, a `0` stops the light immediately. |
| Output GA | Actuator driven while the cycle is active. Select the DPT that matches the load (binary, dimming, analog, …). |
| Status GA | Mirrors the active/pre-warning state. With pre-warning in *Toggle status GA* mode it will briefly change state before timeout. |
| Override GA | Forces the light ON and pauses the timer for the duration of the override signal. |
| Block GA | When true, new triggers are ignored. Depending on *When blocked* the light is either forced OFF or left untouched. |

**Timer behaviour**

|Option|Description|
|--|--|
| Timer duration | Base countdown length for the staircase cycle. |
| On new trigger | Choose whether further pulses restart the timer, extend it by the configured duration, or are ignored. |
| 0 command cancels the cycle | Ends the cycle with reason `manual-off` when the trigger returns to `0`. |
| When blocked | Decide if a block command should only inhibit new triggers or also force the output off. |

**Pre-warning**

|Option|Description|
|--|--|
| Send pre-warning | Enables the alert before timeout. |
| Pre-warning offset | Seconds before the end when the alert is triggered. |
| Pre-warning mode | *Toggle status GA* briefly toggles the status address. *Flash output* switches the output off and back on after the configured flash duration. |
| Flash duration | Time in milliseconds the output remains off when flashing. |

**Node output**

- When *Emit events* is enabled the node outputs structured objects describing `trigger`, `extend`, `prewarn`, `timeout`, `override`, `block` and `manual-off` events. Each payload includes `event`, `remaining`, `active`, `override`, `blocked` and optional details.
- Without events enabled you can rely on the KNX status GA for automation feedback.

#### Inputs

|Property|Description|
|--|--|
| Flow input | Send `true`, `false`, `"open"` or `"close"` from the flow to start or cancel the timer. |
| KNX telegrams | The node reacts to telegrams for the configured group addresses. |

#### Flow example

```javascript

// Start the staircase timer
msg.payload = true;
return msg;
```

```javascript
// Cancel the timer (requires '0 command cancels the cycle')
msg.payload = false;
return msg;
```

#### Outputs

|Property|Description|
|--|--|
| Events (optional) | Sends the event objects when *Emit events* is checked. |

## Garage

### KNX GARAGE DOOR

<p>Control a KNX garage door with direct Boolean commands or toggle impulses, optional hold-open / disable GAs, safety photocell feedback and automatic re-close. The node can emit movement and obstruction indicators as well as structured events for the flow.</p>

**Command group addresses**

|Property|Description|
|--|--|
| Command GA (true=open, false=close) | Boolean GA (`gaCommand`) where `true` opens and `false` closes. Default DPT 1.001. |
| Impulse GA | Rising edge toggles the door (`gaImpulse`, default DPT 1.017). Used automatically when no direct command GA is provided. |
| Hold-open GA | Keeps the door open and cancels auto re-close while true (`gaHoldOpen`). |
| Disable GA | Blocks any command emitted by the node (`gaDisable`). Useful during maintenance/manual mode. |

**Input / sensor group addresses**

|Property|Description|
|--|--|
| Photocell GA | Goes true when the beam is interrupted; the node reopens and flags obstruction (`gaPhotocell`). |
| Moving GA | Optional pulse when the node commands movement so other devices can follow the motion (`gaMoving`). |
| Obstruction GA | Mirrors the obstruction status for dashboards, alarms or logic blocks (`gaObstruction`). |

**Automatic re-close**

- Enable *Auto re-close* to start a countdown whenever the door becomes open.
- Hold-open or disable cancel the timer until they return to false.
- When the timer expires the node sends the close command (or impulse) and raises an `auto-close` event.

**Safety**

- A photocell true during closing immediately reopens the door and sets the obstruction flag.
- External writes to the obstruction GA keep the internal status aligned with dashboards.
- Movement pulses can drive ventilation, lighting or alarm routines.

#### Inputs

|Property|Description|
|--|--|
| `msg.payload` | Accepts `true`, `false`, `'open'`, `'close'` or `'toggle'` to control the door from the flow. |
| KNX telegrams | Reacts to the configured GAs (command, impulse, hold-open, disable, photocell, moving, obstruction). |

#### Flow example

```javascript

// Open the door
msg.payload = 'open'; // also accepts true
return msg;
```

```javascript
// Close the door
msg.payload = 'close'; // also accepts false
return msg;
```

```javascript
// Toggle the door state
msg.payload = 'toggle';
return msg;
```

#### Outputs

|Property|Description|
|--|--|
| Events (optional) | With *Emit events* enabled the node outputs objects containing `event`, `state`, `disabled`, `holdOpen` and `obstruction` so you can log or supervise the door. |

## Scene Controller

<p>The scene controllre node, behaves exactly as a scene controller KNX device. It's capable of saving and recalling a scene.</p>

### SCENE CONTROLLER NODE SETTINGS

| Property | Description |
| ------------ | ---------------------------------------------------------------------------------------------------- |
| Gateway | Selected KNX gateway. |
| Scene Recall | **Datapoint ** and**Trigger Value ** . Group Address for scene recall. Example 0/0/1. The scene controller will react to telegrams coming from this group address, to recall the scene. The datapoint is the datapoint type (DPT) of the _scene recall_ group address. The Trigger Value is the value that must be reveived, to trigger the scene recall.**Remember ** : to trigger a scene or save a scene via a DIM command, put in the scene recall or scene save**trigger value** , the correct object for dimming ({decr\_incr:1,data:5} for dim increase, {decr\_incr:0,data:5} for dim decrease) |
| Scene Save | **Datapoint ** and**Trigger Value ** . Group Address for saving a scene. Example 0/0/2. The scene controller will react to telegrams coming from this group address, by saving all the current values of all devices in the scene, that can be recalled later. Every time you press, or long press a real knx pushbutton in your building, the scene controller will read the values of all devices in the scene and save it in a non volatile storage. The datapoint is the datapoint type (DPT) of the _scene save_ group address. The Trigger Value is the value that must be reveived, to trigger the scene saving.**Remember ** : to trigger a scene or save a scene via a DIM command, put in the scene recall or scene save**trigger value** , the correct object for dimming ({decr\_incr:1,data:5} for dim increase, {decr\_incr:0,data:5} for dim decrease) |
| Node name | Node name, in the format "Recall: device name used to recall the scene / Save: device name for saving the scene". But you can set whatever name you want. |
| Topic | Node's topic. |

#### SCENE CONFIGURATION

You need to add devices to the scene, like a standard real scene controller knx device. This is a list, each row represents a device.

_ **The scene node automatically saves the updated values of all actuators belonging to the scene, whenever it receives a new value from the BUS.** _

| Property | Description |
| ------------- | ---------------------------------------------------------------------------------------------------- |
| ADD button | Add a row to the list. |
| Row's field | First field is the group address, second is the datapoint, third is the default value for this device in the scene (this can be overridden by the _scene save_ function). Below, is the device name.<br/> To insert a _pause_, type **wait ** in the first field and a number in the last field, that represents the time (in milliseconds) of the pause, for example**2000 ** <br/><br>The**wait ** command accept also values indicating seconds, minutes or hours.<br>To set a value in seconds, add**s ** after the numeric value, for example (**12s ** )<br>To set a value in minutes, add**m ** after the numeric value, for example (**5m ** )<br>To set a value in hours, add**h ** after the numeric value, for example (**1h** ) |
| Remove button | Remove a device from the list. |

### MESSAGE OUTPUT FROM THE SCENE CONTROLLER NODE

```javascript

msg = {
    topic: "Scene Controller" <i>(Contains the node's topic, for example "MyTopic").</i>
    recallscene: <i>(<b>true</b> if a scene has been recalled, otherwise <b>false</b>).</i> 
    savescene: <i>(<b>true</b> if a scene has been saved, otherwise <b>false</b>).</i> 
    savevalue: <i>(<b>true</b> if a group address value belonging to an actuator in the scene, has been manually saved by a msg input, otherwise <b>false</b>).</i> 
    disabled: <i>(<b>true</b> if the scene controller has been disabled via input message msg.disabled = true, otherwise <b>false</b>).</i> 
}

```

---

### INPUT FLOW MESSAGE

The Scene Controller node reacts primarly to KNX telegrams and rely to that to recall and save scenes.

You can, however, recall and save scenes by sending a msg to the node. The scene controller can be disabled to inhibite the commands coming from the KNX Bus.

**RECALL A SCENE**

```javascript

// Example of a function that recall the scene
msg.recallscene = true; 
return msg;

```

**SAVE A SCENE**

```javascript

// Example of a function that saves the scene
msg.savescene = true; 
return msg;

```

**SAVE CURRENT VALUE OF A GROUP ADDRESS ** _**The scene node already saves the updated values of all actuators belonging to the scene.** _

Sometimes it is useful to be able to save the current value of a group address that is different from the one entered in the scene, as the real value of the scene actuator.

For example, a shutter actuator usually has a command group address and a status one.

The node saves the scene by taking command group address values, which may not be aligned with the true state value.

However, you can work around this by manually updating the command group address value, taking it from the status group address.

Think this: if you have a blind actuator, having a group address for move, a group address for step, a group address for absolute height etc... the only group address knowing the exact position of the blind, is the **absolute height value status** group address. <br/>

With this status group address, you can update the command group addresses of the blind actuators belonging to the scene. Please see the sample in the wiki.

```javascript

// Example of a function that saves the status of a blind actuator, belongind to the scene.
msg.savevalue = true; 
msg.topic = "0/1/1";
msg.payload = 70;
return msg;

```

**DISABLE SCENE CONTROLLER**

You can disable the scene controller (it disables the reception of telegram from KNX BUS but the node still accept the input msg from the flow instead). Sometime is advisable to disable the recall and save of a scene, for example, when it's night and you call, from a KNX Pushbutton, a "TV Scene" that raises or lowers a blind, the scene won't be recalled or saved. Instead, you can enable another scene, just for night, for example to dim a series of lights.

```javascript

// Example of disabling the scene controller. The commands coming from KNX BUS will be disabled. The node still accept the input msg from the flow instead!
msg.disabled = true; // Otherwise "msg.disabled = false" to re-enable the node.
return msg;

```

## Load Control

### KNX LOAD CONTROL NODE

<p>With the Load Control node you can automatically manage the disconnection of loads (washing machine, oven, etc.) when the current consumption exceeds a certain threshold.  

The devices are turned off intelligently, checking the possible consumption of the device to determine whether to turn it off together with others. <br/>
The node can automatically reactivate the loads. <br/>
The node turns off one device (or multiple devices) at a time, based on the order you have selected.<br/>

**General**

|Property|Description|
|--|--|
| Gateway | KNX gateway. It is also possible not to select any gateway; in this case, only incoming messages to the node will be considered. |
| Mode | Select _Automatic (internal)_ to use Monitor W/threshold/timers. Select _Manual (msg.shedding)_ to disable the internal logic and use only `msg.shedding` commands (`shed`/`unshed`). |
| Monitor W | Group address representing the total consumption of your building. |
| Limit W | Maximum threshold that your electricity meter can withstand. When this threshold is exceeded, the node starts to turn off the devices. |
| Delay switch off (s) | Expressed in seconds, indicates how often the node will evaluate consumption and switch off each device. |
| Delay switch on (s) | Expressed in seconds, indicates how often the node will evaluate consumption and turn on each device that was turned off. |

<br/>

**LOAD CONTROL**

Here you can add devices to turn off in case of overload. <br/>
Choose the device to turn off. Enter the device name or its group address. <br/>
Enter any group address that indicates the consumption of the device chosen in the first line. **This is an optional parameter** . If the device is consuming more than a certain number of Watts, it means that it is in use. If it consumes less, the device will be considered "not in use" and both this and the next will be turned off at once.<br/>
If _Automatic recovery_ is enabled, the device is automatically reactivated when the "reset delay" expires.

#### Inputs

|Property|Description|
|--|--|
| `msg.readstatus = true` | Force the reading of the values from the KNX BUS of each device in the list. _ **The node already does everything by itself** _, but if necessary, it is possible to use this command to force a re-reading of the current values in watt.|
| `msg.enable = true` | Enable the load control.|
| `msg.disable = true` | Disable the load control.|
| `msg.reset = true` | Reset node states and turn all devices back on.|
| `msg.shedding` | String. In _Manual_ mode: `shed` switches off the next load, `unshed` restores the previous one. In _Automatic_ mode: `shed`/`unshed` forces the internal logic; `auto` restores normal monitoring. |

#### Outputs

1. Standard output
   : payload (string|object) : the standard output of the command.

#### Details

```javascript

msg = {
  "topic": "Home Total Consumption", // Node Name
  "operation": "Increase Shedding" or "Decrease Shedding" or operation reflecting the input message (disable, enable, reset), // Operation
  "device": "Washing machine", // Device shedded
  "ga": "", // Group address of the shedded device
  "totalPowerConsumption": 3100, // Current power consumption
  "wattLimit": 3000, // Limit you set in the config window
  "payload": 1, // Current shedding stage
}

```

## Home Assistant Translator

Converts Home Assistant state strings into boolean values. This function has one input and one output and requires no KNX gateway.

Choose the incoming message property to read, such as `payload` or `data.new_state.state`. Enter one translation per line, using `input:true` or `input:false`, for example `on:true` and `off:false`. Matching is case-insensitive. Keep the colon directly between the input and boolean value.

The output is a copy of the message with a boolean `msg.payload`; the other fields are preserved. Boolean and numeric inputs are also supported. Missing or unrecognized values produce no output and are reported in the node status. Conversion of a legacy Translator retains its input property and custom translation table.
