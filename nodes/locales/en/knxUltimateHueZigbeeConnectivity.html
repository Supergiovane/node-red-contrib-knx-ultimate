<p><strong>Deprecated:</strong> This dedicated HUE node remains available for existing flows. Use <strong>HUE Controller</strong> for new work. The legacy node is marked <code>(deprecated)</code> in the palette and on the canvas, uses a lighter color than HUE Controller, and its editor opens with a migration notice. The high-contrast orange migration button with white text converts all legacy HUE nodes locally; afterwards it opens only an editable email draft. The email is never sent automatically. When the process finishes, a fixed Node-RED message remains visible until you click OK and offers an optional support button; the donation page opens only when that button is clicked. <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">Watch the explanatory video on YouTube</a> before starting.</p>
<p>This node retrieves the Zigbee connectivity status from a Hue device and exposes it to KNX.</p>

Start typing the KNX device name or Group Address in the GA field; suggestions appear while you type.

**General**

|Property|Description|
|--|--|
| KNX GW | KNX gateway used to publish the status. |
| Hue Bridge | Hue Bridge to query. |
| Hue zigbee connectivity | Hue sensor/device providing the Zigbee connectivity info. Autocomplete while typing. |

**Mapping**

|Property|Description|
|--|--|
| Status | KNX Group Address that reflects Zigbee connectivity. Becomes _true_ when connected, otherwise _false_. |
| Read status at startup | Reads current status at editor start/reconnection and emits to KNX. Default: "yes”. |

### Outputs

1. Standard output
   : payload (boolean): connectivity state.

### Details

`msg.payload` carries the boolean state (true/false).\
`msg.status` contains a textual status: one of **connected, disconnected, connectivity\_issue, unidirectional\_incoming** .
