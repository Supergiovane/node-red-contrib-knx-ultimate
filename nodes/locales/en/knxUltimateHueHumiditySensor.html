<p><strong>Deprecated:</strong> This dedicated HUE node remains available for existing flows. Use <strong>HUE Controller</strong> for new work. The legacy node is marked <code>(deprecated)</code> in the palette and on the canvas, uses a lighter color than HUE Controller, and its editor opens with a migration notice. The high-contrast orange migration button with white text converts all legacy HUE nodes locally; afterwards it opens only an editable email draft. The email is never sent automatically. When the process finishes, a fixed Node-RED message remains visible until you click OK and offers an optional support button; the donation page opens only when that button is clicked. <a href="https://youtu.be/f0Evf2QFI7c" target="_blank" rel="noopener noreferrer">Watch the explanatory video on YouTube</a> before starting.</p>
<p>This node reads relative humidity (%) from a Hue humidity sensor and maps it to KNX.</p>

Start typing in the GA field (name or Group Address) to link the KNX GA; devices appear while you type.

**General**

|Property|Description|
|--|--|
| KNX GW | Select the KNX gateway to be used |
| Hue Bridge | Select the Hue Bridge to be used |
| Hue Sensor | Hue humidity sensor (autocomplete while typing) |
| Read status at startup | On startup/reconnect, read current value and send it to KNX (default: no) |

**Mapping**

|Property|Description|
|--|--|
| Humidity | KNX GA for relative humidity %. Recommended DPT: <b>9.007</b> |

### Outputs

1. Standard output
   : `msg.payload` (number): current relative humidity in %

### Details

`msg.payload` carries the numeric humidity value (percentage).
