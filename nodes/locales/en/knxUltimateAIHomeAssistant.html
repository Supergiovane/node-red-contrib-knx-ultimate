## KNX AI Home Assistant

This legacy AI node is kept only for existing version 7 flows.

### Upgrade to KNX Ultimate 8

The compact **Upgrade to v8** button at the top of the editor automates the package upgrade, but it deliberately stops before making changes when this node is present. Its AI configuration cannot be converted safely to Cerebrum Ultimate. Replace or remove the node manually, then run the upgrade again.

[Full upgrade guide](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/Upgrade-to-v8)
