<script type="text/markdown" data-help-name="knxUltimateHuedevice_software_update">
<p><strong>Obsolète :</strong> ce nœud HUE dédié reste disponible pour les flows existants. Utilisez <strong>HUE Controller</strong> pour les nouveaux projets. Le nœud legacy est marqué <code>(deprecated)</code> dans la palette et sur le canevas, utilise une couleur plus claire que HUE Controller et son éditeur affiche un avis de migration en haut. Le bouton de migration orange convertit localement tous les nœuds HUE legacy ; il ouvre ensuite un brouillon d’e-mail modifiable et la page de don dans une nouvelle fenêtre du navigateur. L’e-mail n’est jamais envoyé automatiquement. À la fin du processus, un message Node-RED fixe reste visible jusqu’à ce que vous cliquiez sur OK.</p>
<p> Ce nœud surveille si un périphérique Hue sélectionné a une mise à jour logicielle disponible et publie le statut de KNX. </p>

Commencez à taper le nom ou l'adresse de groupe de votre appareil KNX dans le champ GA, les périphériques AVAIable commencent à apparaître pendant que
vous tapez.

**Général**

| Propriété | Description |
|-|-|
|KNX GW |Sélectionnez la passerelle KNX à utiliser |
|Hue Bridge |Sélectionnez la Hue Bridge à utiliser |
|Dispositif |Appareil Hue pour surveiller les mises à jour logicielles (assortie automatique pendant la frappe). |

**Mappage**

|Propriété |Description |
|-|-|
|Statut |KNX GA reflétant l'état de mise à jour._True_ Si une mise à jour est disponible / prêt / en cours d'installation, sinon _false_.|
|Lire l'état au démarrage |Lisez l'état actuel au démarrage / reconnexion et émettez à KNX (par défaut "Oui").|

### sorties

1. Sortie standard
: charge utile (booléen): mettent à jour le drapeau.
: Status (String): l'un de **no \ _update, Update \ _Pending, Ready \ _To \ _install, installation** .
</script>
