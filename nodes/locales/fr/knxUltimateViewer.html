# KNX Viewer

KNX Viewer affiche les changements d’état des adresses de groupe (GA) dans un tableau simple, semblable à un moniteur ETS réduit à l’essentiel.

## Configuration

Sélectionnez la **passerelle KNX** et donnez un **nom** au nœud. Déployez le flow, puis rouvrez le nœud et cliquez sur **Ouvrir le moniteur KNX Viewer**. La page s’ouvre dans un nouvel onglet et utilise la même authentification et les mêmes droits de lecture que l’éditeur Node-RED.

## Moniteur web

Chaque ligne affiche l’heure, le type de télégramme (Read, Write, Response, etc.), l’adresse source, la GA, le nom, le DPT, la valeur précédente et la nouvelle valeur. Les entrées les plus récentes apparaissent en premier. Pour les télégrammes Write et Response, la première valeur observée pour une GA et les changements suivants sont enregistrés ; les valeurs inchangées n’ajoutent aucune ligne.

Les requêtes Read sont également enregistrées dans l’historique de 24 heures, sans valeur précédente ni nouvelle valeur. Elles ne modifient pas la dernière valeur connue de la GA.

Sélectionnez un Viewer, recherchez dans la liste ou parcourez les pages pour consulter les changements précédents. **Pause** fige l’affichage pour faciliter la lecture ; **Direct** reprend les mises à jour. L’enregistrement continue pendant la pause et lorsque la page du navigateur est fermée.

## Historique de 24 heures

Le nœud Viewer actif enregistre automatiquement l’historique dans des fichiers sous `userDir/knxultimatestorage/viewer`, séparément pour chaque Viewer et passerelle. Les changements datant de plus de 24 heures sont supprimés automatiquement. Après un redémarrage de Node-RED, le Viewer recharge l’historique encore compris dans cette période.

L’enregistrement commence lorsque le Viewer mis à jour est déployé et en fonctionnement. Il ne reconstitue pas le trafic antérieur du bus.

## Sorties du flow

Le nœud conserve ses trois sorties existantes :

1. **Valeurs actuelles des adresses de groupe** — `msg.payload` contient un tableau HTML pour un nœud Template du tableau de bord.
2. **Tableau des adresses de groupe** — `msg.payload` contient les données GA sous forme de tableau pour les traiter ou les enregistrer dans le flow.
3. **File de télégrammes** — `msg.payload` contient un tableau HTML de la file de transmission de la passerelle.

Le moniteur web peut être utilisé sans connecter ces sorties.
