## KNX AI Home Assistant

Cet ancien nœud AI est conservé uniquement pour les flux existants de la version 7.

### Mise à jour vers KNX Ultimate 8

Le petit bouton **Mettre à jour vers v8** en haut de l’éditeur automatise la mise à jour du package, mais s’arrête volontairement avant toute modification lorsque ce nœud est présent. Sa configuration AI ne peut pas être convertie de façon sûre vers Cerebrum Ultimate. Remplacez ou supprimez manuellement le nœud, puis relancez la mise à jour.

[Guide complet de mise à jour](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/fr-Upgrade-to-v8)
