Configuration de la passerelle KNX

<p> Ce nœud se connecte à votre passerelle KNX / IP. </p>

**Général**

| Propriété | Description |
|-|-|
| Nom | Nom du nœud. |
| Gateway | Adresse multidiffère du routeur ETH / KNX ou adresse IP unicast. Si vous avez une interface KNX / IP, utilisez l'adresse IP de l'interface, par exemple 1982.168.1.22, sinon, si vous avez un routeur KNX / IP, mettez l'adresse de multidiffusion 224.0.23.12. Vous pouvez également taper un **nom d'hôte** au lieu d'une IP. |

<br/>

**Configuration**

| Propriété | Description |
|-|-|
| Port | Le port. La valeur par défaut est 3671. |
| Protocole de connexion | _Tunnel UDP_ est pour les interfaces KNX / IP, _Multicast UDP_ est pour les routeurs KNX / IP. Laissez **Auto** pour la détection automatique. La valeur par défaut est "Auto". |
| Mode Serial FT1.2 | Définit comment l’interface série FT1.2 est initialisée : **KBerry/BAOS** active la séquence spécifique pour les modules Weinzierl KBerry/BAOS (reset, mode Link Layer/BAOS, aucun filtre de GA), tandis que **Standard FT1.2** utilise un adaptateur FT1.2 générique sans étapes spécifiques à KBerry. La valeur par défaut est KBerry/BAOS. |
| KNX-Adresse | L'adresse physique KNX, exemple 1.1.200. La valeur par défaut est "15.15.22". |
| An lokale Netzwerk-Schnittstelle binden | Le nœud utilisera cette interface locale pour les communications. Laissez "Auto" pour la sélection automatique. Si vous avez plus d'une connexion LAN, par exemple Ethernet et WiFi, il est fortement recommandé de sélectionner manuellement l'interface, sinon tout le télégramme UDP n'atteindra pas votre ordinateur, donc le nœud peut ne pas fonctionner comme prévu. La valeur par défaut est "Auto". |
| Beim Start automatisch mit dem KNX BUS verbinden | Connectez-vous automatiquement au bus au départ. La valeur par défaut est "oui". |
| Quelle pour Secure-Zugangsdaten | Choisissez comment les données sécurisées KNX sont fournies: **ETS Fichier de clés ** (Données Secure Keys - et les informations d'identification de tunneling si elles sont présentes - proviennent de la clés),**Indementiels manuels ** (Seul KNX IP Tunneling Secure avec un utilisateur saisi manuellement), ou**Keyring + mot de passe du tunnel manuel** Utilisateur manuel). N'oubliez pas que les télégrammes Secure Data KNX nécessitent toujours un fichier de clés. |
| Individuelle Adresse der Tunnel-Schnittstelle | Visible chaque fois que le mode sélectionné comprend des informations d'identification manuelles (manuel ou clés + mot de passe du tunnel manuel). Adresse individuelle KNX facultative pour l'interface du tunnel sécurisé (par exemple `1.1.1`); Laissez vide pour laisser KNX Ultimate le négocier automatiquement. |
| Tunnel-Benutzer-ID | Visible lorsque des références manuelles sont utilisées. Identificateur d'utilisateur de tunnel Secure KNX en option défini dans ETS. |
| Tunnel-Benutzerpasswort | Visible lorsque des références manuelles sont utilisées. Mot de passe de l'utilisateur de tunneling Secure KNX configuré dans ETS. |

> **KNX Secure Essentials** \
> • _KNX Data Secure_ protège les télégrammes d'adresses de groupe et **toujours** a besoin d'un fichier de clés contenant les touches de groupe. \
> • _KNX IP Tunneling Secure_ protège la poignée de main de connexion avec un mot de passe de mise en service. Selon le mode sélectionné, le mot de passe peut provenir du clés ou être entré manuellement.\
> • KNX/IP Secure (handshake du tunnel) ne s’applique qu’aux transports IP (Tunnel TCP / routage sécurisé). KNX Data Secure protège les télégrammes d’adresses de groupe et peut être utilisé à la fois sur IP (tunneling/routage) et sur TP via Serial FT1.2 lorsqu’un fichier keyring ETS est fourni.

<br/>

**Avancé**

| Propriété | Description |
|-|-|
| Supprimez les télégrammes répétés (R-FLAG) FOM BUS | Ignorez des télégrammes KNX répétés provenant du bus. La valeur par défaut n'est pas contrôlée. |
| Supprimer la demande d'ACK sur le bus | ACK du bus. Si coché, les télégrammes envoyés au bus KNX (Tunnel UDP, Multicast et Serial FT1.2) ne demandent plus d'acquittement aux appareils qui les reçoivent. Avec Tunnel UDP et « Attendre l'ACK du tunnelling » sur Automatique, le nœud cesse aussi d'attendre la confirmation de l'interface. Activez-le seulement si votre interface l'exige, par exemple certaines interfaces KNX/IP anciennes ou Weinzierl, eibPORT et Loxone. Par défaut : décoché. |
| Attendre l'ACK du tunnelling (Tunnel UDP) | ACK de l'interface. Avec Tunnel UDP, le nœud attend que l'interface KNX/IP confirme chaque télégramme : un télégramme non confirmé est envoyé une fois de plus, puis la connexion est fermée et rouverte. Automatique n'attend que si « Supprimer la demande d'ACK sur le bus » est décoché, comme dans les versions précédentes. Oui attend toujours, Non jamais. Les passerelles eibPORT et Loxone nécessitent « Supprimer la demande d'ACK sur le bus » coché avec Oui. |
| Activer le plugin flow bubbles | Affiche une petite bulle colorée à côté de chaque nœud KNX Device dans l'éditeur. La bulle reflète le dernier état en direct reçu depuis le gateway et s'atténue lorsque les données deviennent obsolètes. Utile pendant la mise en service et le débogage. Valeur par défaut : désactivé. |
| Retard entre chaque télégramme (en millisecondes) | KNX Specs indique que la vitesse d'envoi de télégramme maximum est de 50 télégrammes par seconde. Une vitesse comprise entre 25 et 50 ms devrait être bien, sauf si vous vous connectez à une passerelle KNX distante via une connexion Internet lente (dans ce cas, vous devez augmenter la valeur, par exemple, 200 à 500 ms ou plus). |
| Temporisation de l'état du nœud | Définissez la fréquence de mise à jour des badges de statut. Avec un délai actif, les changements intermédiaires sont ignorés et seul le dernier est affiché après l'intervalle choisi. Sélectionnez **Immédiat** pour conserver le comportement en temps réel. |
| Format date/heure du statut | Choisissez comment l’horodatage est affiché dans le badge de statut (utile quand le locale du système ne peut pas être configuré). |
| Format personnalisé | Utilisé quand **Personnalisé (jetons)** est sélectionné. Jetons : `YYYY`, `YY`, `MMM`, `MM`, `DD`, `HH`, `mm`, `ss`, `A`, `a`, `Z`. Utilisez `[texte]` pour les littéraux. |
| Paramètre régional (remplacer) | Locale optionnel (BCP47), par ex. `fr-FR` ou `en-GB`. Utilisé pour les noms de mois (`MMM`) avec un format personnalisé. |

<br/>

**ETS Importation du fichier**

| Propriété | Description |
|-|-|
| Si l'adresse du groupe n'a pas de point de données | Si une adresse de groupe n'a pas de point de données, elle permet de choisir pour arrêter l'importation, importer Quth un faux point de données de 1,001 ou pour ignorer l'importation de cette adresse de groupe |
| Liste d'adresses du groupe ETS | Utilisez cette section pour importer votre fichier ETS CSV ou ESF. Vous pouvez soit **coller le contenu du fichier CSV ou ESF ** ou**définir le chemin du fichier** , par exemple _./pi/homecsv.csv_. Veuillez vous référer aux liens d'aide pour d'autres Infos. |

<br/>

**Contrôle du cache fichiers**

|Propriété|Description|
|--|--|
| Loglevel | Niveau de journalisation, utile pour le débogage. La valeur par défaut est "Error". Le journal n'est pas concerné par la gestion de l'usure du disque. |
| Gestion de l'usure du disque | Définit la fréquence à laquelle KNX Ultimate écrit ses fichiers sur le disque : valeurs des GA, scènes du Scene Controller, valeurs de l'AutoResponder, fichier du Logger et historique du Viewer. Utile pour réduire l'usure des cartes SD. Les fichiers ne sont écrits que si leur contenu a changé. **Priorité à la fraîcheur** (par défaut) enregistre les modifications toutes les 5 secondes. **Équilibré** les enregistre uniquement à la connexion ou à la déconnexion de la passerelle, ainsi qu'à l'arrêt de Node-RED ou au redéploiement de la passerelle. **Désactiver l'écriture** n'écrit jamais sur le disque : les données restent uniquement en mémoire et, à chaque redémarrage de Node-RED, toutes les valeurs actuelles des GA et les données enregistrées par les nœuds KNX Ultimate sont perdues. **Intervalle personnalisé** enregistre les modifications à l'intervalle choisi, de 5 secondes à 30 jours, ainsi qu'à l'arrêt de Node-RED ou au redéploiement de la passerelle. |
| Intervalle d'écriture | Visible avec **Intervalle personnalisé**. Valeur et unité (secondes, minutes, heures, jours) de l'intervalle d'écriture. |

> Lorsque l'écriture est désactivée, les nœuds KNX Ultimate qui utilisent des fichiers (Device avec lecture initiale depuis un fichier, Scene Controller, AutoResponder, Logger avec enregistrement dans un fichier, Viewer) affichent un rappel dans leur éditeur.

<br/>

# Travailler avec le fichier ETS CSV ou ESF

Au lieu de créer un nœud KNX-ultime pour chaque adresse de groupe à contrôler, vous pouvez importer votre fichier d'adresses de groupe CSV ETS ou, à partir de V 1.1.35, un fichier ESF également (si, par exemple, vous n'avez qu'ETS à l'intérieur). Versions ETS prises en charge: ETS 4 et à partir. <br/>

À partir de la version 1.4.18, vous pouvez également entrer simplement le chemin d'accès au fichier dans ce champ (par exemple: /home/pi/mycsv.csv). <br/>

Grâce à cela, le nœud KNX-ultime où vous avez sélectionné **Mode universel (écoutez toutes les adresses de groupe)** , devient un nœud d'entrée / sortie universel, conscient de tous les points de données, des adresses de groupe et du nom de l'appareil (ex: lampe de salon). Envoyez simplement la charge utile au nœud KNX-ultime, et il le codera avec le bon point de données et l'enverra dans le bus. De même, lorsque le nœud KNX-ultime reçoit un télégramme du bus, il offre une charge utile décodée droite à l'aide du point de données spécifié dans le fichier ETS CSV ou ESF.

À partir de **version 1.1.11 ** , vous pouvez utiliser**Mode universel (écoutez toutes les adresses de groupe) ** Option sans avoir besoin d'un fichier ETS CSV ou ESF importé. Vous devez transmettre un message au nœud, contenant le type de point de données et une valeur. Dès que le nœud reçoit un télégramme de KNX Bus, il sortira une valeur brute et à côté, il essaiera de décoder la valeur sans connaître le type de point de données. <Br />**Remarque** : _ETS Adresse du groupe CSV Fichier exporté_ est la meilleure option, car il contient des points de données précis avec sous-type. _ETS ESF Exporté File_ est plus simple et il n'a pas le sous-type. <Br />

Si vous pouvez utiliser les deux, veuillez préférer le fichier exporté de l'adresse du groupe CSV * ***, car l'ESF peut conduire à une fausse valeur de sortie. Veuillez vérifier manuellement et éventuellement ajuster les points de données chaque fois que vous importez le fichier** ESF**. <Br /> à partir de la version 1.4.1 Vous pouvez également importer des adresses de groupe également à l'exécution, via MSG, en utilisant le nœud de surveillance. <br />

> Vous pouvez travailler avec un mélange de nœuds KNX-ultime, certains avec le mode ** Universal (écoutez toutes les adresses de groupe)** Vérifié et d'autres non. Vous êtes absolument libre!

>
> ** Format de sortie** : CSV <Br />
>
> ** Format CSV** : 1/1 nom / adresse <br />
>
> ** Exportation avec ligne d'en-tête** : vérifié <br />
>
> ** CSV Séparateur** : Tabulator. <br />
>
> Collez ensuite le contenu du fichier ici. <br />
>
> Notez que le fichier ETS CSV doit contenir les points de données pour chaque adresse de groupe. <br />
>
> Le nœud analyse votre fichier CSV ETS avant de l'utiliser et vous indiquera les résultats dans l'onglet de débogage de la page Node-Red. <br />
>
> Le résultat peut être de deux types: ** Erreur ** et**avertissement** <br />
>
> ** L'erreur** se produit lorsqu'un point de données n'est pas spécifié pour une adresse de groupe. Il s'agit d'une erreur critique et arrête le processus d'importation du fichier ETS CSV. <br />
>
> ** L'avertissement** se produit lorsque le sous-type d'un Datapoint n'est pas spécifié. Dans ce cas, l'analyseur de nœud y ajoutera un par défaut, mais vous avertit que vous montrez et corrigez le point de données, en ajoutant un sous-type. Un sous-type est le nombre restant à droite du "." dans un point de données (ex: 5.001). <Br />
>
> Remarque: les champs doivent être entourés de ** "** par exemple: <br />

>> "ACTUATEURS LIGHTS" "0 / - / -" "" "" "" "" "" Car "<br/> ** Comment exporter les ETS -> ESF <- Liste des adresses de groupe**

> Sur la fenêtre ETS, sélectionnez votre projet, puis cliquez sur l'icône d'exportation (l'icône avec la flèche vers le haut) <br />
>
> Sélectionnez pour exporter le projet au format ESF (pas le .knxprod par défaut) <br />
>
> Copiez ensuite le contenu du fichier et collez-le dans le champ de la liste d'adresses de groupe de passerelle "ETS".
