<script type="text/markdown" data-help-name="knxUltimateHueLightSensor">
<p><strong>Veraltet:</strong> Dieser dedizierte HUE-Knoten bleibt für bestehende Flows verfügbar. Verwenden Sie <strong>HUE Controller</strong> für neue Projekte. Der Legacy-Knoten ist in der Palette und auf der Arbeitsfläche mit <code>(deprecated)</code> gekennzeichnet, verwendet eine hellere Farbe als HUE Controller und sein Editor zeigt oben einen Migrationshinweis. Der orange Migrationsbutton konvertiert alle Legacy-HUE-Knoten lokal; anschließend öffnet er einen bearbeitbaren E-Mail-Entwurf und die Spendenseite in einem neuen Browserfenster. Die E-Mail wird niemals automatisch gesendet. Nach Abschluss des Vorgangs bleibt eine feste Node-RED-Meldung sichtbar, bis Sie auf OK klicken.</p>
<p>Dieser Node liest Lux-Ereignisse eines HUE-Lichtsensors und spiegelt sie nach KNX.</p>

Es wird die Umgebungshelligkeit (Lux) bei Änderungen ausgegeben. Im GA-Feld den KNX-Gerätenamen oder die GA eingeben (Autocomplete), um die GA zu verknüpfen.

**Allgemein**

| Eigenschaft | Beschreibung |
|-|-|
|KNX-Gateway |Wählen Sie das zu verwendende KNX -Gateway |
|Hue Bridge |Wählen Sie die zu verwendende Hue Bridge aus |
| Hue Lichtsensor | Zu verwendender HUE-Lichtsensor (Autocomplete) |
|Status bei Startup lesen |Lesen Sie den Status beim Start und geben Sie das Ereignis bei Startup/Wiederverbindung an den KNX -Bus aus.(Standard "nein") |

**Zuordnung**

| Eigenschaft | Beschreibung |
|--|--|
| Lux | KNX-GA, die den Lux-Wert erhält |

### Ausgänge

1. Standardausgang
   : payload (number): aktueller Lux-Wert

### Details

`msg.payload` enthält den numerischen Lux-Wert.
</script>
