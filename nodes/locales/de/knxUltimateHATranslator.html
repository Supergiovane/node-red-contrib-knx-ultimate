### Upgrade auf KNX Ultimate 8

Version 7 zeigt oben in diesem Editor eine kleine Schaltfläche **Auf v8 aktualisieren**. Sie lädt eine Flow-Sicherung herunter, installiert die benötigten HUE-/Matter-Pakete, konvertiert kompatible Knoten, führt ein vollständiges Deploy aus, prüft die gespeicherten Flows und installiert Version 8. Starten Sie den Node-RED-Dienst anschließend wie aufgefordert neu; nur den Browser neu zu laden genügt nicht. Bisherige KNX-AI-Knoten stoppen den automatischen Vorgang.

[Vollständige Upgrade-Anleitung](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/de-Upgrade-to-v8)

<br/>

**Veraltet:** Dieser eigenständige Knoten wird für bestehende Flows weiterhin unterstützt. Verwenden Sie für neue Flows **KNX Utility** und wählen Sie die entsprechende Funktion. Der bisherige Knoten ist in der Palette ausgeblendet und im Flow mit `(deprecated)` gekennzeichnet. Sein Editor bietet eine Schaltfläche, um alle kompatiblen bisherigen KNX-Hilfsknoten in sämtlichen Flows und Subflows nach Bestätigung zu konvertieren. Die Konvertierung erfolgt lokal im Browser, erhält IDs, Einstellungen, Verbindungen und Gruppen und unterstützt Rückgängig. Die Bestätigung schließt den aktuellen Knoten-Editor und verwirft nicht gespeicherte Änderungen. Prüfen Sie das Ergebnis vor Deploy.

<p> Dieser Knoten übersetzt das Eingabe -MSG in gültige wahre/falsche Werte. <p>

Es kann eine Eingangsnutzlast auf einen wahren /falschen booleschen Werte umsetzen. <br />
Jede Zeile im Textfeld repräsentiert einen Übersetzungsbefehl.<br/>
Sie können Ihre eigene Übersetzungsreihe hinzufügen. <br/>

| Eigenschaft | Beschreibung |
|-|-|
|Name |Der Knotenname.|
|Eingabe |Die Eingabe -MSG -Eigenschaft, die bewertet und übersetzt werden soll.|
|Übersetzen |Fügen Sie Ihren eigenen Übersetzungsbefehl hinzu, löschen oder bearbeiten Sie.Der Übersetzungsbefehl der Zeile muss \*\* Eingangszeichenfolge aus HA: KNX -Wert \*\* (_KNX -Wer&#x74;_&#x61;ls wahr oder falsch) sein.Zum Beispiel: <Code> Öffnen: True </code> <code> geschlossen: false </code>.|
