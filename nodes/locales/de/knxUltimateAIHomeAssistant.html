## KNX AI Home Assistant

Dieser bisherige AI-Knoten bleibt nur für vorhandene Flows der Version 7 erhalten.

### Upgrade auf KNX Ultimate 8

Die kleine Schaltfläche **Auf v8 aktualisieren** oben im Editor automatisiert das Paket-Upgrade, stoppt jedoch absichtlich vor jeder Änderung, wenn dieser Knoten vorhanden ist. Seine AI-Konfiguration kann nicht sicher in Cerebrum Ultimate konvertiert werden. Ersetzen oder entfernen Sie den Knoten manuell und starten Sie das Upgrade danach erneut.

[Vollständige Upgrade-Anleitung](https://supergiovane.github.io/node-red-contrib-knx-ultimate/wiki/de-Upgrade-to-v8)
