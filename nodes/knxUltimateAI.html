<script type="text/javascript">
    RED.nodes.registerType('knxUltimateAI', {
        category: "KNX Ultimate AI",
        color: '#FF9800',
        defaults: {
            server: { type: "knxUltimate-config", required: true },
            name: { value: "KNX AI", required: false },
            topic: { value: "", required: false },

            llmEnabled: { value: false },
            llmProvider: { value: "openai_compat" },
            llmBaseUrl: { value: "https://api.openai.com/v1/chat/completions" },
            llmModel: { value: "gpt-5.4" },
            llmContextLength: { value: 0 },
            llmAllowKnxCommands: { value: false },
            llmRequireCommandConfirmation: { value: true },
            chatAdapterPreset: { value: "none" },
            chatInputCode: { value: "" },
            chatOutputCode: { value: "" },
            ttsUltimateNodeId: { value: "" },
            aiEducation: { value: "" }
        },
        credentials: {
            llmApiKey: { type: "password" }
        },
        inputs: 1,
        outputs: 4,
        outputLabels: function (i) {
            switch (i) {
                case 0: return this._('knxUltimateAI.outputs.summary');
                case 1: return this._('knxUltimateAI.outputs.anomalies');
                case 2: return this._('knxUltimateAI.outputs.assistant');
                case 3: return this._('knxUltimateAI.outputs.knxCommands');
            }
        },
        icon: "node-eye-icon.svg",
        label: function () {
            return (this.name || "KNX AI");
        },
        paletteLabel: "KNX AI",
        oneditprepare: function () {
            try { RED.sidebar.show("help"); } catch (error) { }
            const node = this;
            const OPENAI_COMPAT_DEFAULT_CHAT_URL = "https://api.openai.com/v1/chat/completions";
            const OLLAMA_DEFAULT_CHAT_URL = "http://localhost:11434/api/chat";
            const ANTHROPIC_DEFAULT_CHAT_URL = "https://api.anthropic.com/v1/messages";
            const LMSTUDIO_DEFAULT_CHAT_URL = "http://localhost:1234/v1/chat/completions";
            const OLLAMA_LIBRARY_URL = "https://ollama.com/library";
            const OPENAI_COMPAT_DEFAULT_MODELS = ["gpt-5.4", "gpt-4o-mini"];
            const OLLAMA_DEFAULT_MODEL = "llama3.1";
            const ANTHROPIC_DEFAULT_MODEL = "claude-opus-4-8";

            const mountTabSection = (mountSelector, sectionSelector) => {
                const $mount = $(mountSelector);
                const $section = $(sectionSelector);
                if ($mount.length && $section.length) $mount.append($section);
            };
            mountTabSection("#knx-ai-mount-assistant-setup", "#knx-ai-tab-llm-connection");
            mountTabSection("#knx-ai-mount-assistant-advanced", "#knx-ai-tab-advanced");
            mountTabSection("#knx-ai-mount-chat-adapter", "#knx-ai-tab-chat-adapter");
            mountTabSection("#knx-ai-mount-home-intelligence", "#knx-ai-tab-home-intelligence");
            $("#knx-ai-tabs").tabs({ active: 0 });

            const toggleLLM = () => {
                const enabled = $("#node-input-llmEnabled").is(":checked");
                $("#knx-ai-llm-connection-settings").toggle(enabled);
                $("#knx-ai-llm-advanced-settings").toggle(enabled);
            };
            $("#node-input-llmEnabled").on("change", toggleLLM);

            const toggleCommandConfirmation = () => {
                const enabled = $("#node-input-llmAllowKnxCommands").is(":checked");
                $("#knx-ai-command-confirmation-row").toggle(enabled);
            };
            $("#node-input-llmAllowKnxCommands").on("change", toggleCommandConfirmation);

            toggleLLM();
            toggleCommandConfirmation();

            const nodeId = node.id;
            const resolveAdminRoot = () => {
                const raw = (RED.settings && typeof RED.settings.httpAdminRoot === "string") ? RED.settings.httpAdminRoot : "/";
                const trimmed = String(raw || "/").trim();
                if (trimmed === "" || trimmed === "/") return "";
                return "/" + trimmed.replace(/^\/+|\/+$/g, "");
            };
            const resolveAccessToken = () => {
                try {
                    const tokens = (RED.settings && typeof RED.settings.get === "function") ? RED.settings.get("auth-tokens") : null;
                    const token = tokens && typeof tokens.access_token === "string" ? tokens.access_token.trim() : "";
                    return token;
                } catch (error) {
                    return "";
                }
            };
            const t = (key, fallback) => {
                const value = RED._(key);
                if (!value || value === key) return fallback || "";
                return value;
            };

            const applyChatEditorOptions = (editor) => {
                try {
                    if (!editor) return;
                    if (typeof editor.updateOptions === "function") {
                        editor.updateOptions({
                            lineNumbers: "off",
                            minimap: { enabled: false },
                            scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 }
                        });
                    } else if (editor.renderer && typeof editor.renderer.setShowGutter === "function") {
                        editor.renderer.setShowGutter(false);
                    }
                    if (typeof editor.setShowPrintMargin === "function") editor.setShowPrintMargin(false);
                    if (typeof editor.setOptions === "function") {
                        editor.setOptions({
                            enableBasicAutocompletion: true,
                            enableLiveAutocompletion: true
                        });
                    }
                } catch (error) { }
            };
            const setChatEditorValue = (editor, value) => {
                try {
                    if (!editor) return;
                    if (typeof editor.setValue === "function") {
                        editor.setValue(String(value || ""));
                    } else if (editor.session && typeof editor.session.setValue === "function") {
                        editor.session.setValue(String(value || ""));
                    }
                } catch (error) { }
            };
            const destroyChatEditors = () => {
                ["chatInputCodeEditor", "chatOutputCodeEditor"].forEach(function (key) {
                    try {
                        if (node[key] && typeof node[key].destroy === "function") node[key].destroy();
                    } catch (error) { }
                    delete node[key];
                });
            };

            try {
                node.chatInputCodeEditor = RED.editor.createEditor({
                    id: "node-input-chatInputCode-editor",
                    mode: "ace/mode/nrjavascript",
                    value: node.chatInputCode || ""
                });
            } catch (error) { }
            try {
                node.chatOutputCodeEditor = RED.editor.createEditor({
                    id: "node-input-chatOutputCode-editor",
                    mode: "ace/mode/nrjavascript",
                    value: node.chatOutputCode || ""
                });
            } catch (error) { }
            applyChatEditorOptions(node.chatInputCodeEditor);
            applyChatEditorOptions(node.chatOutputCodeEditor);
            if (typeof monaco !== "undefined") {
                try {
                    const globalScope = typeof window !== "undefined" ? window : globalThis;
                    if (!globalScope._knxAiChatEditorThemesDefined) {
                        monaco.editor.defineTheme("knx-ai-chat-input-theme", {
                            base: "vs",
                            inherit: true,
                            rules: [],
                            colors: {
                                "editor.background": "#e8f5e9",
                                "editorGutter.background": "#e8f5e9"
                            }
                        });
                        monaco.editor.defineTheme("knx-ai-chat-output-theme", {
                            base: "vs",
                            inherit: true,
                            rules: [],
                            colors: {
                                "editor.background": "#fffde7",
                                "editorGutter.background": "#fffde7"
                            }
                        });
                        globalScope._knxAiChatEditorThemesDefined = true;
                    }
                    if (node.chatInputCodeEditor && typeof node.chatInputCodeEditor.updateOptions === "function") {
                        node.chatInputCodeEditor.updateOptions({ theme: "knx-ai-chat-input-theme" });
                    }
                    if (node.chatOutputCodeEditor && typeof node.chatOutputCodeEditor.updateOptions === "function") {
                        node.chatOutputCodeEditor.updateOptions({ theme: "knx-ai-chat-output-theme" });
                    }
                } catch (error) { }
            }
            node._destroyKnxAiChatEditors = destroyChatEditors;

            const configureChatAdapterPicker = () => {
                const adapters = Array.isArray(window.KNXAIChatAdapterMappings)
                    ? window.KNXAIChatAdapterMappings.slice()
                    : [];
                const $picker = $("#node-input-chatAdapterPreset");
                if (!$picker.length) return;
                const hideAdapterMappingFields = () => {
                    $("#knx-ai-chat-adapter-fields").hide();
                };
                $picker.empty();
                $("<option></option>")
                    .attr("value", "none")
                    .text(t("knxUltimateAI.selectlists.chatAdapter.none", "No adapter"))
                    .appendTo($picker);
                adapters.forEach(function (adapter) {
                    if (!adapter || !adapter.id) return;
                    $("<option></option>")
                        .attr("value", adapter.id)
                        .text(adapter.title || adapter.id)
                        .appendTo($picker);
                });

                const configuredPreset = String(this.chatAdapterPreset || "none");
                if (configuredPreset !== "none" && !adapters.some(adapter => adapter && adapter.id === configuredPreset)) {
                    $("<option></option>")
                        .attr("value", configuredPreset)
                        .text(configuredPreset)
                        .appendTo($picker);
                }
                $picker.val(configuredPreset);
                hideAdapterMappingFields();
                $picker.on("change", function () {
                    const selected = String($(this).val() || "none");
                    if (selected === "none") {
                        setChatEditorValue(node.chatInputCodeEditor, "");
                        setChatEditorValue(node.chatOutputCodeEditor, "");
                        hideAdapterMappingFields();
                        return;
                    }
                    const adapter = adapters.find(item => item && item.id === selected);
                    if (!adapter) return;
                    setChatEditorValue(node.chatInputCodeEditor, adapter.inputCode || "");
                    setChatEditorValue(node.chatOutputCodeEditor, adapter.outputCode || "");
                    hideAdapterMappingFields();
                });
            };
            configureChatAdapterPicker.call(node);

            const collectEditorTtsUltimateNodes = () => {
                const tabById = new Map();
                const entries = [];
                try {
                    RED.nodes.eachNode(function (candidate) {
                        if (!candidate || String(candidate.type || "") !== "tab") return;
                        tabById.set(String(candidate.id || ""), String(candidate.label || candidate.name || ""));
                    });
                    RED.nodes.eachNode(function (candidate) {
                        if (!candidate || String(candidate.type || "") !== "ttsultimate") return;
                        const id = String(candidate.id || "").trim();
                        if (!id) return;
                        entries.push({
                            id: id,
                            name: String(candidate.name || "TTS Ultimate"),
                            flowId: String(candidate.z || ""),
                            flowName: tabById.get(String(candidate.z || "")) || "",
                            playerType: String(candidate.playertype || "sonos")
                        });
                    });
                } catch (error) { }
                return entries;
            };

            const populateTtsUltimatePicker = (runtimeSummary) => {
                const $pickerContainer = $("#knx-ai-tts-ultimate-picker");
                const $picker = $("#node-input-ttsUltimateNodeId");
                if (!$picker.length) return;
                const byId = new Map();
                const runtimeNodes = runtimeSummary && Array.isArray(runtimeSummary.nodes) ? runtimeSummary.nodes : [];
                runtimeNodes.forEach(function (item) {
                    if (item && item.id) byId.set(String(item.id), item);
                });
                collectEditorTtsUltimateNodes().forEach(function (item) {
                    byId.set(String(item.id), item);
                });
                const entries = Array.from(byId.values()).sort(function (left, right) {
                    return String((left.flowName || "") + "\u0000" + (left.name || "") + "\u0000" + left.id)
                        .localeCompare(String((right.flowName || "") + "\u0000" + (right.name || "") + "\u0000" + right.id));
                });
                const configuredId = String(node.ttsUltimateNodeId || "").trim();
                $picker.empty();
                $("<option></option>")
                    .attr("value", "")
                    .text(entries.length
                        ? t("knxUltimateAI.selectlists.ttsUltimate.select", "Select a TTS Ultimate node")
                        : t("knxUltimateAI.selectlists.ttsUltimate.none", "No TTS Ultimate node found"))
                    .appendTo($picker);
                entries.forEach(function (item) {
                    const flowName = String(item.flowName || t("knxUltimateAI.messages.ttsUltimateUnknownFlow", "Flow without name"));
                    const playerType = String(item.playerType || "sonos");
                    $("<option></option>")
                        .attr("value", item.id)
                        .text(flowName + " · " + String(item.name || "TTS Ultimate") + " · " + playerType)
                        .appendTo($picker);
                });
                if (configuredId && !byId.has(configuredId)) {
                    $("<option></option>")
                        .attr("value", configuredId)
                        .text(t("knxUltimateAI.messages.ttsUltimateUnavailable", "Unavailable TTS Ultimate node") + " · " + configuredId)
                        .appendTo($picker);
                }
                if (configuredId) {
                    $picker.val(configuredId);
                } else if (entries.length === 1) {
                    $picker.val(entries[0].id);
                } else {
                    $picker.val("");
                }
                const detected = entries.length > 0 || !!(runtimeSummary && runtimeSummary.detected);
                $picker.prop("disabled", entries.length === 0 && !configuredId);
                $pickerContainer.toggle(detected || !!configuredId);
            };
            populateTtsUltimatePicker(null);

            const renderDetectedAdapters = (adapters) => {
                const $list = $("#knx-ai-detected-adapters-list");
                const $status = $("#knx-ai-detected-adapters-status");
                if (!$list.length) return;
                $list.empty();
                const entries = Array.isArray(adapters) ? adapters : [];
                if (!entries.length) {
                    $status.text(t("knxUltimateAI.messages.detectedAdaptersNone", "No automatic adapter detected.")).show();
                    return;
                }
                $status.hide();
                entries.forEach(function (adapter) {
                    if (!adapter || !adapter.id) return;
                    const providerCount = Number(adapter.providerCount) || 0;
                    const cameraCount = Number(adapter.cameraCount) || 0;
                    const nodeCount = Number(adapter.nodeCount) || 0;
                    const $row = $("<div></div>").addClass("knx-ai-detected-adapter");
                    const $main = $("<div></div>").addClass("knx-ai-detected-adapter-main");
                    $("<div></div>").text(adapter.title || adapter.id).appendTo($main);
                    if (adapter.packageName) {
                        $("<div></div>").addClass("knx-ai-detected-adapter-package").text(adapter.packageName).appendTo($main);
                    }
                    $("<div></div>")
                        .addClass("knx-ai-detected-adapter-counts")
                        .text(adapter.kind === "tts"
                            ? t("knxUltimateAI.messages.detectedAdapterNodes", "Nodes") + ": " + nodeCount
                            : t("knxUltimateAI.messages.detectedAdapterControllers", "Controllers") + ": " + providerCount + " · " + t("knxUltimateAI.messages.detectedAdapterCameras", "Cameras") + ": " + cameraCount)
                        .appendTo($main);
                    $main.appendTo($row);
                    $("<span></span>")
                        .addClass("knx-ai-detected-adapter-badge")
                        .text(t("knxUltimateAI.messages.detectedAdapterDetected", "Detected"))
                        .appendTo($row);
                    $row.appendTo($list);
                });
            };

            const renderChatContextOverview = (overview) => {
                const $status = $("#knx-ai-chat-context-status");
                const $content = $("#knx-ai-chat-context-content");
                const $sources = $("#knx-ai-chat-context-sources-list").empty();
                const $files = $("#knx-ai-chat-context-files-list").empty();
                const $directories = $("#knx-ai-chat-context-directories-list").empty();
                if (!overview || typeof overview !== "object") {
                    $content.hide();
                    $status
                        .text(t("knxUltimateAI.messages.chatContextUnavailable", "The chat context summary is temporarily unavailable."))
                        .show();
                    return;
                }

                const addRow = function ($list, title, description, pathText, badge) {
                    const $row = $("<div></div>").addClass("knx-ai-detected-adapter");
                    const $main = $("<div></div>").addClass("knx-ai-detected-adapter-main");
                    $("<div></div>").text(title || "").appendTo($main);
                    if (description) {
                        $("<div></div>").addClass("knx-ai-chat-context-description").text(description).appendTo($main);
                    }
                    if (pathText) {
                        $("<div></div>").addClass("knx-ai-chat-context-path").text(pathText).appendTo($main);
                    }
                    $main.appendTo($row);
                    $("<span></span>").addClass("knx-ai-detected-adapter-badge").text(badge).appendTo($row);
                    $row.appendTo($list);
                };

                const sourceLabels = {
                    knxTraffic: t("knxUltimateAI.messages.chatContextSourceKnxTraffic", "Live KNX summary, anomalies, topology and selected telegrams."),
                    etsProject: t("knxUltimateAI.messages.chatContextSourceEtsProject", "ETS semantics and the full Node-RED project inventory."),
                    memoryEducation: t("knxUltimateAI.messages.chatContextSourceMemoryEducation", "Session context, AI Education and bounded home memory."),
                    camerasDocs: t("knxUltimateAI.messages.chatContextSourceCamerasDocs", "Detected cameras and relevant help, README and example snippets."),
                    ttsUltimate: t("knxUltimateAI.messages.chatContextSourceTtsUltimate", "Selected TTS Ultimate announcement target.")
                };
                (Array.isArray(overview.sources) ? overview.sources : []).forEach(function (sourceId) {
                    addRow(
                        $sources,
                        sourceLabels[sourceId] || String(sourceId),
                        "",
                        "",
                        t("knxUltimateAI.messages.chatContextSourceBadge", "Source")
                    );
                });

                const fileDescriptions = {
                    chatContext: t("knxUltimateAI.messages.chatContextFileChatContext", "Persistent conversation turns, instructions and camera notification rules."),
                    homeMemory: t("knxUltimateAI.messages.chatContextFileHomeMemory", "AI Education and bounded learned home memory."),
                    assistantConfig: t("knxUltimateAI.messages.chatContextFileAssistantConfig", "Persistent web Assistant configuration and semantic areas for this node.")
                };
                (Array.isArray(overview.files) ? overview.files : []).forEach(function (item) {
                    if (!item || !item.name || !item.path) return;
                    addRow(
                        $files,
                        item.name,
                        fileDescriptions[item.id] || "",
                        item.path,
                        t("knxUltimateAI.messages.chatContextFileBadge", "File")
                    );
                });

                const directoryLabels = {
                    archiveRoot: t("knxUltimateAI.messages.chatContextDirectoryRoot", "Telegram archive root"),
                    nodeArchive: t("knxUltimateAI.messages.chatContextDirectoryNode", "This node's telegram archive")
                };
                (Array.isArray(overview.telegramDirectories) ? overview.telegramDirectories : []).forEach(function (item) {
                    if (!item || !item.path) return;
                    addRow(
                        $directories,
                        directoryLabels[item.id] || String(item.id || ""),
                        "",
                        item.path,
                        t("knxUltimateAI.messages.chatContextDirectoryBadge", "KNX")
                    );
                });

                $("#knx-ai-chat-context-pattern")
                    .text(t("knxUltimateAI.messages.chatContextTelegramPattern", "Daily files") + ": " + String(overview.telegramFilePattern || "YYYY-MM-DD.jsonl"));
                $status.hide();
                $content.show();
            };
            $.ajax({
                url: "knxUltimateAI/adapters",
                type: "GET",
                data: nodeId ? { nodeId: nodeId } : {}
            })
                .done(function (data) {
                    renderDetectedAdapters(data && data.adapters);
                    populateTtsUltimatePicker(data && data.ttsUltimate);
                    renderChatContextOverview(data && data.chatContext);
                })
                .fail(function () {
                    $("#knx-ai-detected-adapters-status")
                        .text(t("knxUltimateAI.messages.detectedAdaptersUnavailable", "Automatic adapter detection is temporarily unavailable."))
                        .show();
                    renderChatContextOverview(null);
                });

            $("#knx-ai-open-web-page-vue").on("click", function (evt) {
                evt.preventDefault();
                const adminRoot = resolveAdminRoot();
                const targetBase = adminRoot + "/knxUltimateAI/sidebar/page";
                const params = new URLSearchParams();
                if (nodeId) params.set("nodeId", nodeId);
                const accessToken = resolveAccessToken();
                if (accessToken) params.set("access_token", accessToken);
                const target = targetBase + (params.toString() ? ("?" + params.toString()) : "");
                const wnd = window.open(target, "_blank", "noopener,noreferrer");
                try { if (wnd && typeof wnd.focus === "function") wnd.focus(); } catch (e) { }
            });

            const setRefreshModelsBusy = (busy) => {
                const $button = $("#knx-ai-refreshModels");
                $button.prop("disabled", !!busy);
                $button.find("i.fa-refresh").toggleClass("fa-spin", !!busy);
            };

            const setOllamaInstallUiState = (busy) => {
                $("#knx-ai-installOllamaModel").prop("disabled", !!busy);
                $("#knx-ai-downloadOllamaModel").prop("disabled", !!busy);
            };

            let localModelDetailsById = new Map();
            let localContextRequestVersion = 0;

            const formatContextTokens = (value) => {
                const tokens = Math.max(0, Number(value) || 0);
                return tokens ? tokens.toLocaleString() : "?";
            };

            const setLocalModelContextStatus = (detail, state, errorText) => {
                const $status = $("#knx-ai-local-context-status");
                const provider = $("#node-input-llmProvider").val();
                if (!$status.length || (provider !== "lmstudio" && provider !== "ollama") || !detail) {
                    $status.hide();
                    return;
                }
                const maxTokens = formatContextTokens(detail.maxContextLength);
                const loadedTokens = formatContextTokens(detail.loadedContextLength);
                let text = t("knxUltimateAI.messages.lmStudioContextAvailable", "Maximum model context") + ": " + maxTokens + " token";
                let color = "#555";
                if (state === "loading") {
                    text = t("knxUltimateAI.messages.lmStudioContextLoading", "Loading the model with its maximum context") + ": " + maxTokens + " token…";
                    color = "#1565c0";
                } else if (state === "configured") {
                    const configuredTokens = formatContextTokens(detail.configuredContextLength || detail.loadedContextLength || detail.maxContextLength);
                    text = t("knxUltimateAI.messages.lmStudioContextConfigured", "Maximum model context configured") + ": " + configuredTokens + " token";
                    color = "#2e7d32";
                } else if (state === "error") {
                    text = String(errorText || t("knxUltimateAI.messages.lmStudioContextFailed", "Unable to configure the model context"));
                    color = "#c62828";
                } else if (detail.loadedContextLength > 0) {
                    text += " · " + t("knxUltimateAI.messages.lmStudioContextCurrentlyLoaded", "currently loaded") + ": " + loadedTokens + " token";
                }
                $status.text(text).css("color", color).show();
            };

            const populateModels = (models, modelDetails) => {
                const $dl = $("#knx-ai-llmModels");
                if (!$dl || $dl.length === 0) return;
                localModelDetailsById = new Map();
                (modelDetails || []).forEach(function (detail) {
                    if (detail && detail.id) localModelDetailsById.set(String(detail.id), detail);
                });
                $dl.empty();
                (models || []).forEach(function (m) {
                    const detail = localModelDetailsById.get(String(m));
                    const label = detail
                        ? String(detail.displayName || detail.id) + " · " + formatContextTokens(detail.maxContextLength) + " token"
                        : String(m);
                    $("<option>").attr("value", m).attr("label", label).appendTo($dl);
                });
            };

            const normalizeUrl = (value) => String(value || "").trim().replace(/\/+$/, "").toLowerCase();
            const isOpenAiDefaultUrl = (value) => normalizeUrl(value) === normalizeUrl(OPENAI_COMPAT_DEFAULT_CHAT_URL);
            const isOllamaDefaultUrl = (value) => normalizeUrl(value) === normalizeUrl(OLLAMA_DEFAULT_CHAT_URL);
            const isOpenAiDefaultModel = (value) => OPENAI_COMPAT_DEFAULT_MODELS.indexOf(String(value || "").trim().toLowerCase()) >= 0;
            const DEFAULT_CHAT_URLS = [OPENAI_COMPAT_DEFAULT_CHAT_URL, OLLAMA_DEFAULT_CHAT_URL, ANTHROPIC_DEFAULT_CHAT_URL, LMSTUDIO_DEFAULT_CHAT_URL];
            const DEFAULT_MODELS = OPENAI_COMPAT_DEFAULT_MODELS.concat([OLLAMA_DEFAULT_MODEL, ANTHROPIC_DEFAULT_MODEL]);
            const isAnyDefaultUrl = (value) => DEFAULT_CHAT_URLS.some((u) => normalizeUrl(u) === normalizeUrl(value));
            const isAnyDefaultModel = (value) => DEFAULT_MODELS.indexOf(String(value || "").trim().toLowerCase()) >= 0;

            const applyProviderDefaults = (provider) => {
                const $baseUrl = $("#node-input-llmBaseUrl");
                const $model = $("#node-input-llmModel");
                const currentBaseUrl = String($baseUrl.val() || "").trim();
                const currentModel = String($model.val() || "").trim();

                const urlByProvider = { ollama: OLLAMA_DEFAULT_CHAT_URL, anthropic: ANTHROPIC_DEFAULT_CHAT_URL, lmstudio: LMSTUDIO_DEFAULT_CHAT_URL, openai_compat: OPENAI_COMPAT_DEFAULT_CHAT_URL };
                const modelByProvider = { ollama: OLLAMA_DEFAULT_MODEL, anthropic: ANTHROPIC_DEFAULT_MODEL, lmstudio: "", openai_compat: OPENAI_COMPAT_DEFAULT_MODELS[0] };
                const targetUrl = urlByProvider[provider] || OPENAI_COMPAT_DEFAULT_CHAT_URL;
                const targetModel = Object.prototype.hasOwnProperty.call(modelByProvider, provider)
                    ? modelByProvider[provider]
                    : OPENAI_COMPAT_DEFAULT_MODELS[0];

                // Only overwrite when the field is empty or still holds another provider's default,
                // so a user's custom base URL / model is never clobbered when switching providers.
                if (!currentBaseUrl || isAnyDefaultUrl(currentBaseUrl)) $baseUrl.val(targetUrl);
                if (!currentModel || isAnyDefaultModel(currentModel)) $model.val(targetModel);
            };

            const configureSelectedLocalModel = () => {
                const provider = $("#node-input-llmProvider").val();
                if (provider !== "lmstudio" && provider !== "ollama") return;
                const model = String($("#node-input-llmModel").val() || "").trim();
                const detail = localModelDetailsById.get(model);
                if (!detail || !(Number(detail.maxContextLength) > 0)) {
                    $("#node-input-llmContextLength").val(0);
                    setLocalModelContextStatus(null);
                    return;
                }

                const requestVersion = ++localContextRequestVersion;
                $("#node-input-llmContextLength").val(Number(detail.maxContextLength));
                if (provider === "ollama") {
                    detail.configuredContextLength = Number(detail.maxContextLength);
                    setLocalModelContextStatus(detail, "configured");
                    return;
                }

                setLocalModelContextStatus(detail, "loading");
                $("#node-input-llmModel").prop("disabled", true);
                $("#knx-ai-refreshModels").prop("disabled", true);

                const payload = {
                    nodeId: nodeId,
                    baseUrl: $("#node-input-llmBaseUrl").val() || LMSTUDIO_DEFAULT_CHAT_URL,
                    model: model
                };
                const apiKey = $("#node-input-llmApiKey").val() || "";
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                $.ajax({
                    url: "knxUltimateAI/lmstudio/select-model",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        if (requestVersion !== localContextRequestVersion) return;
                        detail.loadedContextLength = Math.max(0, Number(data && data.contextLength) || Number(detail.maxContextLength));
                        detail.configuredContextLength = detail.loadedContextLength;
                        $("#node-input-llmContextLength").val(detail.loadedContextLength);
                        setLocalModelContextStatus(detail, "configured");
                    })
                    .fail(function (xhr) {
                        if (requestVersion !== localContextRequestVersion) return;
                        let errorText = t("knxUltimateAI.messages.lmStudioContextFailed", "Unable to configure the model context");
                        try {
                            if (xhr && xhr.responseJSON && xhr.responseJSON.error) errorText = xhr.responseJSON.error;
                        } catch (e) { }
                        setLocalModelContextStatus(detail, "error", errorText);
                        try { RED.notify(errorText, "error"); } catch (e) { }
                    })
                    .always(function () {
                        if (requestVersion !== localContextRequestVersion) return;
                        $("#node-input-llmModel").prop("disabled", false);
                        $("#knx-ai-refreshModels").prop("disabled", false);
                    });
            };

            const refreshModels = () => {
                const provider = $("#node-input-llmProvider").val();
                const baseUrl = $("#node-input-llmBaseUrl").val() || "";
                const apiKey = $("#node-input-llmApiKey").val() || "";
                const payload = { nodeId: nodeId, provider: provider, baseUrl: baseUrl };
                if (provider === "ollama") payload.autoStart = true;
                // Node-RED uses "__PWRD__" as placeholder for stored credentials: don't send it.
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                setRefreshModelsBusy(true);

                $.ajax({
                    url: "knxUltimateAI/models",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        const models = (data && data.models) ? data.models : [];
                        populateModels(models, data && data.modelDetails);
                        let selectedAutomatically = false;
                        if (provider === "lmstudio" && models.length > 0 && !String($("#node-input-llmModel").val() || "").trim()) {
                            $("#node-input-llmModel").val(models[0]);
                            selectedAutomatically = true;
                        }
                        if (provider === "lmstudio" || provider === "ollama") {
                            const selectedDetail = localModelDetailsById.get(String($("#node-input-llmModel").val() || ""));
                            if (selectedDetail) {
                                setLocalModelContextStatus(selectedDetail);
                                configureSelectedLocalModel();
                            } else if (selectedAutomatically) {
                                configureSelectedLocalModel();
                            }
                        }
                        if (provider === "ollama" && data && data.ollamaStarted) {
                            try {
                                const startedMsg = t('knxUltimateAI.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            } catch (e) { }
                        }
                        if (provider === "ollama" && models.length === 0) {
                            const msg = t('knxUltimateAI.messages.ollamaNoModels', "No local Ollama model found. Install one from https://ollama.com/library.");
                            try { RED.notify(msg, "warning"); } catch (e) { }
                        }
                    })
                    .fail(function (xhr) {
                        let err = "Failed to load models";
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                    })
                    .always(function () {
                        setRefreshModelsBusy(false);
                    });
            };

            const installOllamaModel = () => {
                const provider = $("#node-input-llmProvider").val();
                if (provider !== "ollama") return;
                const baseUrl = $("#node-input-llmBaseUrl").val() || "";
                const model = String($("#node-input-llmModel").val() || "").trim() || OLLAMA_DEFAULT_MODEL;
                const payload = { nodeId: nodeId, baseUrl: baseUrl, model: model };

                $("#knx-ai-refreshModels").prop("disabled", true);
                setOllamaInstallUiState(true);

                $.ajax({
                    url: "knxUltimateAI/ollama/pull",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        try {
                            const okMsg = t('knxUltimateAI.messages.installedOllamaModel', "Ollama model installed") + ": " + model;
                            RED.notify(okMsg, "success");
                            if (data && data.ollamaStarted) {
                                const startedMsg = t('knxUltimateAI.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            }
                        } catch (e) { }
                        refreshModels();
                    })
                    .fail(function (xhr) {
                        let err = t('knxUltimateAI.messages.installOllamaModelFailed', "Failed to install Ollama model");
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                        $("#knx-ai-refreshModels").prop("disabled", false);
                    })
                    .always(function () {
                        setOllamaInstallUiState(false);
                    });
            };

            const openOllamaLibrary = () => {
                const wnd = window.open(OLLAMA_LIBRARY_URL, "_blank", "noopener,noreferrer");
                try { if (wnd && typeof wnd.focus === "function") wnd.focus(); } catch (e) { }
            };

            const toggleProvider = ({ applyDefaults = false, autoLoadModels = false } = {}) => {
                const provider = $("#node-input-llmProvider").val();
                if (applyDefaults) applyProviderDefaults(provider);
                if (provider === "ollama") {
                    $("#knx-ai-apikey-row").hide();
                    $("#knx-ai-ollama-install-row").show();
                    if (autoLoadModels) refreshModels();
                } else {
                    $("#knx-ai-apikey-row").show();
                    $("#knx-ai-ollama-install-row").hide();
                    if (provider === "lmstudio" && autoLoadModels) refreshModels();
                    if (provider !== "lmstudio") {
                        $("#node-input-llmContextLength").val(0);
                        if (provider !== "ollama") $("#knx-ai-local-context-status").hide();
                    }
                }
            };
            $("#node-input-llmProvider").on("change", function () {
                toggleProvider({ applyDefaults: true, autoLoadModels: true });
            });
            toggleProvider({ applyDefaults: true });

            $("#knx-ai-refreshModels").on("click", function (evt) {
                evt.preventDefault();
                refreshModels();
            });
            $("#node-input-llmModel").on("change", function () {
                configureSelectedLocalModel();
            });
            $("#knx-ai-downloadOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                openOllamaLibrary();
            });
            $("#knx-ai-installOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                installOllamaModel();
            });
        },
        oneditsave: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.getValue === "function") {
                    this.chatInputCode = this.chatInputCodeEditor.getValue();
                    $("#node-input-chatInputCode").val(this.chatInputCode);
                }
            } catch (error) { }
            try {
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.getValue === "function") {
                    this.chatOutputCode = this.chatOutputCodeEditor.getValue();
                    $("#node-input-chatOutputCode").val(this.chatOutputCode);
                }
            } catch (error) { }
            try {
                if (typeof this._destroyKnxAiChatEditors === "function") this._destroyKnxAiChatEditors();
            } catch (error) { }
            delete this._destroyKnxAiChatEditors;
        },
        oneditcancel: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            try {
                if (typeof this._destroyKnxAiChatEditors === "function") this._destroyKnxAiChatEditors();
            } catch (error) { }
            delete this._destroyKnxAiChatEditors;
        },
        oneditresize: function () {
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.resize === "function") this.chatInputCodeEditor.resize();
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.resize === "function") this.chatOutputCodeEditor.resize();
            } catch (error) { }
        }
    })
</script>

<script type="text/html" data-template-name="knxUltimateAI">
  <div class="form-row" style="margin-bottom:10px;">
    <span style="color:#ff0000"><i class="fa fa-youtube"></i></span>&nbsp;<a target="_blank" href="https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E"><b>KNX-Ultimate video tutorials (YouTube playlist)</b></a>
  </div>
    <b><span data-i18n="knxUltimateAI.title"></span></b>&nbsp&nbsp<span style="color:#ff9800" &nbsp &nbsp <i class="fa fa-youtube"></i></span><a
        target="_blank" href="https://www.youtube.com/watch?v=qw7kjQ_mvdg&t=10s">See sample video</a>
      <br /><br />
    <div class="form-row">
        
        <label for="node-input-server"><i class="fa fa-tag"></i> <span data-i18n="knxUltimateAI.properties.server"></span></label>
        <input type="text" id="node-input-server">
    </div>

    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="knxUltimateAI.properties.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]knxUltimateAI.properties.name" style="flex:1 1 240px; min-width:240px; max-width:240px;">
    </div>

    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tasks"></i> <span data-i18n="knxUltimateAI.properties.topic"></span></label>
        <input type="text" id="node-input-topic" data-i18n="[placeholder]knxUltimateAI.properties.topic">
    </div>
    <div class="form-row">
        <label><i class="fa fa-external-link"></i> Web UI</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="red-ui-button" id="knx-ai-open-web-page-vue" style="background-color:#ff9800; border-color:#ff9800; color:#ffffff !important; -webkit-text-fill-color:#ffffff;">
                <i class="fa fa-external-link" style="color:#ffffff !important;"></i> <span style="color:#ffffff !important;">Open KNX AI Web Page</span>
            </button>
        </div>
    </div>

    <div id="knx-ai-tabs">
        <ul>
            <li><a href="#knx-ai-tabs-assistant"><i class="fa fa-magic"></i> <span data-i18n="knxUltimateAI.sections.groupAssistant"></span></a></li>
            <li><a href="#knx-ai-tabs-chat-home"><i class="fa fa-comments"></i> <span data-i18n="knxUltimateAI.sections.groupChatHome"></span></a></li>
        </ul>
        <div id="knx-ai-tabs-assistant">
            <div class="knx-ai-accordion-subsection">
                <h4><i class="fa fa-cog"></i> <span data-i18n="knxUltimateAI.sections.quickSetup"></span></h4>
                <div class="knx-ai-accordion-mount" id="knx-ai-mount-assistant-setup"></div>
            </div>
            <div class="knx-ai-accordion-subsection">
                <h4><i class="fa fa-sliders"></i> <span data-i18n="knxUltimateAI.sections.advanced"></span></h4>
                <div class="knx-ai-accordion-mount" id="knx-ai-mount-assistant-advanced"></div>
            </div>
        </div>

        <div id="knx-ai-tabs-chat-home">
            <div class="knx-ai-accordion-subsection">
                <h4><i class="fa fa-plug"></i> <span data-i18n="knxUltimateAI.sections.chatAdapter"></span></h4>
                <div class="knx-ai-accordion-mount" id="knx-ai-mount-chat-adapter"></div>
            </div>
            <div class="knx-ai-accordion-subsection">
                <h4><i class="fa fa-home"></i> <span data-i18n="knxUltimateAI.sections.homeIntelligence"></span></h4>
                <div class="knx-ai-accordion-mount" id="knx-ai-mount-home-intelligence"></div>
            </div>
            <div id="knx-ai-detected-adapters-panel">
                <h4><i class="fa fa-puzzle-piece"></i> <span data-i18n="knxUltimateAI.sections.detectedAdapters"></span></h4>
                <div id="knx-ai-detected-adapters-status" data-i18n="knxUltimateAI.messages.detectedAdaptersLoading"></div>
                <div id="knx-ai-detected-adapters-list"></div>
                <div id="knx-ai-tts-ultimate-picker" style="display:none;">
                    <label for="node-input-ttsUltimateNodeId"><i class="fa fa-volume-up"></i> <span data-i18n="knxUltimateAI.properties.ttsUltimateNodeId"></span></label>
                    <select id="node-input-ttsUltimateNodeId"></select>
                    <div class="knx-ai-tts-ultimate-hint" data-i18n="knxUltimateAI.messages.ttsUltimateHint"></div>
                </div>
            </div>
            <div id="knx-ai-chat-context-panel">
                <h4><i class="fa fa-database"></i> <span data-i18n="knxUltimateAI.sections.chatContextOverview"></span></h4>
                <div id="knx-ai-chat-context-status" data-i18n="knxUltimateAI.messages.chatContextLoading"></div>
                <div id="knx-ai-chat-context-content" style="display:none;">
                    <div class="knx-ai-chat-context-intro" data-i18n="knxUltimateAI.messages.chatContextIntro"></div>
                    <div class="knx-ai-chat-context-group-title" data-i18n="knxUltimateAI.messages.chatContextSourcesTitle"></div>
                    <div id="knx-ai-chat-context-sources-list"></div>
                    <div class="knx-ai-chat-context-group-title" data-i18n="knxUltimateAI.messages.chatContextFilesTitle"></div>
                    <div id="knx-ai-chat-context-files-list"></div>
                    <div class="knx-ai-chat-context-group-title" data-i18n="knxUltimateAI.messages.chatContextDirectoriesTitle"></div>
                    <div id="knx-ai-chat-context-directories-list"></div>
                    <div id="knx-ai-chat-context-pattern" class="knx-ai-chat-context-pattern"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="knx-ai-accordion-source" style="display:none;">

        <div id="knx-ai-tab-llm-connection">
            <div class="form-row">
                <input type="checkbox" id="node-input-llmEnabled" style="display:inline-block; width:auto; vertical-align:top;">
                <label style="width:auto" for="node-input-llmEnabled">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmEnabled"></span></label>
            </div>

            <div id="knx-ai-llm-connection-settings">
                <div class="form-row">
                    <label style="width:290px" for="node-input-llmProvider"><i class="fa fa-cog"></i> <span data-i18n="knxUltimateAI.properties.llmProvider"></span></label>
                    <select style="width:100%" id="node-input-llmProvider">
                        <option value="openai_compat" data-i18n="knxUltimateAI.selectlists.llmProvider.openai_compat"></option>
                        <option value="anthropic" data-i18n="knxUltimateAI.selectlists.llmProvider.anthropic"></option>
                        <option value="ollama" data-i18n="knxUltimateAI.selectlists.llmProvider.ollama"></option>
                        <option value="lmstudio" data-i18n="knxUltimateAI.selectlists.llmProvider.lmstudio"></option>
                    </select>
                </div>
                <div class="form-row" id="knx-ai-apikey-row">
                    <label style="width:290px" for="node-input-llmApiKey"><i class="fa fa-key"></i> <span data-i18n="knxUltimateAI.properties.llmApiKey"></span></label>
                    <input type="password" id="node-input-llmApiKey" data-i18n="[placeholder]knxUltimateAI.placeholder.llmApiKey">
                </div>

                <div class="form-row">
                    <label style="width:290px" for="node-input-llmModel"><i class="fa fa-cube"></i> <span data-i18n="knxUltimateAI.properties.llmModel"></span></label>
                    <input style="width:calc(100% - 110px)" type="text" id="node-input-llmModel" list="knx-ai-llmModels" data-i18n="[placeholder]knxUltimateAI.placeholder.llmModel">
                    <button type="button" class="red-ui-button" id="knx-ai-refreshModels" style="margin-left:6px;" title="Refresh models">
                        <i class="fa fa-refresh"></i> <span data-i18n="knxUltimateAI.buttons.refreshModels"></span>
                    </button>
                </div>
                <datalist id="knx-ai-llmModels"></datalist>
                <input type="hidden" id="node-input-llmContextLength">
                <div id="knx-ai-local-context-status" style="display:none; margin:-8px 0 12px 290px; font-size:12px;"></div>
                <div class="form-row">
                    <input type="checkbox" id="node-input-llmAllowKnxCommands" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmAllowKnxCommands">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmAllowKnxCommands"></span></label>
                </div>
                <div class="form-row" id="knx-ai-command-confirmation-row">
                    <input type="checkbox" id="node-input-llmRequireCommandConfirmation" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmRequireCommandConfirmation">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmRequireCommandConfirmation"></span></label>
                </div>
            </div>
        </div>

        <div id="knx-ai-tab-chat-adapter">
            <div class="form-row">
                <label style="width:290px" for="node-input-chatAdapterPreset"><i class="fa fa-plug"></i> <span data-i18n="knxUltimateAI.properties.chatAdapterPreset"></span></label>
                <select style="width:100%" id="node-input-chatAdapterPreset">
                    <option value="none" data-i18n="knxUltimateAI.selectlists.chatAdapter.none"></option>
                </select>
            </div>
            <div id="knx-ai-chat-adapter-fields" style="display:none;">
                <div class="form-row">
                    <label style="width:100%" for="node-input-chatInputCode"><i class="fa fa-sign-in"></i> <span data-i18n="knxUltimateAI.properties.chatInputCode"></span></label>
                    <input type="hidden" id="node-input-chatInputCode">
                    <div id="node-input-chatInputCode-editor" class="node-text-editor knx-ai-chat-adapter-editor"></div>
                </div>
                <div class="form-row">
                    <label style="width:100%" for="node-input-chatOutputCode"><i class="fa fa-sign-out"></i> <span data-i18n="knxUltimateAI.properties.chatOutputCode"></span></label>
                    <input type="hidden" id="node-input-chatOutputCode">
                    <div id="node-input-chatOutputCode-editor" class="node-text-editor knx-ai-chat-adapter-editor"></div>
                </div>
            </div>
        </div>

        <div id="knx-ai-tab-home-intelligence">
            <div class="form-row">
                <label style="width:100%" for="node-input-aiEducation"><i class="fa fa-graduation-cap"></i> <span data-i18n="knxUltimateAI.properties.aiEducation"></span></label>
                <textarea id="node-input-aiEducation" maxlength="16000" style="width:100%; min-height:180px; box-sizing:border-box;" data-i18n="[placeholder]knxUltimateAI.placeholder.aiEducation"></textarea>
            </div>
        </div>

        <div id="knx-ai-tab-advanced">
            <div id="knx-ai-llm-advanced-settings">
                <div class="form-row">
                    <label style="width:290px" for="node-input-llmBaseUrl"><i class="fa fa-link"></i> <span data-i18n="knxUltimateAI.properties.llmBaseUrl"></span></label>
                    <input type="text" id="node-input-llmBaseUrl" data-i18n="[placeholder]knxUltimateAI.placeholder.llmBaseUrl">
                </div>
                <div class="form-row" id="knx-ai-ollama-install-row" style="display:none;">
                    <label style="width:290px"><i class="fa fa-download"></i> Ollama</label>
                    <div class="knx-ai-ollama-actions">
                        <button type="button" class="red-ui-button" id="knx-ai-downloadOllamaModel">
                            <i class="fa fa-cloud-download"></i> <span data-i18n="knxUltimateAI.buttons.downloadOllamaModel"></span>
                        </button>
                        <button type="button" class="red-ui-button" id="knx-ai-installOllamaModel">
                            <i class="fa fa-download"></i> <span data-i18n="knxUltimateAI.buttons.installOllamaModel"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
