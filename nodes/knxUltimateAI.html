<script type="text/javascript">
    RED.nodes.registerType('knxUltimateAI', {
        category: "KNX Ultimate (legacy)",
        color: '#FF9800',
        defaults: {
            server: { type: "knxUltimate-config", required: true },
            name: { value: "Legacy AI node", required: false },
            topic: { value: "", required: false },

            llmEnabled: { value: false },
            llmProvider: { value: "openai_compat" },
            llmBaseUrl: { value: "https://api.openai.com/v1/chat/completions" },
            llmModel: { value: "gpt-5.4" },
            llmReasoningEffort: { value: "default" },
            llmContextLength: { value: 0 },
            llmLocalContextTokens: { value: 0 },
            llmAllowKnxCommands: { value: false },
            llmRequireCommandConfirmation: { value: true },
            etsExposedGAs: { value: [] },
            etsReadOnlyGAs: { value: [] },
            etsExposeConfigured: { value: false },
            webAccessEnabled: { value: true },
            webMaxCallsPerHour: { value: 40 },
            chatAdapterPreset: { value: "none" },
            chatInputCode: { value: "" },
            chatOutputCode: { value: "" },
            aiEducation: { value: "" }
        },
        credentials: {
            llmApiKey: { type: "password" }
        },
        inputs: 1,
        outputs: 5,
        outputLabels: function (i) {
            switch (i) {
                case 0: return this._('knxUltimateAI.outputs.summary');
                case 1: return this._('knxUltimateAI.outputs.anomalies');
                case 2: return this._('knxUltimateAI.outputs.assistant');
                case 3: return this._('knxUltimateAI.outputs.knxCommands');
                case 4: return this._('knxUltimateAI.outputs.ttsUltimate');
            }
        },
        icon: "node-eye-icon.svg",
        label: function () {
            return (this.name || "Legacy AI node");
        },
        paletteLabel: "Legacy AI node",
        oneditprepare: function () {
            try { RED.sidebar.show("help"); } catch (error) { }
            const node = this;
            const OPENAI_COMPAT_DEFAULT_CHAT_URL = "https://api.openai.com/v1/chat/completions";
            const OLLAMA_DEFAULT_CHAT_URL = "http://localhost:11434/api/chat";
            const ANTHROPIC_DEFAULT_CHAT_URL = "https://api.anthropic.com/v1/messages";
            const LMSTUDIO_DEFAULT_CHAT_URL = "http://localhost:1234/v1/chat/completions";
            const OLLAMA_LIBRARY_URL = "https://ollama.com/library";
            const OPENAI_COMPAT_DEFAULT_MODELS = ["gpt-5.4", "gpt-4o-mini"];
            const OLLAMA_DEFAULT_MODEL = "llama3.1";
            const ANTHROPIC_DEFAULT_MODEL = "claude-opus-4-8";

            const mountTabSection = (mountSelector, sectionSelector) => {
                const $mount = $(mountSelector);
                const $section = $(sectionSelector);
                if ($mount.length && $section.length) $mount.append($section);
            };
            mountTabSection("#knx-ai-mount-assistant-setup", "#knx-ai-tab-llm-connection");
            mountTabSection("#knx-ai-mount-ets-access", "#knx-ai-tab-ets-access");
            mountTabSection("#knx-ai-mount-assistant-advanced", "#knx-ai-tab-advanced");
            mountTabSection("#knx-ai-mount-chat-adapter", "#knx-ai-tab-chat-adapter");
            mountTabSection("#knx-ai-mount-home-intelligence", "#knx-ai-tab-home-intelligence");
            $("#knx-ai-tabs").tabs({ active: 0 });

            const toggleLLM = () => {
                const enabled = $("#node-input-llmEnabled").is(":checked");
                $("#knx-ai-llm-connection-settings").toggle(enabled);
                $("#knx-ai-llm-advanced-settings").toggle(enabled);
            };
            $("#node-input-llmEnabled").on("change", toggleLLM);

            const toggleCommandConfirmation = () => {
                const enabled = $("#node-input-llmAllowKnxCommands").is(":checked");
                $("#knx-ai-command-confirmation-row").toggle(enabled);
            };
            $("#node-input-llmAllowKnxCommands").on("change", toggleCommandConfirmation);

            toggleLLM();
            toggleCommandConfirmation();

            const nodeId = node.id;
            const resolveAdminRoot = () => {
                const raw = (RED.settings && typeof RED.settings.httpAdminRoot === "string") ? RED.settings.httpAdminRoot : "/";
                const trimmed = String(raw || "/").trim();
                if (trimmed === "" || trimmed === "/") return "";
                return "/" + trimmed.replace(/^\/+|\/+$/g, "");
            };
            const resolveAccessToken = () => {
                try {
                    const tokens = (RED.settings && typeof RED.settings.get === "function") ? RED.settings.get("auth-tokens") : null;
                    const token = tokens && typeof tokens.access_token === "string" ? tokens.access_token.trim() : "";
                    return token;
                } catch (error) {
                    return "";
                }
            };
            const t = (key, fallback) => {
                const value = RED._(key);
                if (!value || value === key) return fallback || "";
                return value;
            };

            // Same ETS access selector used by the MQTT profile of IoT Bridge.
            try {
                const savedSet = new Set(Array.isArray(node.etsExposedGAs) ? node.etsExposedGAs : []);
                const readOnlySet = new Set(Array.isArray(node.etsReadOnlyGAs) ? node.etsReadOnlyGAs : []);
                const exposeConfigured = node.etsExposeConfigured === true;

                const updateEtsCount = () => {
                    const total = $("#knx-ai-ets-ga-list input.knx-ai-ets-ga-cb").length;
                    const selected = $("#knx-ai-ets-ga-list input.knx-ai-ets-ga-cb:checked").length;
                    $("#knx-ai-ets-ga-count").text(selected + " / " + total + " " + t("knxUltimateAI.messages.etsSelected", "selected"));
                };

                const buildEtsGaList = () => {
                    const list = $("#knx-ai-ets-ga-list").empty();
                    const serverId = String($("#node-input-server").val() || "").trim();
                    if (!serverId) {
                        list.append($("<div/>").css("color", "#999").text(t("knxUltimateAI.messages.etsNoGateway", "Select a KNX gateway.")));
                        updateEtsCount();
                        return;
                    }
                    $.getJSON("knxUltimatecsv?nodeID=" + encodeURIComponent(serverId), function (data) {
                        list.empty();
                        if (!Array.isArray(data) || data.length === 0) {
                            list.append($("<div/>").css("color", "#999").text(t("knxUltimateAI.messages.etsNoGa", "No group addresses found. Import the ETS list in the KNX gateway.")));
                            updateEtsCount();
                            return;
                        }
                        data.forEach(function (item) {
                            if (!item || !item.ga) return;
                            const row = $("<div/>").addClass("knx-ai-ets-ga-row").css({
                                display: "flex", gap: "8px", alignItems: "center", padding: "3px 2px",
                                width: "100%", whiteSpace: "nowrap", cursor: "pointer", borderBottom: "1px solid #f3f3f3"
                            }).appendTo(list);
                            const include = $("<input/>", { type: "checkbox", class: "knx-ai-ets-ga-cb", value: item.ga, style: "width:auto; margin:0; flex:0 0 auto;" }).appendTo(row);
                            include.prop("checked", exposeConfigured ? savedSet.has(item.ga) : true);
                            $("<span/>").css({ flex: "0 0 auto", fontFamily: "monospace", minWidth: "64px" }).text(item.ga).appendTo(row);
                            const name = String(item.devicename || item.ga);
                            $("<span/>").addClass("knx-ai-ets-ga-name").css({ flex: "1 1 auto", minWidth: "0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "#444" }).text(name).attr("title", name).appendTo(row);
                            $("<span/>").css({ flex: "0 0 auto", color: "#888", fontSize: "11px" }).text("DPT" + (item.dpt || "")).appendTo(row);
                            const readOnlyLabel = $("<label/>").css({ flex: "0 0 auto", display: "flex", alignItems: "center", gap: "3px", margin: "0", fontSize: "11px", color: "#888", cursor: "pointer" }).appendTo(row);
                            const readOnly = $("<input/>", { type: "checkbox", class: "knx-ai-ets-ga-ro", value: item.ga, style: "width:auto; margin:0;" }).appendTo(readOnlyLabel);
                            readOnly.prop("checked", readOnlySet.has(item.ga));
                            $("<span/>").text(t("knxUltimateAI.messages.etsReadOnly", "Read only")).appendTo(readOnlyLabel);
                            readOnlyLabel.on("click", function (event) { event.stopPropagation(); });
                            row.on("click", function (event) {
                                if (event.target === include[0] || event.target === readOnly[0]) return;
                                include.prop("checked", !include.prop("checked"));
                                updateEtsCount();
                            });
                        });
                        $("#knx-ai-ets-ga-list input.knx-ai-ets-ga-cb").on("change", updateEtsCount);
                        updateEtsCount();
                    }).fail(function () {
                        list.empty().append($("<div/>").css("color", "#c0392b").text(t("knxUltimateAI.messages.etsCsvError", "Unable to load the group address list from the gateway.")));
                        updateEtsCount();
                    });
                };

                $("#knx-ai-ets-ga-all").on("click", function (event) { event.preventDefault(); $("#knx-ai-ets-ga-list .knx-ai-ets-ga-row:visible").find("input.knx-ai-ets-ga-cb").prop("checked", true); updateEtsCount(); });
                $("#knx-ai-ets-ga-none").on("click", function (event) { event.preventDefault(); $("#knx-ai-ets-ga-list .knx-ai-ets-ga-row:visible").find("input.knx-ai-ets-ga-cb").prop("checked", false); updateEtsCount(); });
                $("#knx-ai-ets-ga-ro-all").on("click", function (event) { event.preventDefault(); $("#knx-ai-ets-ga-list .knx-ai-ets-ga-row:visible").find("input.knx-ai-ets-ga-ro").prop("checked", true); });
                $("#knx-ai-ets-ga-ro-none").on("click", function (event) { event.preventDefault(); $("#knx-ai-ets-ga-list .knx-ai-ets-ga-row:visible").find("input.knx-ai-ets-ga-ro").prop("checked", false); });
                $("#knx-ai-ets-ga-filter").on("input", function () {
                    const term = String($(this).val() || "").toLowerCase();
                    $("#knx-ai-ets-ga-list .knx-ai-ets-ga-row").each(function () {
                        $(this).toggle($(this).text().toLowerCase().indexOf(term) !== -1);
                    });
                });
                $("#node-input-server").on("change.knxAiEtsAccess", buildEtsGaList);
                buildEtsGaList();
            } catch (error) { }

            const applyChatEditorOptions = (editor) => {
                try {
                    if (!editor) return;
                    if (typeof editor.updateOptions === "function") {
                        editor.updateOptions({
                            lineNumbers: "off",

                return tokens.toLocaleString();

                const $lastPromptUsage = $("#knx-ai-chat-context-last-prompt");
                if (!overview || typeof overview !== "object") {
                    lastChatContextOverview = null;
                    $content.hide();
                    $status
                        .text(t("knxUltimateAI.messages.chatContextUnavailable", "The chat context summary is temporarily unavailable."))
                        .show();
                    return;
                }
                lastChatContextOverview = overview;

                const addRow = function ($list, title, description, pathText, badge) {
                    const $row = $("<div></div>").addClass("knx-ai-detected-adapter");
                    const $main = $("<div></div>").addClass("knx-ai-detected-adapter-main");
                    $("<div></div>").text(title || "").appendTo($main);
                    if (description) {
                        $("<div></div>").addClass("knx-ai-chat-context-description").text(description).appendTo($main);
                    }
                    if (pathText) {
                        $("<div></div>").addClass("knx-ai-chat-context-path").text(pathText).appendTo($main);
                    }
                    $main.appendTo($row);
                    $("<span></span>").addClass("knx-ai-detected-adapter-badge").text(badge).appendTo($row);
                    $row.appendTo($list);
                };

                const formatBytes = function (value) {
                    const bytes = Math.max(0, Number(value) || 0);
                    if (bytes >= (1024 * 1024)) return (bytes / (1024 * 1024)).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " MB";
                    if (bytes >= 1024) return (bytes / 1024).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " KB";
                    return bytes.toLocaleString() + " B";
                };

                const contextLimit = overview.contextLimit && typeof overview.contextLimit === "object" ? overview.contextLimit : {};
                const deployedProvider = String(contextLimit.provider || "").toLowerCase();
                const currentProvider = String($("#node-input-llmProvider").val() || deployedProvider).toLowerCase();
                let contextLimitTokens = currentProvider === deployedProvider
                    ? Math.max(0, Number(contextLimit.tokens) || 0)
                    : 0;
                const localProvider = currentProvider === "lmstudio" || currentProvider === "ollama";
                if (localProvider) {
                    const modelContextTokens = contextLimitTokens || Math.max(0, Number($("#node-input-llmContextLength").val()) || 0);
                    const selectedTokens = selectedLocalContextTokens();
                    contextLimitTokens = selectedTokens > 0
                        ? (modelContextTokens > 0 ? Math.min(modelContextTokens, selectedTokens) : selectedTokens)
                        : modelContextTokens;

                const contextLimitValue = contextLimitTokens
                    ? formatCompactContextTokens(contextLimitTokens) + " " + t("knxUltimateAI.messages.chatContextTokens", "tokens")
                    : t("knxUltimateAI.messages.chatContextProviderManaged", "managed by the selected provider/model");
                const localBudgetValue = localProvider
                    ? " · " + t("knxUltimateAI.messages.localContextBudget", "Local chat context") + ": " + selectedLocalContextLabel()
                    : "";
                $contextLimit
                    .text(t("knxUltimateAI.messages.chatContextLimitLabel", "Maximum operational context") + ": " + contextLimitValue + localBudgetValue)
                    .attr("title", contextLimitTokens ? contextLimitTokens.toLocaleString() + " tokens" : contextLimitValue);

                const promptUsage = overview.lastPromptUsage && typeof overview.lastPromptUsage === "object" ? overview.lastPromptUsage : null;
                if (promptUsage && Number(promptUsage.bytes) > 0) {
                    const exactInputTokens = Math.max(0, Number(promptUsage.exactInputTokens) || 0);
                    const estimatedInputTokens = Math.max(0, Number(promptUsage.estimatedInputTokens) || 0);
                    const tokenText = exactInputTokens
                        ? formatCompactContextTokens(exactInputTokens) + " " + t("knxUltimateAI.messages.chatContextExactInputTokens", "input tokens measured by the provider")
                        : "~" + formatCompactContextTokens(estimatedInputTokens) + " " + t("knxUltimateAI.messages.chatContextEstimatedInputTokens", "estimated input tokens");
                    const imageText = Number(promptUsage.imageCount) > 0
                        ? " · " + Number(promptUsage.imageCount).toLocaleString() + " " + t("knxUltimateAI.messages.chatContextImages", "images")
                        : "";
                    $lastPromptUsage.text(
                        t("knxUltimateAI.messages.chatContextLastPromptLabel", "Last chat prompt actual size") + ": " +
                        formatBytes(promptUsage.bytes) + " · " + tokenText + imageText

                        t("knxUltimateAI.messages.chatContextLastPromptUnavailable", "not available until the first chat request")
                    );

                const sourceLabels = {

                    etsProject: t("knxUltimateAI.messages.chatContextSourceEtsProject", "Complete selected semantic ETS catalog for cloud models. Local models receive the full catalog when it fits; otherwise they receive a window-sized manifest and exact model-requested details. Function source only for explicit code review."),
                    memoryEducation: t("knxUltimateAI.messages.chatContextSourceMemoryEducation", "Session context, AI Education, bounded home memory and active plans."),

                    schedules: t("knxUltimateAI.messages.chatContextFileSchedules", "Authoritative structured plans and reminders for this node."),
                    schedulesReadable: t("knxUltimateAI.messages.chatContextFileSchedulesReadable", "Human-readable plans and reminders generated from the scheduler state."),
                    assistantConfig: t("knxUltimateAI.messages.chatContextFileAssistantConfig", "Persistent Cerebrum configuration and semantic areas for this node."),
                    lastChatPrompt: t("knxUltimateAI.messages.chatContextFileLastChatPrompt", "Temporary local copy of the latest system and user messages sent to the chat model; overwritten on every chat request.")
                };

                    );

                const directoryLabels = {
                    archiveRoot: t("knxUltimateAI.messages.chatContextDirectoryRoot", "Telegram archive root"),
                    nodeArchive: t("knxUltimateAI.messages.chatContextDirectoryNode", "This node's telegram archive"),
                    adapterArchiveRoot: t("knxUltimateAI.messages.chatContextDirectoryAdapterRoot", "Adapter event archive root"),
                    adapterNodeArchive: t("knxUltimateAI.messages.chatContextDirectoryAdapterNode", "This node's adapter event archive")
                };
                (Array.isArray(overview.telegramDirectories) ? overview.telegramDirectories : []).forEach(function (item) {

                        /^adapter/.test(String(item.id || ""))

                            : t("knxUltimateAI.messages.chatContextDirectoryBadge", "KNX")

                $("#knx-ai-chat-context-pattern")
                    .text(t("knxUltimateAI.messages.chatContextTelegramPattern", "Daily files") + ": " + String(overview.telegramFilePattern || "YYYY-MM-DD.knxctx"));
                $status.hide();
                $content.show();
            };
            const editorLanguage = String((RED.settings && RED.settings.lang) || (window.navigator && window.navigator.language) || "en");
            const loadKnxAiOverview = function (refreshSetup) {

            const openKnxAiWebPage = function (view, prompt) {

            const updateLocalContextTokenOptions = (detail) => {
                const $select = $("#node-input-llmLocalContextTokens");

                $select.find("option[data-context-tokens]").each(function () {
                    const optionTokens = Math.max(0, Number($(this).attr("data-context-tokens")) || 0);

            };

            const setLocalModelContextStatus = (detail, state, errorText) => {
                const $status = $("#knx-ai-local-context-status");
                const provider = $("#node-input-llmProvider").val();
                updateLocalContextTokenOptions(detail);
                if (!$status.length || (provider !== "lmstudio" && provider !== "ollama") || !detail) {
                    $status.hide();
                    return;
                }
                const maxTokens = formatContextTokens(detail.maxContextLength);
                const loadedTokens = formatContextTokens(detail.loadedContextLength);
                let text = t("knxUltimateAI.messages.lmStudioContextAvailable", "Maximum model context") + ": " + maxTokens + " token";
                let color = "#555";
                if (state === "loading") {
                    text = t("knxUltimateAI.messages.lmStudioContextLoading", "Checking the active model context") + "…";
                    color = "#1565c0";
                } else if (state === "inactive") {
                    text = t("knxUltimateAI.messages.lmStudioContextInactive", "Model inactive; Bionic defaults will be used on the first request");
                    color = "#555";
                } else if (state === "configured") {
                    const configuredTokens = formatContextTokens(detail.configuredContextLength || detail.loadedContextLength || detail.maxContextLength);
                    text = t("knxUltimateAI.messages.lmStudioContextConfigured", "Active model context") + ": " + configuredTokens + " token";
                    color = "#2e7d32";
                } else if (state === "error") {
                    text = String(errorText || t("knxUltimateAI.messages.lmStudioContextFailed", "Unable to configure the model context"));
                    color = "#c62828";
                } else if (detail.loadedContextLength > 0) {
                    text += " · " + t("knxUltimateAI.messages.lmStudioContextCurrentlyLoaded", "currently loaded") + ": " + loadedTokens + " token";
                }
                text += " · " + t("knxUltimateAI.messages.localContextBudget", "Local chat context") + ": " + selectedLocalContextLabel();
                $status.text(text).css("color", color).show();
            };

            const populateModels = (models, modelDetails) => {
                localModelDetailsById = new Map();
                (modelDetails || []).forEach(function (detail) {
                    if (detail && detail.id) localModelDetailsById.set(String(detail.id), detail);
                });
                availableModelItems = (models || []).map(function (m) {
                    const detail = localModelDetailsById.get(String(m));
                    const label = detail
                        ? String(detail.displayName || detail.id) + " · " + formatContextTokens(detail.maxContextLength) + " token"
                        : String(m);
                    return { label: label, value: String(m) };
                });
            };

            const configureModelPicker = () => {
                const $model = $("#node-input-llmModel");
                if (!$model.length || typeof $model.autocomplete !== "function") return;
                $model.autocomplete({
                    minLength: 0,
                    source: function (request, response) {
                        const term = String(request && request.term ? request.term : "").trim().toLowerCase();
                        if (!term) {
                            response(availableModelItems.slice());
                            return;
                        }
                        response(availableModelItems.filter(function (item) {
                            return item.value.toLowerCase().includes(term) || item.label.toLowerCase().includes(term);
                        }));
                    },
                    select: function (event, ui) {
                        $(this).val(ui.item.value).trigger("change");
                        return false;
                    }
                });
                $model.on("mousedown.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = true;
                }).on("focus.knxUltimateAiModelPicker", function () {
                    if (!modelPickerMouseDown) $(this).autocomplete("search", "");
                }).on("click.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = false;
                    const input = this;
                    setTimeout(function () {
                        try { $(input).autocomplete("search", ""); } catch (error) { }
                    }, 0);
                }).on("blur.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = false;
                });
            };

            configureModelPicker();

            const normalizeUrl = (value) => String(value || "").trim().replace(/\/+$/, "").toLowerCase();
            const isOpenAiDefaultUrl = (value) => normalizeUrl(value) === normalizeUrl(OPENAI_COMPAT_DEFAULT_CHAT_URL);
            const isOllamaDefaultUrl = (value) => normalizeUrl(value) === normalizeUrl(OLLAMA_DEFAULT_CHAT_URL);
            const isOpenAiDefaultModel = (value) => OPENAI_COMPAT_DEFAULT_MODELS.indexOf(String(value || "").trim().toLowerCase()) >= 0;
            const DEFAULT_CHAT_URLS = [OPENAI_COMPAT_DEFAULT_CHAT_URL, OLLAMA_DEFAULT_CHAT_URL, ANTHROPIC_DEFAULT_CHAT_URL, LMSTUDIO_DEFAULT_CHAT_URL];
            const DEFAULT_MODELS = OPENAI_COMPAT_DEFAULT_MODELS.concat([OLLAMA_DEFAULT_MODEL, ANTHROPIC_DEFAULT_MODEL]);
            const isAnyDefaultUrl = (value) => DEFAULT_CHAT_URLS.some((u) => normalizeUrl(u) === normalizeUrl(value));
            const isAnyDefaultModel = (value) => DEFAULT_MODELS.indexOf(String(value || "").trim().toLowerCase()) >= 0;

            const applyProviderDefaults = (provider) => {
                const $baseUrl = $("#node-input-llmBaseUrl");
                const $model = $("#node-input-llmModel");
                const currentBaseUrl = String($baseUrl.val() || "").trim();
                const currentModel = String($model.val() || "").trim();

                const urlByProvider = { ollama: OLLAMA_DEFAULT_CHAT_URL, anthropic: ANTHROPIC_DEFAULT_CHAT_URL, lmstudio: LMSTUDIO_DEFAULT_CHAT_URL, openai_compat: OPENAI_COMPAT_DEFAULT_CHAT_URL };
                const modelByProvider = { ollama: OLLAMA_DEFAULT_MODEL, anthropic: ANTHROPIC_DEFAULT_MODEL, lmstudio: "", openai_compat: OPENAI_COMPAT_DEFAULT_MODELS[0] };
                const targetUrl = urlByProvider[provider] || OPENAI_COMPAT_DEFAULT_CHAT_URL;
                const targetModel = Object.prototype.hasOwnProperty.call(modelByProvider, provider)
                    ? modelByProvider[provider]
                    : OPENAI_COMPAT_DEFAULT_MODELS[0];

                // Only overwrite when the field is empty or still holds another provider's default,
                // so a user's custom base URL / model is never clobbered when switching providers.
                if (!currentBaseUrl || isAnyDefaultUrl(currentBaseUrl)) $baseUrl.val(targetUrl);
                if (!currentModel || isAnyDefaultModel(currentModel)) $model.val(targetModel);
            };

            const configureSelectedLocalModel = () => {
                const provider = $("#node-input-llmProvider").val();
                if (provider !== "lmstudio" && provider !== "ollama") return;
                const model = String($("#node-input-llmModel").val() || "").trim();
                const detail = localModelDetailsById.get(model);
                if (!detail || !(Number(detail.maxContextLength) > 0)) {
                    $("#node-input-llmContextLength").val(0);
                    updateLocalContextTokenOptions(null);
                    setLocalModelContextStatus(null);
                    return;
                }

                const requestVersion = ++localContextRequestVersion;
                const activeContextLength = Number(detail.loadedContextLength) > 0
                    ? Number(detail.loadedContextLength)
                    : Number(detail.maxContextLength);
                $("#node-input-llmContextLength").val(activeContextLength);
                if (provider === "ollama") {
                    detail.configuredContextLength = Number(detail.maxContextLength);
                    $("#node-input-llmContextLength").val(detail.configuredContextLength);
                    setLocalModelContextStatus(detail);
                    return;
                }

                setLocalModelContextStatus(detail, "loading");
                $("#node-input-llmModel").prop("disabled", true);
                $("#knx-ai-refreshModels").prop("disabled", true);

                const payload = {
                    nodeId: nodeId,
                    baseUrl: $("#node-input-llmBaseUrl").val() || LMSTUDIO_DEFAULT_CHAT_URL,
                    model: model,
                    localContextTokens: selectedLocalContextTokens()
                };
                const apiKey = $("#node-input-llmApiKey").val() || "";
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                $.ajax({
                    url: "knxUltimateAI/lmstudio/select-model",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        if (requestVersion !== localContextRequestVersion) return;
                        const resolvedContextLength = Math.max(0, Number(data && data.contextLength) || 0);
                        detail.loadedContextLength = data && data.active === true ? resolvedContextLength : 0;
                        detail.configuredContextLength = resolvedContextLength;
                        $("#node-input-llmContextLength").val(resolvedContextLength);
                        setLocalModelContextStatus(detail, data && data.active === true ? "configured" : "inactive");
                    })
                    .fail(function (xhr) {
                        if (requestVersion !== localContextRequestVersion) return;
                        let errorText = t("knxUltimateAI.messages.lmStudioContextFailed", "Unable to configure the model context");
                        try {
                            if (xhr && xhr.responseJSON && xhr.responseJSON.error) errorText = xhr.responseJSON.error;
                        } catch (e) { }
                        setLocalModelContextStatus(detail, "error", errorText);
                        try { RED.notify(errorText, "error"); } catch (e) { }
                    })
                    .always(function () {
                        if (requestVersion !== localContextRequestVersion) return;
                        $("#node-input-llmModel").prop("disabled", false);
                        $("#knx-ai-refreshModels").prop("disabled", false);
                    });
            };

            const refreshModels = () => {
                const provider = $("#node-input-llmProvider").val();
                const baseUrl = $("#node-input-llmBaseUrl").val() || "";
                const apiKey = $("#node-input-llmApiKey").val() || "";
                const payload = { nodeId: nodeId, provider: provider, baseUrl: baseUrl };
                if (provider === "ollama") payload.autoStart = true;
                // Node-RED uses "__PWRD__" as placeholder for stored credentials: don't send it.
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                setRefreshModelsBusy(true);

                $.ajax({
                    url: "knxUltimateAI/models",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        const models = (data && data.models) ? data.models : [];
                        populateModels(models, data && data.modelDetails);
                        let selectedAutomatically = false;
                        if (provider === "lmstudio" && models.length > 0 && !String($("#node-input-llmModel").val() || "").trim()) {
                            $("#node-input-llmModel").val(models[0]);
                            selectedAutomatically = true;
                        }
                        if (provider === "lmstudio" || provider === "ollama") {
                            const selectedDetail = localModelDetailsById.get(String($("#node-input-llmModel").val() || ""));
                            if (selectedDetail) {
                                setLocalModelContextStatus(selectedDetail);
                                configureSelectedLocalModel();
                            } else if (selectedAutomatically) {
                                configureSelectedLocalModel();
                            }
                        }
                        if (provider === "ollama" && data && data.ollamaStarted) {
                            try {
                                const startedMsg = t('knxUltimateAI.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            } catch (e) { }
                        }
                        if (provider === "ollama" && models.length === 0) {
                            const msg = t('knxUltimateAI.messages.ollamaNoModels', "No local Ollama model found. Install one from https://ollama.com/library.");
                            try { RED.notify(msg, "warning"); } catch (e) { }
                        }
                    })
                    .fail(function (xhr) {
                        let err = "Failed to load models";
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                    })
                    .always(function () {
                        setRefreshModelsBusy(false);
                    });
            };

            const installOllamaModel = () => {
                const provider = $("#node-input-llmProvider").val();
                if (provider !== "ollama") return;
                const baseUrl = $("#node-input-llmBaseUrl").val() || "";
                const model = String($("#node-input-llmModel").val() || "").trim() || OLLAMA_DEFAULT_MODEL;
                const payload = { nodeId: nodeId, baseUrl: baseUrl, model: model };

                $("#knx-ai-refreshModels").prop("disabled", true);
                setOllamaInstallUiState(true);

                $.ajax({
                    url: "knxUltimateAI/ollama/pull",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        try {
                            const okMsg = t('knxUltimateAI.messages.installedOllamaModel', "Ollama model installed") + ": " + model;
                            RED.notify(okMsg, "success");
                            if (data && data.ollamaStarted) {
                                const startedMsg = t('knxUltimateAI.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            }
                        } catch (e) { }
                        refreshModels();
                    })
                    .fail(function (xhr) {
                        let err = t('knxUltimateAI.messages.installOllamaModelFailed', "Failed to install Ollama model");
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                        $("#knx-ai-refreshModels").prop("disabled", false);
                    })
                    .always(function () {
                        setOllamaInstallUiState(false);
                    });
            };

            const openOllamaLibrary = () => {
                const wnd = window.open(OLLAMA_LIBRARY_URL, "_blank", "noopener,noreferrer");
                try { if (wnd && typeof wnd.focus === "function") wnd.focus(); } catch (e) { }
            };

            const toggleProvider = ({ applyDefaults = false, autoLoadModels = false } = {}) => {
                const provider = $("#node-input-llmProvider").val();
                const localProvider = provider === "lmstudio" || provider === "ollama";
                if (applyDefaults) applyProviderDefaults(provider);
                $("#knx-ai-local-context-row").toggle(localProvider);
                if (localProvider) {
                    updateLocalContextTokenOptions(localModelDetailsById.get(String($("#node-input-llmModel").val() || "").trim()));
                }
                if (provider === "ollama") {
                    $("#knx-ai-apikey-row").hide();
                    $("#knx-ai-ollama-install-row").show();
                    if (autoLoadModels) refreshModels();
                } else {
                    $("#knx-ai-apikey-row").show();
                    $("#knx-ai-ollama-install-row").hide();
                    if (provider === "lmstudio" && autoLoadModels) refreshModels();
                    if (provider !== "lmstudio") {
                        $("#node-input-llmContextLength").val(0);
                        if (provider !== "ollama") $("#knx-ai-local-context-status").hide();
                    }
                }
            };
            const toggleWebAccess = () => {
                const enabled = $("#node-input-webAccessEnabled").prop("checked") === true;
                $("#knx-ai-web-access-settings").toggle(enabled);
            };
            $("#node-input-webAccessEnabled").on("change", toggleWebAccess);
            toggleWebAccess();
            $("#node-input-llmProvider").on("change", function () {
                toggleProvider({ applyDefaults: true, autoLoadModels: true });
            });
            toggleProvider({ applyDefaults: true });

            $("#knx-ai-refreshModels").on("click", function (evt) {
                evt.preventDefault();
                refreshModels();
            });
            $("#node-input-llmModel").on("change", function () {
                configureSelectedLocalModel();
            });
            $("#node-input-llmLocalContextTokens").on("change", function () {
                const detail = localModelDetailsById.get(String($("#node-input-llmModel").val() || "").trim());
                updateLocalContextTokenOptions(detail);
                if (detail) setLocalModelContextStatus(detail, detail.loadedContextLength > 0 ? "configured" : undefined);
            });
            $("#knx-ai-downloadOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                openOllamaLibrary();
            });
            $("#knx-ai-installOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                installOllamaModel();
            });
        },
        oneditsave: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            try {
                const checkboxes = $("#knx-ai-ets-ga-list input.knx-ai-ets-ga-cb");
                if (checkboxes.length > 0) {
                    const exposed = [];
                    const readOnly = [];
                    checkboxes.each(function () { if ($(this).is(":checked")) exposed.push($(this).val()); });
                    $("#knx-ai-ets-ga-list input.knx-ai-ets-ga-ro").each(function () { if ($(this).is(":checked")) readOnly.push($(this).val()); });
                    this.etsExposedGAs = exposed;
                    this.etsReadOnlyGAs = readOnly;
                    this.etsExposeConfigured = true;
                }
            } catch (error) { }
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.getValue === "function") {
                    this.chatInputCode = this.chatInputCodeEditor.getValue();
                    $("#node-input-chatInputCode").val(this.chatInputCode);
                }
            } catch (error) { }
            try {
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.getValue === "function") {
                    this.chatOutputCode = this.chatOutputCodeEditor.getValue();
                    $("#node-input-chatOutputCode").val(this.chatOutputCode);
                }
            } catch (error) { }
            try {
                if (typeof this._destroyKnxAiChatEditors === "function") this._destroyKnxAiChatEditors();
            } catch (error) { }
            delete this._destroyKnxAiChatEditors;
        },
        oneditcancel: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            try {
                if (typeof this._destroyKnxAiChatEditors === "function") this._destroyKnxAiChatEditors();
            } catch (error) { }
            delete this._destroyKnxAiChatEditors;
        },
        oneditresize: function () {
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.resize === "function") this.chatInputCodeEditor.resize();
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.resize === "function") this.chatOutputCodeEditor.resize();
            } catch (error) { }
        }
    })
    // The historical type remains registered so deployed flows keep loading,
    // but new Cerebrum nodes belong to node-red-contrib-cerebrum-ultimate.
    try { RED.palette.remove('knxUltimateAI'); } catch (error) { }
</script>

                    <div id="knx-ai-setup-doctor-status" data-i18n="knxUltimateAI.messages.setupDoctorLoading"></div>

                        <div class="knx-ai-setup-doctor-hero">

    </div>

    <div id="knx-ai-accordion-source" style="display:none;">

        <div id="knx-ai-tab-llm-connection">
            <div class="form-row">
                <input type="checkbox" id="node-input-llmEnabled" style="display:inline-block; width:auto; vertical-align:top;">
                <label style="width:auto" for="node-input-llmEnabled">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmEnabled"></span></label>
            </div>

            <div id="knx-ai-llm-connection-settings">
                <div class="form-row">
                    <label style="width:290px" for="node-input-llmProvider"><i class="fa fa-cog"></i> <span data-i18n="knxUltimateAI.properties.llmProvider"></span></label>
                    <select style="width:100%" id="node-input-llmProvider">
                        <option value="openai_compat" data-i18n="knxUltimateAI.selectlists.llmProvider.openai_compat"></option>
                        <option value="anthropic" data-i18n="knxUltimateAI.selectlists.llmProvider.anthropic"></option>
                        <option value="ollama" data-i18n="knxUltimateAI.selectlists.llmProvider.ollama"></option>
                        <option value="lmstudio" data-i18n="knxUltimateAI.selectlists.llmProvider.lmstudio"></option>
                    </select>
                </div>
                <div class="form-row" id="knx-ai-apikey-row">
                    <label style="width:290px" for="node-input-llmApiKey"><i class="fa fa-key"></i> <span data-i18n="knxUltimateAI.properties.llmApiKey"></span></label>
                    <input type="password" id="node-input-llmApiKey" data-i18n="[placeholder]knxUltimateAI.placeholder.llmApiKey">
                </div>

                <div class="form-row">
                    <label style="width:290px" for="node-input-llmModel"><i class="fa fa-cube"></i> <span data-i18n="knxUltimateAI.properties.llmModel"></span></label>
                    <input style="width:calc(100% - 110px)" type="text" id="node-input-llmModel" autocomplete="off" data-i18n="[placeholder]knxUltimateAI.placeholder.llmModel">
                    <button type="button" class="red-ui-button" id="knx-ai-refreshModels" style="margin-left:6px;" title="Refresh models">
                        <i class="fa fa-refresh"></i> <span data-i18n="knxUltimateAI.buttons.refreshModels"></span>
                    </button>
                </div>
                <div class="form-row">
                    <label style="width:290px" for="node-input-llmReasoningEffort"><i class="fa fa-tachometer"></i> <span data-i18n="knxUltimateAI.properties.llmReasoningEffort"></span></label>
                    <select style="width:100%" id="node-input-llmReasoningEffort">
                        <option value="default" data-i18n="knxUltimateAI.selectlists.reasoningEffort.default"></option>
                        <option value="none" data-i18n="knxUltimateAI.selectlists.reasoningEffort.none"></option>
                        <option value="minimal" data-i18n="knxUltimateAI.selectlists.reasoningEffort.minimal"></option>
                        <option value="low" data-i18n="knxUltimateAI.selectlists.reasoningEffort.low"></option>
                        <option value="medium" data-i18n="knxUltimateAI.selectlists.reasoningEffort.medium"></option>
                        <option value="high" data-i18n="knxUltimateAI.selectlists.reasoningEffort.high"></option>
                        <option value="xhigh" data-i18n="knxUltimateAI.selectlists.reasoningEffort.xhigh"></option>
                        <option value="max" data-i18n="knxUltimateAI.selectlists.reasoningEffort.max"></option>
                    </select>
                    <div class="knx-ai-prompt-context-hint" data-i18n="knxUltimateAI.messages.reasoningEffortHint"></div>
                </div>
                <input type="hidden" id="node-input-llmContextLength">
                <div id="knx-ai-local-context-status" style="display:none;"></div>
                <div class="form-row" id="knx-ai-local-context-row" style="display:none;">
                    <label style="width:290px" for="node-input-llmLocalContextTokens"><i class="fa fa-database"></i> <span data-i18n="knxUltimateAI.properties.llmLocalContextTokens"></span></label>
                    <select style="width:100%" id="node-input-llmLocalContextTokens">
                        <option value="0" data-i18n="knxUltimateAI.selectlists.localContext.maximum"></option>
                        <option value="4096" data-context-tokens="4096" data-i18n="knxUltimateAI.selectlists.localContext.k4"></option>
                        <option value="8192" data-context-tokens="8192" data-i18n="knxUltimateAI.selectlists.localContext.k8"></option>
                        <option value="16384" data-context-tokens="16384" data-i18n="knxUltimateAI.selectlists.localContext.k16"></option>
                        <option value="32768" data-context-tokens="32768" data-i18n="knxUltimateAI.selectlists.localContext.k32"></option>
                        <option value="65536" data-context-tokens="65536" data-i18n="knxUltimateAI.selectlists.localContext.k64"></option>
                        <option value="131072" data-context-tokens="131072" data-i18n="knxUltimateAI.selectlists.localContext.k128"></option>
                        <option value="262144" data-context-tokens="262144" data-i18n="knxUltimateAI.selectlists.localContext.k256"></option>
                    </select>
                    <div class="knx-ai-prompt-context-hint" data-i18n="knxUltimateAI.messages.localContextHint"></div>
                </div>
                <div class="form-row">
                    <input type="checkbox" id="node-input-llmAllowKnxCommands" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmAllowKnxCommands">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmAllowKnxCommands"></span></label>
                </div>
                <div class="form-row" id="knx-ai-command-confirmation-row">
                    <input type="checkbox" id="node-input-llmRequireCommandConfirmation" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmRequireCommandConfirmation">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.llmRequireCommandConfirmation"></span></label>
                </div>
            </div>
        </div>

        <div id="knx-ai-tab-chat-adapter">
            <div class="form-row">
                <label style="width:290px" for="node-input-chatAdapterPreset"><i class="fa fa-plug"></i> <span data-i18n="knxUltimateAI.properties.chatAdapterPreset"></span></label>
                <select style="width:100%" id="node-input-chatAdapterPreset">
                    <option value="none" data-i18n="knxUltimateAI.selectlists.chatAdapter.none"></option>
                </select>
            </div>
            <div id="knx-ai-chat-adapter-fields" style="display:none;">
                <div class="form-row">
                    <label style="width:100%" for="node-input-chatInputCode"><i class="fa fa-sign-in"></i> <span data-i18n="knxUltimateAI.properties.chatInputCode"></span></label>
                    <input type="hidden" id="node-input-chatInputCode">
                    <div id="node-input-chatInputCode-editor" class="node-text-editor knx-ai-chat-adapter-editor"></div>
                </div>
                <div class="form-row">
                    <label style="width:100%" for="node-input-chatOutputCode"><i class="fa fa-sign-out"></i> <span data-i18n="knxUltimateAI.properties.chatOutputCode"></span></label>
                    <input type="hidden" id="node-input-chatOutputCode">
                    <div id="node-input-chatOutputCode-editor" class="node-text-editor knx-ai-chat-adapter-editor"></div>
                </div>
            </div>
        </div>

        <div id="knx-ai-tab-home-intelligence">
            <div class="form-row">
                <strong><i class="fa fa-globe"></i> <span data-i18n="knxUltimateAI.sections.webIntelligence"></span></strong>
            </div>
            <div class="form-row">
                <input type="checkbox" id="node-input-webAccessEnabled" style="display:inline-block; width:auto; vertical-align:top;">
                <label style="width:auto" for="node-input-webAccessEnabled">&nbsp;&nbsp;<span data-i18n="knxUltimateAI.properties.webAccessEnabled"></span></label>
                <!-- <div class="knx-ai-prompt-context-hint" data-i18n="knxUltimateAI.messages.webAccessHint"></div> -->
            </div>
            <div id="knx-ai-web-access-settings">
                <div class="form-row">
                    <label style="width:290px" for="node-input-webMaxCallsPerHour"><i class="fa fa-tachometer"></i> <span data-i18n="knxUltimateAI.properties.webMaxCallsPerHour"></span></label>
                    <input type="number" id="node-input-webMaxCallsPerHour" min="1" max="60" step="1" style="width:100%;">
                    <!-- <div class="knx-ai-prompt-context-hint" data-i18n="knxUltimateAI.messages.webBudgetHint"></div> -->
                </div>
            </div>
            <hr>
            <div class="form-row">
                <label style="width:100%" for="node-input-aiEducation"><i class="fa fa-graduation-cap"></i> <span data-i18n="knxUltimateAI.properties.aiEducation"></span></label>
                <textarea id="node-input-aiEducation" maxlength="16000" style="width:100%; min-height:180px; box-sizing:border-box;" data-i18n="[placeholder]knxUltimateAI.placeholder.aiEducation"></textarea>
            </div>
        </div>

        <div id="knx-ai-tab-ets-access">
            <div class="form-row">
                <div class="knx-ai-prompt-context-hint" data-i18n="knxUltimateAI.messages.etsAccessHint"></div>
                <div style="margin:8px 0 4px; display:flex; gap:6px; align-items:center;">
                    <input type="text" id="knx-ai-ets-ga-filter" data-i18n="[placeholder]knxUltimateAI.messages.etsFilterPlaceholder" style="flex:1 1 auto;">
                    <button type="button" id="knx-ai-ets-ga-all" class="ui-button ui-corner-all ui-widget" style="width:auto;" data-i18n="knxUltimateAI.buttons.etsSelectAll"></button>
                    <button type="button" id="knx-ai-ets-ga-none" class="ui-button ui-corner-all ui-widget" style="width:auto;" data-i18n="knxUltimateAI.buttons.etsSelectNone"></button>
                    <span style="border-left:1px solid #ccc; align-self:stretch;"></span>
                    <button type="button" id="knx-ai-ets-ga-ro-all" class="ui-button ui-corner-all ui-widget" style="width:auto;" data-i18n="[title]knxUltimateAI.messages.etsReadOnlyBulk;knxUltimateAI.buttons.etsReadOnlyAll"></button>
                    <button type="button" id="knx-ai-ets-ga-ro-none" class="ui-button ui-corner-all ui-widget" style="width:auto;" data-i18n="[title]knxUltimateAI.messages.etsReadOnlyBulk;knxUltimateAI.buttons.etsReadOnlyNone"></button>
                </div>
                <div id="knx-ai-ets-ga-count" style="font-size:11px; color:#666; margin:2px 0;"></div>
                <div id="knx-ai-ets-ga-list" style="max-height:220px; overflow:auto; border:1px solid #ccc; padding:6px; border-radius:4px; background:#fff;"></div>
            </div>
        </div>

        <div id="knx-ai-tab-advanced">
            <div id="knx-ai-llm-advanced-settings">
                <div class="form-row">
                    <label style="width:290px" for="node-input-llmBaseUrl"><i class="fa fa-link"></i> <span data-i18n="knxUltimateAI.properties.llmBaseUrl"></span></label>
                    <input type="text" id="node-input-llmBaseUrl" data-i18n="[placeholder]knxUltimateAI.placeholder.llmBaseUrl">
                </div>
                <div class="form-row" id="knx-ai-ollama-install-row" style="display:none;">
                    <label style="width:290px"><i class="fa fa-download"></i> Ollama</label>
                    <div class="knx-ai-ollama-actions">
                        <button type="button" class="red-ui-button" id="knx-ai-downloadOllamaModel">
                            <i class="fa fa-cloud-download"></i> <span data-i18n="knxUltimateAI.buttons.downloadOllamaModel"></span>
                        </button>
                        <button type="button" class="red-ui-button" id="knx-ai-installOllamaModel">
                            <i class="fa fa-download"></i> <span data-i18n="knxUltimateAI.buttons.installOllamaModel"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
